  title: 'QuantEM: The Quantum Error Management Compiler'
- abstract: Simulating quantum systems on quantum computers requires compiling fermionic
    Hamiltonians into hardware-executable circuits, a process where efficiency and
    noise tolerance are critical. We build on the Treespilation pipeline, which synthesizes
    hardware-aware circuits by vertically integrating multiple compilation stages.
    We show that total Pauli weight serves as a computationally cheaper alternative
    metric for optimizing Treespilation's internal ternary tree representation. We
    further introduce noise-awareness into the pipeline by penalizing less reliable
    qubit couplings, reducing geometric mean two-qubit gate error rates by ~25% across
    multiple benchmarks.
