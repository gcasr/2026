- abstract: 'Programming irregular graph applications is challenging on today''s scalable
    supercomputers. We describe a novel programming model, KVMSR+UDWeave, that supports
    extreme scaling by exposing fine-grained parallelism.  By enabling the expression
    of maximum parallelism, it opens the door for extreme scaling, even on both small
    and large graph problems.


    KVMSR+UDWeave cleanly separates the three key dimensions of parallel programming:
    parallelism, computation binding, and data placement.  This decomposition reduces
    effort to achieve scalable, high-performance for graph algorithms on real-world,
    highly skewed graphs.  Key features of the UpDown supercomputer (computation location
    naming and shared global address space) enable decomposition and scalable, high
    performance.


    In the IARPA AGILE program, we built numerous graph benchmarks and workflows,
    and use them to illustrate the programming model.  Simulation results for UpDown
    show excellent strong-scaling to million-fold hardware parallelism and high absolute
    performance.  Results suggest KVMSR+UDWeave enables reduced programming effort
    for scaling the most demanding irregular applications.'
