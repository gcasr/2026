- abstract: 'High-Performance Computing (HPC) and large-scale AI systems now consume
    tens of megawatts of power, making energy efficiency a first-class design constraint
    alongside performance. Existing job-level power management relies on single-knob,
    static policies that fail to capture the complex interactions between multiple
    hardware controls, node power limits, GPU, CPU, and Uncore DVFS, across heterogeneous
    node configurations and dynamic workload phases.

    We aim to develop a multi-knob, job-level performance-energy optimization framework
    for any HPC system. The approach builds lightweight phase-aware response models
    describing how runtime and energy vary across different knob combinations at distinct
    phases of a workload. These models are learned online using a bandit controller
    interfacing directly with GEOPM (Global Extensible Open Power Manager), which
    enforces control decisions across all nodes allocated to a job in real time. By
    incorporating node-to-node hardware variability, the framework supports non-uniform
    power assignment across the node allocation redistributing power headroom toward
    nodes on the critical path to improve load balancing and total job throughput.

    The best knob configuration at each phase is identified by combining the learned
    response models with performance and facility power constraints, using the Energy-Delay
    Product (EDP) as the optimization objective. We aim to demonstrate measurable
    EDP reduction across representative HPC and large-scale AI workloads, establishing
    a generalizable foundation for adaptive multi-knob power optimization in heterogeneous
    environments.'
