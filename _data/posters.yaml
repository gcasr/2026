    and automatic. <br/><br/>Boris Glavic (https://www.cs.uic.edu/~bglavic/dbgroup/members/bglavic.html)
    is an Associate Professor in the Department of Computer Science at University
    of Illinois at Chicago leading the DBGroup. His research spans several areas of
    database systems and data science including data provenance, data integration,
    query execution and optimization, uncertain data, and data curation. Boris strives
    to build systems that are based on solid theoretical foundations.
  title: Speeding Up Transformation Search with Lightweight Statistics
- abstract: Continuous kinematic monitoring is essential for managing post-stroke
    hemiparesis, epilepsy, and geriatric mobility. However, existing solutions rely
    on centralized, smartphone-dependent architectures that suffer from packet loss
    and temporal de-synchronization. This research introduces a decentralized, dual-node
    STM32WB55 system designed to capture high-fidelity, synchronized 9-DOF data, including
    orientation quaternions and tri-axial acceleration, at a deterministic 100Hz sampling
    rate.  To ensure 100% data integrity, the system bypasses wireless streaming latency
    by logging data directly to 16GB Industrial MicroSD cards via a high-speed SPI
    interface. Optimized for clinical utility, each node is powered by a 500mAh Li-Po
    battery, supporting a 10-hour operational cycle that matches standard daily observation
    windows. The hardware is integrated into a compact wearable enclosure, maximizing
    patient compliance in real-world environments.  System accuracy is verified through
    a 2-DOF robotic validation rig utilizing SG92R servos, targeting an orientation
    error less than <2.5% against mechanical ground truth. This architecture provides
    a scalable foundation for precise, longitudinal biomechanical assessment, bridging
    the gap between laboratory-grade precision and ambulatory freedom.
  authors: Ananya Kankane
  board_number: L20
  institution: Illinois Institute of Technology
  long_bio: "Ananya Kankane is a Master\u2019s candidate in Autonomous Systems and\
    \ Robotics at the Illinois Institute of Technology, where she focuses on the intersection\
    \ of human-robot interaction and embedded systems. With a foundational background\
    \ in Mechanical Engineering from SVNIT, India, she has transitioned into a multidisciplinary\
    \ expert capable of leading complex mechatronic projects. Ananya\u2019s most impactful\
    \ work involves the development of Multi-Node Inertial Motion Capture devices,\
    \ where she engineered dual IMU wearable systems utilizing STM32WB microcontroller\
    \ to capture limb orientation data. Her expertise extends from hardware-level\
    \ innovations, such as designing custom Power Distribution Boards (PDBs) and compact\
    \ PCBs, to the software-level development of low-latency data pipelines synchronized\
    \ for real-time computer vision and gesture recognition.  <br/><br/>Beyond wearable\
    \ technology, Ananya has a proven track record of engineering high-stakes robotic\
    \ platforms, including six-degree-of-freedom planetary rovers and a government-funded\
    \ hexapod robot. Her technical versatility is further evidenced by her work on\
    \ Adaptive Cruise Control (ACC) with the Illinois Tech EcoCAR team and her experience\
    \ automating enterprise-level workflows during her tenure at Kraft Heinz. An accomplished\
    \ researcher and designer, Ananya combines deep proficiency in programming languages\
    \ like C++ and Python with advanced manufacturing skills to deliver robust, ergonomic,\
    \ and high-performance autonomous solutions."
