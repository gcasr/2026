- abstract: "Medovik: A Triple-Layered Approach to Practical Linux Compatibility in\
    \ TrustZone\nTrusted Execution Environments such as ARM TrustZone offer strong\
    \ hardware-backed isolation, yet their restrictive programming model makes them\
    \ difficult to use with standard Linux toolchains and legacy applications. Porting\
    \ non-trivial codebases into the secure world is often prohibitively expensive.\n\
    We introduce Medovik, a triple-layered sandbox that runs a WebAssembly runtime\
    \ inside OP-TEE, which in turn hosts an x86 emulator (Bochs). This design provides\
    \ a Linux-like environment behind three nested protection boundaries, at the expense\
    \ of significant performance overhead.\nOn a Neoverse-N1 CPU, the full stack exhibits\
    \ a 205.6\xD7 slowdown on CoreMark (2k) and a 219.6\xD7 slowdown on the compute-intensive\
    \ SPEC CPU2017 LBM benchmark (single-threaded).\nTo mitigate this overhead, we\
    \ developed a punch-through hypercall mechanism that selectively bypasses abstraction\
    \ layers for hot paths. By manually offloading a single performance-critical function\
    \ (LBM_performStreamCollideTRT, ~140 lines out of 1299) to AOT-compiled WebAssembly,\
    \ we reduced the slowdown from 219.6\xD7 to ~7\xD7 \u2014 a roughly 30\xD7 relative\
    \ improvement.\nAlthough the resulting performance remains well below native execution,\
    \ these results demonstrate that selective hot-path offloading can make heavily\
    \ nested TEE sandboxes practical for targeted compute-heavy workloads. We discuss\
    \ the performance, compatibility, and security trade-offs of this approach."
