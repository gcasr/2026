  session: 1
  title: Conventional Attacks on Scientific Applications
- abstract: "Blockchain technology enables decentralized, tamper-proof transaction\
    \ processing but faces challenges in terms of energy efficiency and throughput.\
    \ Bitcoin's Proof-of-Work (PoW) power consumption, coupled with its low 7 transactions\
    \ per second (TPS) yields an effective per-transaction cost of over $100, limiting\
    \ Bitcoin's adoption for many small everyday transactions. We present MEMO, a\
    \ PoSpace blockchain system in C that explores high-throughput block creation\
    \ through a multi-process architecture with dedicated components for transaction\
    \ pooling, proof-of-space consensus, block validation, and timing coordination.\
    \ Power efficiency is achieved through the Memoization of cryptographic proofs\
    \ that are stored and retrieved from persistent storage. MEMO introduces deadline-aware\
    \ batch processing, where validators verify EdDSA signatures in parallel using\
    \ OpenMP and construct blocks within strict time budgets. Validators send partially-filled\
    \ blocks when deadlines approach rather than missing them, ensuring consistent\
    \ block intervals across all configurations. The architecture separates concerns\
    \ across independent processes connected via ZeroMQ messaging and Google Protocol\
    \ Buffer serialization, a design that mirrors real-world blockchain deployments\
    \ where transaction submitters, memory pools, validators, and chain nodes operate\
    \ as distinct entities. This separation enables each component to be independently\
    \ optimized, tested, and eventually distributed across multiple machines without\
    \ altering the core consensus logic. We evaluate MEMO across 42 parameter configurations\
    \ spanning block intervals of 1\u201332 seconds, block sizes up to 64K transactions\
    \ per block, demonstrating over 8K/sec end-to-end confirmed throughput on a single\
    \ node. Future work targets distributed deployment across 10~1K nodes using gossip-based\
    \ propagation, persistent storage backends, and post-quantum signature support\
    \ through a pluggable cryptographic interface."
  authors: Venkata Harsha Pedada, Ioan Raicu
  board_number: N6
  institution: Illinois Institute of Technology
  number: 17
  room: Northwestern
  session: 1
  title: 'MEMO: High-Throughput Blockchain using Memoization'
- abstract: "Property-based testing (PBT), introduced by Haskell\u2019s QuickCheck,\
    \ is becoming more popular using tools like junit-quickcheck. Developers define\
    \ a property and a generator that produces well-formed, randomized inputs. The\
    \ property is repeatedly tested against fresh inputs to verify a property of the\
    \ system, such as a serialization round-trip. Failures often expose edge-case\
    \ bugs, while passing tests increase confidence of the system. However, traditional\
    \ test coverage tools perform poorly when evaluating PBT coverage.\nIn this poster,\
    \ we present PropCov, a tool for understanding coverage in PBT that also provides\
    \ suggestions for coverage improvement. PropCov employs a novel combination of\
    \ static analysis with PBT to approximate the maximum possible coverage, providing\
    \ an effective measure of the PBT coverage and making suggestions on paths to\
    \ improve existing tests. PropCov features an easily extensible architecture that\
    \ can support new languages, build systems, and PBT frameworks.\nWe evaluated\
    \ PropCov using 25 Java projects using junit-quickcheck or jqwik, totaling 293\
    \ properties, and found that existing tools report missed coverage that is impossible\
    \ to reach (86% of lines that JaCoCo reports as not covered), which leads developers\
    \ to consider hundreds of extra lines of code (2910). Unlike existing coverage\
    \ tools, PropCov results are accurate \u2014 only 7.5% of all properties contain\
    \ unfeasible code, and PropCov only misses 4% of reachable code. Using PropCov\u2019\
    s suggestions, we increased the coverage of 42 tests over 7 projects and found\
    \ 5 new bugs in 4 projects."
  authors: "Jesse Coultas;  Joseph Wiseman; Lu\xEDs Pina"
  board_number: N7
  institution: University of Illinois Chicago
  number: 18
  room: Northwestern
  session: 1
  title: 'PropCov: Effective Coverage Reporting for Property-Based Testing'
- abstract: 'The Rust programming language introduces many zero-cost abstractions
    aimed at improving memory safety and expressiveness. This work investigates whether
    these features lead to identifiable differences in IR compared to that generated
    from more minimal languages such as C, and considers their potential implications.


    We analyze two C benchmark suites alongside their Rust reimplementations. Our
    evaluation focuses on many metrics including opcode frequency, type usage, and
    def-use graphs. We find consistent and measurable differences in the generated
    LLVM-IR, with rustc generating IR with substantially more types and def-use graphs
    10x wider. These structural differences unlock potential for parameterized algorithms
    and suggest new opportunities for optimizations.'
  authors: Benjamin Ye
  board_number: N8
  institution: Northwestern University
  number: 19
  room: Northwestern
  session: 1
  title: Characterizing IR Generated by Rustc and Clang
- abstract: "CPython 3.13's experimental free-threaded mode removes the Global Interpreter\
    \ Lock (GIL) to enable multi-threaded parallelism. Its centerpiece is biased reference\
    \ counting, which splits each object's refcount into a thread-local field \u2014\
    \ updated without atomics by the owning thread \u2014 and a shared field requiring\
    \ atomics from other threads. The design bets that most objects are accessed primarily\
    \ by their creating thread. No systematic study has characterized when this bet\
    \ pays off. We present an empirical evaluation across the object-sharing spectrum\
    \ using three CPython builds from the same commit: a GIL baseline, a free-threaded\
    \ release build, and a free-threaded instrumented build that decomposes every\
    \ `Py_INCREF` and `Py_DECREF` into its local or shared component. We measure throughput,\
    \ per-object memory overhead, deallocation latency, and cache behavior across\
    \ six object types (dict, list, tuple, slots, int, str). Seven microbenchmarks\
    \ span the sharing spectrum \u2014 thread-local allocation, producer-consumer\
    \ handoff, shared-read, shared-write, mixed-locality, object transfer, thread\
    \ churn \u2014 complemented by five application workloads including a thread-pooled\
    \ web server, parallel parser, and multi-stage pipeline. Thread counts span 1\
    \ to 32, and we parameterize the local-to-shared ratio to find the crossover where\
    \ the bias's overhead exceeds its benefit. Using hardware counters (`perf stat`,\
    \ `perf c2c`), we characterize last-level cache misses and false sharing on refcount\
    \ fields, and measure stop-the-world pause durations and per-object merge costs\
    \ during thread termination \u2014 a previously unmeasured cost of the biased\
    \ scheme. We provide actionable guidance on which concurrency patterns preserve\
    \ biased refcounting's advantages and which inadvertently defeat them.\n\n"
  authors: Farhan Saif
  board_number: N9
  institution: University of Illinois At Chicago
  number: 21
  room: Northwestern
  session: 1
  title: When Does the Bias Pay Off? An Empirical Study of Reference Counting in Free-Threaded
    CPython
- abstract: "Modern AI coding agents are capable of software development tasks ranging\
    \ from large greenfield projects to low-level optimizations in production-quality\
    \ codebases. However, these agents are computationally expensive and require specialized\
    \ hardware that typically must be accessed from cloud providers, making token\
    \ efficiency important. A necessary step toward token efficiency is to offload\
    \ work to traditional language tooling\u2014such as compilers, linters, and static\
    \ analyzers\u2014yet this tooling was never designed with AI agents in mind.\n\
    There is currently no systematic method for identifying where existing tools fail\
    \ these agents and how they should be extended. In this work, we propose a workflow\
    \ that applies statistical analysis and LLM-as-a-judge to agent trajectories (the\
    \ reasoning and actions taken when solving a problem) to automatically identify\
    \ these gaps, reducing the need for labor-intensive manual analysis. Applying\
    \ this workflow to Python coding agents, we find that agents manually implement\
    \ common program analyses such as program slicing, and get stuck in loops when\
    \ resolving complex import errors. Both findings indicate absent or inadequate\
    \ tooling support, and our workflow prescribes targeted extensions to Python's\
    \ tooling ecosystem for agent workflows. With this methodology, programming language\
    \ implementers, toolchain designers, and agent framework developers can evaluate\
    \ and extend their tools to better support AI coding agents."
  authors: Tommy McMichen
  board_number: N10
  institution: Northwestern University
  number: 25
  room: Northwestern
  session: 1
  title: What Do AI Coding Agents Need? Mining Trajectories to Identify Gaps in Language
    Tooling
- abstract: 'Since the advent of ChatGPT in late 2022, LLMs have become ubiquitous
    in academic settings. Several recent papers have investigated the increase in
    LLM use in scientific papers since 2022, finding a broad and increasing presence
    of LLM-modified text in papers across disciplines. Previous research has attempted
    to measure LLM use in shorter texts: paper abstracts and conference peer reviews.
    In this project, we build on this work by developing a model to quantify the use
    of LLMs in the full text of scientific papers that have been posted on ArXiv,
    an open access archive for pre-print articles primarily in Physics, Mathematics,
    and Computer Science. Our method uses individual word frequencies in known human-written
    and AI-generated articles to train a model to provide a population-level estimate
    of the proportion of text produced by an LLM in a mixed set of human-written and
    AI-generated papers. We then use this model to estimate the percentage of text
    that has been substantially modified by LLMs in a corpus of papers posted on ArXiv
    between 2023 and 2024. This lets us track and quantify the rise of LLM use in
    full text of papers across several disciplines spanning different research areas.'
  authors: Meredith Sauer, Satyaki Sikdar
  board_number: N13
  institution: Loyola University Chicago
  number: 34
  room: Northwestern
  session: 1
  title: An Investigation of LLM Use in Scientific Papers
- abstract: "Modern LLMs built on the transformer architecture rely on self-attention.\
    \ To avoid recomputing past representations at each decoding step, inference engines\
    \ maintain a key\u2013value (KV) cache that stores the projected keys and values\
    \ of previously seen tokens. Since self-attention is position-agnostic, models\
    \ inject positional information through Rotary Position Embedding (RoPE), which\
    \ rotates query and key vectors by an angle tied to each token's position, so\
    \ that attention scores depend on the relative distance between tokens. A new\
    \ trend has emerged exploring the usage of Pre-RoPE KV-cache, which defers this\
    \ rotation until attention time, leaving cached keys position-free.\n\nPost-RoPE\
    \ storage remains the universal default across production inference engines today.\
    \ Because every cached key has its position baked in, subsequent attention steps\
    \ read them as-is, yielding efficient decoding. Identical content at different\
    \ positions therefore produces distinct keys and cannot share a cache entry. For\
    \ example, when an agent reads the same file twice, the cache may store two separate\
    \ copies, inflating the memory footprint. The pre-RoPE alternative stores unrotated\
    \ keys and applies RoPE at attention time, adding a per-step rotation overhead\
    \ over every cached key.\n\nWe provide the modeling and analysis of pre-RoPE versus\
    \ post-RoPE storage in vLLM. Our results on Llama-3.2-1B-Instruct show that pre-RoPE\
    \ incurs roughly 33% higher TTFT and 30% lower decode throughput while preserving\
    \ output correctness, quantifying the per-step compute price that position-independent\
    \ caching trades for the possibility of a reduced KV-cache memory footprint."
  authors: Jaime Cernuda, Zia Uddin Chowdhury, Jie Ye, Anthony Kougkas, Xian-He Sun
  board_number: N14
  institution: Illinois Institute of Technology
  number: 36
  room: Northwestern
  session: 1
  title: 'Pre-RoPE versus Post-RoPE: Per-Step Compute for a Reduced KV-Cache Memory
    Footprint'
- abstract: "Storage-disaggregated databases decouple compute from storage, improving\
    \ elasticity but suffering from network bottlenecks. Most cloud databases primarily\
    \ use page-based B+trees and buffer pools. Under disaggregation, each index traversal\
    \ incurs serial network round-trips. Page-granularity transfers and caching also\
    \ amplify network traffic and lower cache efficiency. Pushing down the full index\
    \ to storage and caching only hot records at compute is appealing as a solution,\
    \ but an efficient design must (1) provide a holistic record cache that accelerates\
    \ both point and range queries, (2) mitigate the negative search penalty of confirming\
    \ non-existence via remote probes, and (3) enforce storage-agnostic phantom protection\
    \ despite the index being encapsulated by the storage service.\n\nWe introduce\
    \ Nemo, a holistic index-and-buffer design optimized for storage-disaggregated\
    \ OLTP with index pushdown. Nemo employs a tree-structured record buffer that\
    \ unifies caching and buffering and accelerates both point and range queries.\
    \ It further reduces negative search penalty by caching negative search results.\
    \ Nemo provides storage-agnostic phantom protection that is robust against large\
    \ key domains, varying data skew, and partition schemes. Experiments show that\
    \ Nemo outperforms page-based B+Tree and the state-of-the-art 2-Tree by up to\
    \ 11.42\xD7 and 2.97\xD7 on positive point queries, and achieves up to 4.76\xD7\
    \ speedup on negative searches over a hash-indexed record cache. For phantom protection,\
    \ Nemo outperforms PCL by up to 1.55\xD7 even under a dense key domain. Moreover,\
    \ Nemo maintains stable performance while PCL degrades sharply as the key domain\
    \ grows large and sparse."
  authors: Wenjie Hu
  board_number: N15
  institution: University of Wisconsin Madison
  number: 40
  room: Northwestern
  session: 1
  title: 'Nemo: Efficient Caching with Index Pushdown for Disaggregated OLTP Databases'
- abstract: High-Energy Physics (HEP) applications, like many other scientific applications,
    are growing in scale, requiring more energy, memory, and time out of HPC systems.
    As a result, optimizing resource usage has become a requirement in order to maintain
    sustainable high-throughput computing environments. This necessitates better methods
    to understand and apply resource usage data in our everyday computing. This work
    analyzes the power and memory usage data of a single HEP application in order
    to explore how this data can be used to inform how we manage HEP scientific applications.
    This work also explores methods to profile and fingerprint this data to assist
    in this goal.
  authors: Akshar Patel, Zhiling Lan
  board_number: N16
  institution: University of Illinois Chicago
  number: 41
  room: Northwestern
  session: 1
  title: Understanding the Resource Usage of High-Energy Physics Applications in HPC
    Systems
- abstract: "Maximizing performance on available GPU hardware is an ongoing challenge\
    \ for modern AI inference systems. Traditional approaches include writing custom\
    \ GPU kernels and using specialized model compilers to tune high-level code for\
    \ specific GPU targets. Recent work shows that LLM-based multi-agent systems can\
    \ effectively perform such tuning, often outperforming existing compilers and\
    \ eliminating the need for manual kernel development. However, the dynamics of\
    \ multi-agent systems for this task remain unexplored. In this work, we present\
    \ a logical framework for comparing multi-agent PyTorch optimization systems.\
    \ Our evaluation shows that exploit-heavy strategies perform best when paired\
    \ with error-fixing agents, and that performance correlates with the granularity\
    \ of optimization steps. The best implementation achieves an average 2.88\xD7\
    \ speedup over PyTorch Eager (1.85\xD7 over torch.compile) on an H100 GPU across\
    \ diverse tasks in KernelBench, a benchmark suite covering a range of machine\
    \ learning architectures in PyTorch. Code is publicly available at: https://github.com/pike-project/pike"
  authors: Kirill Nagaitsev, Luka Grbcic, Samuel Williams, Costin Iancu
  board_number: N17
  institution: Northwestern University, Lawrence Berkeley National Laboratory
  number: 46
  room: Northwestern
  session: 1
  title: Optimizing PyTorch Inference with LLM-Based Multi-Agent Systems
- abstract: 'Modern HPC file systems can contain billions of files and hundreds of
    petabytes of data, making even simple questions increasingly intractable to answer.
    Traditional file system utilities such as find and du fail to scale to these sizes.
    While external indexing tools like GUFI and Brindexer improve query performance,
    they remain batch-oriented and unsuitable for heterogeneous, rapidly evolving
    environments.


    We present Icicle, a scalable framework for continuous file system metadata indexing
    and monitoring. Icicle maintains a unified, up-to-date, and queryable view of
    file system state while supporting both periodic snapshot-based ingestion for
    bulk metadata updates and event-based ingestion for real-time synchronization
    from production systems such as Lustre and IBM Storage Scale. Built on Apache
    Kafka and Apache Flink, Icicle provides high-throughput, fault-tolerant, and horizontally
    scalable ingestion of metadata events into two complementary search indexes, enabling
    both individual file discovery and aggregate summary statistics by user, group,
    and directory.


    This architecture enables efficient support for both coarse-grained administrative
    queries and interactive analytics over billions of objects. Our experimental evaluation
    on production-scale HPC datasets demonstrates order-of-magnitude throughput improvements
    over existing monitoring and indexing approaches, with tunable options for balancing
    consistency, latency, and metadata freshness.'
  authors: "Haochen Pan; Ryan Chard; Song Young Oh; Maxime Gonthier; Val\xE9rie Hayot-Sasson;\
    \ Geoffrey Lentner; Joe Bottigliero; Rachana Ananthakrishnan; Kyle Chard; Ian\
    \ Foster"
  board_number: N18
  institution: "University of Chicago; Argonne National Laboratory; \xC9cole de technologie\
    \ sup\xE9rieure; Purdue University"
  number: 47
  room: Northwestern
  session: 1
  title: 'Icicle: Scalable Metadata Indexing and Real-Time Monitoring for HPC File
    Systems'
- abstract: "Modern High-Performance Computing (HPC) sys-\ntems are increasingly bottlenecked\
    \ by static, heuristic-based\nschedulers that cannot adapt to heterogeneous and\
    \ dynamic\nworkloads. While Deep Reinforcement Learning (DRL) offers\nadaptability\
    \ in principle, its high training cost and retraining\noverhead limit practical\
    \ deployment. We present SchedTwin, a\nframework that formulates adaptive scheduling\
    \ as a contextual\nmulti-armed bandit (CMAB) problem, enabling continuous on-\n\
    line learning of policy selection strategies without retraining.\nSchedTwin\u2019\
    s key innovation is a dual-context representation of\nreal-time system state and\
    \ simulator-projected policy outcomes,\novercoming the delayed feedback inherent\
    \ to job scheduling\nand enabling the CMAB agent to select policies based on both\n\
    current conditions and anticipated future impact. Evaluation on\nproduction traces\
    \ from ALCF systems ranging from 560 to 10,624\nnodes shows that SchedTwin consistently\
    \ outperforms traditional\nheuristics and DRL-based baselines, reducing job wait\
    \ time by\nup to 86.6% and job slowdown by up to 92.6%. Live deployment\non a\
    \ PBS-managed cluster confirms that SchedTwin incurs only\nseconds of overhead\
    \ per scheduling decision, demonstrating its\npracticality for production HPC\
    \ environments."
  authors: Jordan Zhang; Kanglin Xu; Yash Kurkure; Michael Papka; Zhiling Lan
  board_number: N19
  institution: University of Illinois Chicago; Argonne National Laboratory
  number: 53
  room: Northwestern
  session: 1
  title: 'SchedTwin: Simulation-Assisted Online Learning for Adaptive HPC Scheduling'
- abstract: "We present the data ingestion and processing architecture of the OpenCosmo\
    \ Visualization Application (OVA), a browser-based system for interactive exploration\
    \ of large-scale cosmological particle data designed for direct integration within\
    \ the OpenCosmo portal. In this workflow, users query subsets of simulation outputs\
    \ containing millions of particles, requiring efficient, low-latency transformation\
    \ from columnar data into interactive visual form.\nOVA executes this pipeline\
    \ entirely on the client. It ingests Apache Parquet datasets directly in the browser\
    \ using WebAssembly, leveraging Parquet\u2019s columnar layout and high compression\
    \ efficiency to reduce data transfer costs while enabling selective decoding of\
    \ relevant fields. Data is processed in parallel via Web Workers and prepared\
    \ as GPU-ready buffers for rendering, enabling end-to-end exploration without\
    \ preprocessing or server-side visualization infrastructure.\nProfiling a baseline\
    \ pipeline processing 3.3M\u201352.9M particles reveals that WebAssembly decoding\
    \ dominates per-file ingestion cost (up to 84%), while structured-clone serialization\
    \ across the Worker\u2013main thread boundary dominates end-to-end latency, averaging\
    \ 14.5 seconds at 3.3M particles and failing at 16.5M due to memory exhaustion.\
    \ We address this bottleneck through a columnar Transferable buffer architecture\
    \ that transfers typed array ownership without copying, reducing transfer time\
    \ by 13\xD7 and memory usage by 4.3\xD7.\nEvaluation demonstrates linear ingestion\
    \ scaling, near-constant transfer overhead, and sustained interactive performance\
    \ on commodity hardware, extending feasible dataset sizes to 52.9M particles.\
    \ This work shows that careful systems design enables scalable, client-side analysis\
    \ of HPC-generated cosmological data without reliance on external visualization\
    \ pipelines."
  authors: Idunnuoluwa A. Adeniji, Joseph Insley, Michael E. Papka
  board_number: N20
  institution: University of Illinois Chicago, Argonne National Laboratory
  number: 55
  room: Northwestern
  session: 1
  title: A Client-Side Architecture for Scalable Ingestion and Interactive Visualization
    of Cosmological Particle Data
- abstract: The Dragonfly network, with its high-radix and low-diameter structure,
    is a leading interconnect in high-performance computing. A major challenge is
    workload interference on shared network links. Parallel discrete event simulation
    (PDES) is commonly used to analyze  workload interference. However, high-fidelity
    PDES is computationally expensive, making it impractical for large-scale or real-time
    scenarios. Hybrid simulation that incorporates data-driven surrogate models offers
    a promising alternative, especially for forecasting application runtime, a task
    complicated by the dynamic behavior of network traffic. We present SMART, a surrogate
    model that combines graph neural networks (GNNs) and large language models (LLMs)
    to capture both spatial and temporal patterns from port level router data. SMART
    outperforms existing statistical and machine learning baselines, enabling accurate
    runtime prediction and supporting efficient hybrid simulation of Dragonfly networks.
  authors: Xin Wang, Pietro Lodi Rizzini, Sourav Medya, Zhiling Lan
  board_number: N21
  institution: University of Illinois Chicago
  number: 57
  room: Northwestern
  session: 1
  title: 'SMART: A Surrogate Model for Predicting Application Runtime in Dragonfly
    Systems'
- abstract: Deploying foundation models on edge hardware requires balancing inference
    capability with strict thermal and energy limits. This work presents a thermal
    characterization of an edge-computing hardware design under sustained AI inference,
    with emphasis on the effect of different power modes and cooling configurations.
    We evaluate workloads that vary by inference frequency, model size, and quantization
    level, and measure the resulting energy consumption and thermal behavior during
    continuous AI operation. Our analysis compares transient and steady-state thermal
    responses across workload and cooling conditions, revealing how workload intensity
    and model configuration interact with hardware cooling capacity. The results highlight
    operating regions where the platform sustains stable inference and regions where
    thermal stress becomes a limiting factor. This study provides insight into the
    thermal robustness of edge hardware for foundation AI model deployment and motivates
    future work on thermal-aware workload scheduling and co-design software through
    hardware.
  authors: Yongho Kim, Peter Lebiedzinski, Rajesh Sankaran, Sean Shahkarami, Neal
    Conrad, Francisco Lozano, Nicola Ferrier, and Pete Beckman
  board_number: N22
  institution: Argonne National Laboratory
  number: 60
  room: Northwestern
  session: 1
  title: Energy and Thermal Evaluation of Sage Thor-Blade Edge Computing Platform
    for Continuous Foundation Model Inference
- abstract: 'Understanding how spectrum is used in real-world environments is central
    to dynamic spectrum access and spectrum policy. Most existing approaches rely
    on threshold-based occupancy, which indicates activity but does not distinguish
    different usage patterns.


    We present a proof-of-concept pipeline for characterizing spectrum use from long-term
    passive measurements. Using year-long data collected at a fixed monitoring site
    in Chicago, we extract interpretable features from sliding windows of channel-level
    power and apply density-based clustering to identify recurring operational regimes.


    These regimes capture distinct patterns such as persistent transmission, burst-dominated
    activity, and extended silence. Representing each day as a mixture of regimes
    provides a compact summary of channel behavior and enables tracking of long-term
    stability and structural change.


    The resulting representation can support labeling of large-scale measurement data
    and can be combined with contextual information for improved interpretation. The
    approach is measurement-driven and designed to generalize across bands and deployments.'
  authors: Naicheng Wei, Cynthia Hood
  board_number: N23
  institution: Illinois Institute of Technology
  number: 61
  room: Northwestern
  session: 1
  title: Characterizing Spectrum Usage from Long-Term Passive Measurements
- abstract: "This study analyzes bibliometric data to map the research footprint of\
    \ Loyola University Chicago. We started with a dataset provided by SciSciNet and\
    \ OpenAlex that documents the collaboration networks, topics, funding, and more\
    \ that goes into a successful research paper: 250 million papers by 100 million\
    \ authors representing over 100 thousand institutions across the world; 30+ tables,\
    \ hundreds of fields, and over 100GB. \nTo navigate this complex schema, we utilized\
    \ parquet push-down predicates to mine the data, target Loyola's ID, and filter\
    \ through nearly 1 billion paper-author affiliations to create a focused subset:\
    \ 42,015 papers with at least one author from Loyola University. We then mapped\
    \ Loyola's research network throughout US institutions and the world, analyzing\
    \ trends in impact and collaboration shifts.\nThese metrics tell the story of\
    \ a school with global reach, broad interests, and recognized expertise. Looking\
    \ ahead, we can expand this analysis beyond Loyola's historical output. Our robust\
    \ dataset provides the opportunity to build a complete picture of the scientific\
    \ ecosystem \u2014 the untapped collaboration networks, the way topic switches\
    \ are encouraged by historical events like COVID, and the downstream effects of\
    \ funding. Understanding this data is the gateway to future models that promote\
    \ smarter, more efficient academic growth and scientific development. "
  authors: Dawson Gallay, Satyaki Sikdar
  board_number: N24
  institution: Loyola University Chicago
  number: 62
  room: Northwestern
  session: 1
  title: 'The Science of Science: Loyola University''s Research Network'
- abstract: 'Modern data-driven systems operate in dynamic environments where distributional
    drift can silently degrade performance, reliability, and interpretability. This
    work presents a modular supervision architecture for real-time drift detection
    across heterogeneous research systems. The framework combines embedding-based
    similarity, lightweight statistical signals, and k-nearest neighbor classification
    to identify deviations from expected behavior in a transparent and domain-agnostic
    manner.


    To support non-stationary data, the system incorporates both fixed and adaptive
    reference baselines, enabling it to distinguish meaningful divergence from routine
    variation. The architecture is designed for extensibility and low overhead, making
    it suitable for integration into machine learning pipelines, experimental instrumentation,
    and broader scientific workflows.


    By prioritizing interpretability, configurability, and generality, this work offers
    a practical foundation for monitoring and maintaining reliability in modern research
    infrastructure.'
  authors: Kenny Lyons
  board_number: N25
  institution: Loyola University Chicago
  number: 64
  room: Northwestern
  session: 1
  title: A Modular Architecture for Detecting Data Drift in Research Systems
- abstract: 'Scientific simulations on leadership-class HPC systems routinely waste
    millions of core-hours producing invalid results, yet no tool monitors whether
    a running simulation computes valid science. We call this blind spot "dark waste":
    simulations that run to completion while computing the wrong answer. Large language
    models are increasingly used to automate scientific visualization, yet they cannot
    directly process the volumetric, multi-resolution data produced by scientific
    simulations. Current approaches either control visualization tools without accessing
    data content, or reduce simulation outputs to statistical summaries that discard
    spatial structure. We introduce a multi-resolution translation layer that converts
    raw simulation data in standard formats into LLM-native representations, combining
    hierarchical metadata extraction, derived quantities to encode spatial, temporal,
    and topological relationships in a form LLMs can reason about: not merely view
    as rendered images. Building on this capability, we present Vigil, which couples
    deterministic science-aware triggers with multimodal LLM confirmation through
    a trigger-render-reason pipeline. Vigil instruments simulations with lightweight
    checks on derived-quantity operators and regions of interest; when a check detects
    a potential anomaly, the flagged data is translated and analyzed by a multimodal
    model to assess scientific validity. Upon confirming invalid behavior, Vigil can
    terminate or restart the simulation from a checkpoint, preventing further expenditure
    on "dark waste". Together, the translation layer and trigger-render-reason pipeline
    enable a new class of data-aware visualization agents capable of anomaly localization
    and physics-informed visualization design, which neither tool-mediation nor metadata-only
    approaches can support. We evaluate Vigil across four codes spanning numerical
    instability, pattern dynamics, turbulence dissipation, and molecular-dynamics
    failures. Vigil detects every deliberately configured failure with zero false
    positives and supplies an actionable semantic verdict for each alert.'
  authors: Hua Xu
