  title: Evaluating the Robustness of Jailbreak Defenses to Speech-Input Large Language
    Models
- abstract: "Alert correlation is a critical process that transforms isolated detections\
    \ into coherent attack narratives, enabling analysts to capture multi-stage intrusions\
    \ that would otherwise surface as hundreds of unrelated, low-severity events.\
    \ Microsoft\u2019s Managed Extended Detection and Response (MXDR) facilitates\
    \ this by automating alert grouping. However, it often exhibits systematic blind\
    \ spots in complex scenarios. For instance, MXDR frequently fragments alerts into\
    \ disconnected incidents when an attacker targets multiple users from a single\
    \ IP or when identical malware re-executes on the same account. To bridge these\
    \ gaps, we propose a daily AI agent pipeline that operates alongside MXDR. A correlation\
    \ subagent first scans ingested alerts for shared entities \u2014 IPs, file hashes,\
    \ and user accounts \u2014 across time windows, producing a structured analysis\
    \ packet. An analysis subagent then interprets these packets, produces prioritized\
    \ SOC reports, and feeds confirmed misses back into a rule refinement subagent\u2014\
    incrementally expanding correlation coverage with each iteration. Evaluated on\
    \ real enterprise alerts, the system surfaced multi-day attack campaigns and recurring\
    \ correlation patterns that MXDR consistently missed."
