- abstract: The Dragonfly network, with its high-radix and low-diameter structure,
    is a leading interconnect in high-performance computing. A major challenge is
    workload interference on shared network links. Parallel discrete event simulation
    (PDES) is commonly used to analyze  workload interference. However, high-fidelity
    PDES is computationally expensive, making it impractical for large-scale or real-time
    scenarios. Hybrid simulation that incorporates data-driven surrogate models offers
    a promising alternative, especially for forecasting application runtime, a task
    complicated by the dynamic behavior of network traffic. We present SMART, a surrogate
    model that combines graph neural networks (GNNs) and large language models (LLMs)
    to capture both spatial and temporal patterns from port level router data. SMART
    outperforms existing statistical and machine learning baselines, enabling accurate
    runtime prediction and supporting efficient hybrid simulation of Dragonfly networks.
