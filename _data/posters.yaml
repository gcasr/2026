  title: Status-Coherent Clique Mining in Signed Networks
- abstract: "AI agents are becoming the primary interface to scientific data, yet\
    \ discovering datasets on HPC filesystems remains a guess-and-check process. Agents\
    \ repeatedly invoke find and ls with regex patterns, wasting compute, time, and\
    \ LLM credits on failed searches. Filesystem metadata \u2014 rich type information,\
    \ dimensional annotations, and simulation parameters embedded in formats like\
    \ HDF5 \u2014 is invisible to these tools. Ideally, storage systems would support\
    \ semantic search natively, but scientific metadata is highly distributed across\
    \ cluster nodes, and no benchmark exists to evaluate which search technique best\
    \ serves agent-driven discovery in this setting.\n\nIn this project, we benchmark\
    \ four search backends \u2014 BM25 keyword matching, Elasticsearch (external BM25\
    \ over REST), Neo4j knowledge graph traversal, and Qdrant vector cosine similarity\
    \ \u2014 integrated into CLIO, an optimized multi-tiered context storage system\
    \ with support for filesystem semantics. Each backend is plugged into CLIO's Context\
    \ Transfer Engine through a factory pattern, receiving identical LLM-generated\
    \ summaries (Qwen 2.5 3B) extracted from HDF5 simulation metadata. This enables\
    \ controlled comparison across keyword, graph, and semantic approaches. We evaluate\
    \ on 273 GADGET-2 N-body astrophysics snapshots spanning 16 simulation configurations\
    \ with 20 natural-language queries.\n\nEmbedding BM25 directly in CLIO's I/O layer\
    \ achieves 70% Top-1 accuracy at 0.047 ms per query \u2014 350\xD7 faster than\
    \ Elasticsearch running the same algorithm over REST (16.4 ms), isolating the\
    \ speedup to transport elimination. Qdrant cosine similarity reaches 95% Top-1\
    \ by bridging synonym gaps that keyword methods miss. Neo4j graph traversal enables\
    \ structured entity-relationship queries at 62% accuracy. On a 4-node distributed\
    \ deployment, accuracy remains invariant while query latency stays below 2 ms.\
    \ These results establish performance tradeoffs between keyword, semantic, and\
    \ graph-based search for agent-driven scientific data discovery."
