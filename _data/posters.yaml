  title: Improving Edge AI Efficiency With High-Accuracy In-Memory Computing
- abstract: Edge computing has emerged as a transformative paradigm for processing
    data at its source the Electronic Visualization Laboratory at the University of
    Illinois Chicago has been exploring edge computing applications through the SAGE
    ecosystem, with particular focus on AI-driven spatial analytics. Traditional pedestrian
    tracking systems typically stream video to centralized servers for processing,
    raising privacy concerns and requiring substantial network bandwidth. We introduce
    Edge Computing in a system that tracks walking directions in real time using NVIDIA
    Jetson Developer Kits. By processing AI locally instead of in the cloud, the system
    then identifies movement but deletes all video to keep data private.
