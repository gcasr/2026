  title: 'HyPIM: Accelerating Hyperbolic Machine Learning via Processing-In-Memory'
- abstract: Modern HPC systems increasingly rely on heterogeneous GPU platforms from
    NVIDIA, Intel, and AMD, yet most resilience studies remain confined to a single
    vendor stack. It therefore remains unclear how the same logical fault is handled
    by different GPU backends. We perform a cross-architecture fault injection study
    that applies semantically aligned single-bit faults at the LLVM IR level before
    backend-specific lowering, enabling direct comparison across CUDA, SYCL, and HIP
    compilation flows. We evaluate representative heterogeneous benchmarks on three
    production supercomputers, Polaris, Aurora, and Frontier. Our analysis extracts
    several key insights into GPU resilience and suggests practical guidelines for
    applying fault mitigation strategies more effectively on heterogeneous GPU platforms.
