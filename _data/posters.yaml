  title: Deferred Execution for High-Performance Code Generation on Processing-in-Memory
    Systems
- abstract: How vulnerable are scientific applications to conventional attacks mounted
    through their inputs? Prior work largely leaves this question unanswered. We begin
    to answer through a challenging adaptation of security-focused fuzzing and bug
    triage to identify and characterize vulnerabilities in a set of scientific codebases.
    Our process discovers almost 1000 unique crash clusters (distinct bugs), across
    Enzo, GROMACS, Laghos, and LAMMPS (about 3 million lines of code). Per target,
    an average of 7.3% of crash clusters represent easily exploitable vulnerabilities
    according to heuristic security analysis. Additionally, 25% of all clusters (52%
    for GROMACS) are exploitable heap memory safety issues. Our overall analysis points
    to over 110 distinct vulnerabilities that may permit arbitrary code execution.
    Manual inspection confirms the existence of exploitable bugs. Our results suggest
    untrusted data could have catastrophic effects on artifact integrity, creating
    a real risk for institutions and society as computational scientific results drive
    increasingly consequential decisions.
