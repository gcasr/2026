  long_bio: "Thuan T. Cao long bio:<br/>Thuan Cao is a Master\u2019s student and Graduate\
    \ Assistant in the PROVE Lab at DePaul University. His research focuses on bridging\
    \ formal verification and reinforcement learning by developing tools to translate\
    \ KeYmaera X safety models into Gymnasium environments. With a professional background\
