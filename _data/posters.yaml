- abstract: Gem5 is an excellent source to simulate cycle-accurate machines and full-system
    payloads however currently it is lacking the capabilities for modern hardware
    virtualization on x86 machines.  This bars researchers from cycle-accurate simulations
    for hypervisor and other virtualization research.  Intel's Virtual Machine Extension
    (VMX) allows x86 machines to handle virtualization through an architecture governed
    by two separate modes of operation, VMX root and VMX non-root.  My work aims to
    extend gem5 with VMX support for x86 full-system simulation.  The implementation
    targets the core structures and behaviors required to model virtualization.  By
    enabling virtualization, gem5 opens up to research on hypervisors and virtualization
    overhead.
