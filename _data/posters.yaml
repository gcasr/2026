    His work has appeared in venues including Physical Review A, npj Quantum Information,
    and IEEE Transactions on Quantum Engineering. He is also a Research Scholar at
    Quantum Quadrivium Technologies LLP.<br/><br/><br/>Zain Hamid Saleem is a theoretical
    physicist working in the area of quantum information and computation at the Argonne
    National Laboratory. His PhD was on Black Hole physics at the University of Pennsylvania
    after which he did a postdoctoral fellowship in applied mathematics at the same
    university. Prior to joining Argonne National Laboratory as a Postdoctoral Appointee
    from 2019-2021, Zain Saleem worked at Morgan Stanley as a Quantitative associate
    for three years.<br/><br/><br/>Nikos Hardavellas is a professor of Computer Science
    and Computer Engineering at Northwestern University, where he directs the Parallel
    Architecture Group at Northwestern (PARAG@N, https://paragon.cs.northwestern.edu/).
    His research focuses on computer architecture, specifically at the intersection
    of computer architecture with the computer systems stack (programming languages,
    compilers, operating systems), memory systems, nanophotonics, energy-efficient
    computing and quantum computing systems. Nikos serves on the Executive Committee
    of the Northwestern Institute for Quantum Information Research and Engineering
    (INQUIRE), was named a Future CRA Leader by the Computing Research Association
    in the inaugural cohort (2024), received an NSF CAREER award (2015), and was a
    keynote speaker at IEEE ISPDC (2010). At Northwestern University, he received
    the June and Donald Brewer Chair (2009), a Faculty Service award (2022), was included
    in the Associated Student Government Faculty Honor Roll (2022), and became a Fellow
    of the Searle Center for Teaching Excellence in 2012. Nikos received best paper
