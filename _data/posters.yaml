- abstract: "Retrieval-Augmented Generation (RAG) over federated knowledge sources\
    \ introduces a key tradeoff: querying more vector databases improves recall but\
    \ increases communication and latency cost, while querying fewer risks missing\
    \ the evidence needed to answer a question. Prior work has largely framed this\
    \ as a routing problem: deciding which (and how many) sources to contact. We revisit\
    \ this question and ask where the real cost\u2013performance tradeoff arises in\
    \ federated RAG systems. Through controlled experiments on QA benchmarks, we find\
    \ that different routing strategies often make similar routing and retrieval decisions\
    \ and the minor variations between them have limited impact on downstream LLM\
    \ answer quality. Further, we find that while retrieval performance across different\
    \ RAG methods is relatively consistent, the cost of each method is much more variable.\
    \ In particular, we find that ML-based routing methods incur a substantially higher\
    \ computational overhead compared to non-ML-based routers but routing quality\
    \ does not significantly differ across these settings. In light of this finding,\
    \ we pose the question: how should federated RAG systems efficiently construct\
    \ information-dense contexts that maximize utility for generation? We introduce\
    \ a proxy metric for information density which we use to characterize the efficiency\
    \ of different routing methods. We use this metric to do pareto-optimal analysis\
    \ to choose routing strategies that effectively balance the routing cost vs. downstream\
    \ LLM performance tradeoff. Preliminary results suggests routers which can quickly\
    \ retrieve a higher number of \"reasonable\" documents have greater potential\
    \ to impact downstream model performance compared to more expensive routing methods\
    \ which may return a smaller subset of highly curated documents under the same\
    \ compute budget."
  authors: Song Young Oh, Arham Khan, Mansi Sakarvadia, Haochen Pan, Ian Foster, Kyle
    Chard
  board_number: N27
