- abstract: 'The Rust programming language introduces many zero-cost abstractions
    aimed at improving memory safety and expressiveness. This work investigates whether
    these features lead to identifiable differences in IR compared to that generated
    from more minimal languages such as C, and considers their potential implications.


    We analyze two C benchmark suites alongside their Rust reimplementations. Our
    evaluation focuses on many metrics including opcode frequency, type usage, and
    def-use graphs. We find consistent and measurable differences in the generated
    LLVM-IR, with rustc generating IR with substantially more types and def-use graphs
    10x wider. These structural differences unlock potential for parameterized algorithms
    and suggest new opportunities for optimizations.'
