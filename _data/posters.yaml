  title: 'UpDown: A Supercomputer Co-designed for Scalable Graph Processing'
- abstract: 'Reproducing distributed scientific workflows in HPC environments requires
    capturing the complete execution state of both the workflow coordinator and all
    compute nodes. While application virtualization techniques can audit a single
    process and produce a self-contained replayable container, applying this to distributed
    workflows introduces three unsolved problems. (1) auditing each worker independently
    produces heavily overlapping file sets, making naive aggregation impractical at
    scale due to redundant data transfer. (2)  each worker produces its own isolated
    provenance log, leaving cross-node data dependencies ( files produced by one worker
    and consumed by another)  unrecorded, with process identities that are only locally
    meaningful. (3) replaying the workflow on a new cluster requires efficiently distributing
    the captured environment without shipping files that were not true dependencies
    (read before write).

    This paper proposes a system that addresses all three problems. To capture worker
    environments efficiently, each worker sends its provenance log to the head node,
    which uses it to identify files already present using content hash and requests
    only the missing delta container reducing transfer proportionally to environment
    overlap across workers. To unify provenance, we merge per-worker logs into a single
    coherent record by mapping intermediate files to a canonical identity via content
    hashing and namespacing process identifiers to eliminate conflicts across nodes.
    For replay, we construct a minimal hermetic container containing only the files
    accessed at audit time, which is efficiently distributed to compute nodes on the
    target cluster. Together, these contributions enable faithful, auditable reproduction
    of distributed workflows without access to the original execution environment.'
