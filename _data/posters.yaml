  title: Towards Noise-Aware Quantum Compilation for Hamiltonian Simulation
- abstract: 'Real-time scientific workflows operate on continuous data streams and
    must produce timely, high-quality results despite executing on complex, failure-prone
    infrastructure. Hardware faults, network disruptions, and performance anomalies
    caused by resource contention or system heterogeneity can severely degrade performance
    and violate real-time constraints. We focus on strengthening the resilience of
    the producer-consumer streaming pattern, a fundamental building block of scientific
    streaming workflows. We present two complementary techniques: (i) a dynamic, asynchronous,
    non-blocking checkpointing mechanism that preserves progress without interrupting
    computation, and (ii) a progress-aware load redistribution strategy that detects
    slow workers and proactively rebalances tasks. Together, these mechanisms maintain
    forward progress and balanced execution even in highly error-prone environments.
    Experimental results show that our approach reduces the impact of failures and
    performance anomalies by up to 6x, while introducing less than 1% overhead in
    failure-free execution.'
  authors: Hai Duc Nguyen, Bogdan Nicolae, Tekin Bicer, Amal Gueroudji, Matthieu Dorier,
    Kyle Chard, and Ian Foster
  board_number: R4
  institution: Argonne National Laboratory and University of Chicago
  number: 37
  room: Rock
  session: 1
  title: 'StreamGuard: Low-Overhead Resilience for Real-time HPC Data Streams'
- abstract: "Modern computing systems generate data at unprecedented rates exceeding\
    \ TB/s. This growth is driven by the proliferation of sensors, scientific instruments,\
    \ Internet-of-Things devices, and human activities such as web, mobile, and edge\
    \ computing. Beyond conventional data storage, an increasingly prevalent requirement\
    \ is the capture of activity data, also known as log data, which records events\
    \ as they occur rather than static state. A wide range of domains, including scientific\
    \ applications, depend on high-performance logging methods that existing solutions\
    \ cannot deliver at scale.\n \nChronoLog is a scalable distributed log store designed\
    \ to handle the growing volume of activity data, tailored for applications ranging\
    \ from edge computing to High Performance Computing (HPC) systems. ChronoLog provides\
    \ several capabilities that distinguish it from existing data streaming platforms:\
    \ it guarantees log ordering across distributed nodes using physical time, thereby\
    \ avoiding expensive synchronization operations; employs multiple storage tiers\
    \ to scale log capacity; supports efficient concurrent access to data; and enables\
    \ range queries for partial log processing.\n \nThis poster presents the ChronoLog\
    \ architecture and its principal components\u2014ChronoVisor, ChronoKeeper, ChronoGrapher,\
    \ and ChronoPlayer\u2014together with two representative use cases. The first\
    \ demonstrates live HPC telemetry monitoring, in which system statistics such\
    \ as CPU, memory, and network utilization are logged into ChronoLog and visualized\
    \ through a Grafana plugin developed as a custom data source. The second presents\
    \ the ChronoLog Model Context Protocol (MCP) server, which provides episodic memory\
    \ for Claude Code-based agentic workflows by recording agent behaviors and retrieving\
    \ them via ChronoLog's time-based ordering guarantees."
  authors: Eneko Gonzalez, Kun Feng, Inna Brodkin, Kyle Chard, Anthony Kougkas, Xian-He
    Sun
  board_number: R5
  institution: Illinois Institute of Technology, University of Chicago
  number: 42
  room: Rock
  session: 1
  title: 'ChronoLog: Distributed Shared Tiered Log Store'
- abstract: "Speech Large Language Models (SpeechLLMs) unify speech perception and\
    \ language reasoning in a single framework and are rapidly being deployed in assistants,\
    \ accessibility tools, and multimodal agents. While safety of text\u2011only LLMs\
    \ has been extensively studied, the safety of SpeechLLMs is less understood, especially\
    \ under audio\u2011conditioned jailbreak and adversarial attacks. This work investigates\
    \ whether current SpeechLLM safety is sufficient under a suite of strong attacks\
    \ and defenses.\n\nBuilding on recent safety benchmarks for audio\u2011language\
    \ models, we use the AABench dataset of red\u2011team and harmful prompts as audio\
    \ queries and quantify robustness with Attack Success Rate (ASR) and StrongReject\u2011\
    based refusal metrics. We consider several prompt\u2011level and audio\u2011level\
    \ attacks: JBC, PAIR, PGD, AutoDan, BOOST+GPTFuzzer, TAP and Autoattack. Our experimental\
    \ pipeline targets a diverse set of open and closed SpeechLLMs, evaluates models\
    \ with and without an external StrongReject safety layer, and measures safety\u2013\
    utility trade\u2011offs."
  authors: Kris Yun, Janelys Graciano Betancourt, Rafael Molina
  board_number: R6
  institution: Northwestern University
  number: 45
  room: Rock
  session: 1
  title: Evaluating the Robustness of Jailbreak Defenses to Speech-Input Large Language
    Models
- abstract: "Alert correlation is a critical process that transforms isolated detections\
    \ into coherent attack narratives, enabling analysts to capture multi-stage intrusions\
    \ that would otherwise surface as hundreds of unrelated, low-severity events.\
    \ Microsoft\u2019s Managed Extended Detection and Response (MXDR) facilitates\
    \ this by automating alert grouping. However, it often exhibits systematic blind\
    \ spots in complex scenarios. For instance, MXDR frequently fragments alerts into\
    \ disconnected incidents when an attacker targets multiple users from a single\
    \ IP or when identical malware re-executes on the same account. To bridge these\
    \ gaps, we propose a daily AI agent pipeline that operates alongside MXDR. A correlation\
    \ subagent first scans ingested alerts for shared entities \u2014 IPs, file hashes,\
    \ and user accounts \u2014 across time windows, producing a structured analysis\
    \ packet. An analysis subagent then interprets these packets, produces prioritized\
    \ SOC reports, and feeds confirmed misses back into a rule refinement subagent\u2014\
    incrementally expanding correlation coverage with each iteration. Evaluated on\
    \ real enterprise alerts, the system surfaced multi-day attack campaigns and recurring\
    \ correlation patterns that MXDR consistently missed."
  authors: Cheng-Yun King Yang, Dongyan Xu
  board_number: R7
  institution: Purdue University
  number: 52
  room: Rock
  session: 1
  title: An Agentic AI Flow for Alert Correlation in Enterprise Networks
- abstract: 'IoT systems are notoriously susceptible to network

    attacks, given their ubiquity and often resource-constrained

    Intrusion Detection Systems (IDS). While various IDS solutions

    have been proposed to secure IoT systems, machine learning

    (ML) and deep neural network (DNN) based techniques are

    of recent focus in this field, given their ability to adapt to

    newer attacks. However, such ML and DNN based IDSs are

    typically classified as heavyweight or lightweight based on their

    resource footprint. While lightweight IDSs are often chosen for

    deployment on IoT and edge devices due to their limited resource

    requirements, their accuracy is typically limited, and improving

    it typically impacts the speed of detection, and vice versa. In

    remedy, we introduce a framework that provides an effective

    tradeoff between accuracy and speed, while keeping AI-based

    IDS models lightweight for IoT Edge deployment. By combining

    edge and cloud support, our self-improving framework achieves

    a precision of 0.92, recall of 1.0, and F1-score of 0.93, providing

    reliable and rapid attack detection while demonstrating signifi-

    cantly faster inference compared to baseline models'
  authors: Mina Habibollahi and Sharief M. A. Oteafy
  board_number: R8
  institution: Depaul University
  number: 59
  room: Rock
  session: 1
  title: A Lightweight AI-Driven Framework for Rapid Intrusion Detection in IoT
- abstract: 'We propose TIDES, a reasoning-attacking method that exposes a previously
    unrecognized failure of test-time scaling: as reasoning traces lengthen, model
    performance degrades sharply rather than improves. Unlike prior attacks on large
    reasoning models (LRMs), TIDES exploits the intrinsic properties of test-time
    scaling laws to manipulate reasoning trace length, producing degradations that
    are inherently difficult to detect. Methodologically, we define Depth-Guided Latent
    Tracker (DLT), a depth-based tracker that injects microscopic steering vectors
    into intermediate reasoning traces stealthily and combines them with on-policy
    distillation to precisely position LRMs under test-time scaling. Theoretically,
    we model latent space as a depth-indexed dynamic process and prove that under
    test-time scaling, small bounded perturbations introduced at intermediate layers
    induce non-vanishing trajectory drift, explaining why DLT remains effective yet
    difficult to detect in large reasoning models. Empirically, we evaluate TIDES
    on multiple reasoning benchmarks using two strong reasoning models, DeepSeek-R1-Distill-Qwen-7B,
    and DeepSeek-R1-Distill-Llama-8B, where it consistently outperforms state-of-the-art
    reasoning attack methods such as DecepChain and BadChain. Notably, TIDES delivers
    an average 30.3% improvement in attack performance over the baselines, demonstrating
    that TIDES remains efficient within large reasoning model generation.'
  authors: Haoran Dai , Haozheng Luo, Haotian Zhang, Meng lin, Yan Chen, Binghui Wang
  board_number: R9
  institution: NU, IIT
  number: 69
  room: Rock
  session: 1
  title: 'TIDES: Test-time Inference Drift Exploitation via Scaling'
- abstract: 'We propose TRAMBA, a hybrid transformer and Mamba architecture for acoustic
    and bone conduction speech enhancement, suitable for mobile and wearable platforms.
    Bone conduction speech enhancement has been impractical to adopt in mobile and
    wearable platforms for several reasons: (i) data collection is labor-intensive,
    resulting in scarcity; (ii) there exists a performance gap between state-of-art
    models with memory footprints of hundreds of MBs and methods better suited for
    resource-constrained systems. To adapt TRAMBA to vibration-based sensing modalities,
    we pre-train TRAMBA with audio speech datasets that are widely available. Then,
    users fine-tune with a small amount of bone conduction data. TRAMBA outperforms
    state-of-art GANs by up to 7.3% in PESQ and 1.8% in STOI, with an order of magnitude
    smaller memory footprint and an inference speed up of up to 465 times. We integrate
    TRAMBA into real systems and show that TRAMBA (i) improves

    battery life of wearables by up to 160% by requiring less data sampling and transmission;
    (ii) generates higher quality voice in noisy environments than over-the-air speech;
    (iii) requires a memory footprint of less than 20.0 MB.'
  authors: Yueyuan Sui, Minghui Zhao, Junxi Xia, Xiaofan Jiang, Stephen Xia
  board_number: R10
  institution: Northwestern University
  number: 72
  room: Rock
  session: 1
  title: 'TRAMBA: A Hybrid Transformer and Mamba Architecture for Practical Audio
    and Bone Conduction Speech Super Resolution and Enhancement on Mobile and Wearable
    Platforms'
- abstract: 'Underground mining disasters produce pervasive darkness, dust, and collapses
    that obscure vision and make situational awareness difficult for humans and conventional
    systems. To address this, we propose MDSE, Multimodal Disaster Situation Explainer,
    a novel vision-language framework that automatically generates detailed textual
    explanations of post-disaster underground scenes. MDSE has three-fold innovations:
    (i) Context-Aware Cross-Attention for robust alignment of visual and textual features
    even under severe degradation; (ii) Segmentation-aware dual pathway visual encoding
    that fuses global and region-specific embeddings; and (iii) Resource-Efficient
    Transformer-Based Language Model for expressive caption generation with minimal
    compute cost. To support this task, we present the Underground Mine Disaster (UMD)
    dataset--the first image-caption corpus of real underground disaster scenes--enabling
    rigorous training and evaluation. Extensive experiments on UMD and related benchmarks
    show that MDSE substantially outperforms state-of-the-art captioning models, producing
    more accurate and contextually relevant descriptions that capture crucial details
    in obscured environments, improving situational awareness for underground emergency
    response. The code is at https://github.com/mizanJewel/Multimodal-Disaster-Situation-Explainer.'
  authors: Mizanur Rahman Jewel and Sanjay Madria
  board_number: R11
  institution: Missouri University of Science and Technology, Rolla, MO
  number: 79
  room: Rock
  session: 1
  title: 'Explaining the Unseen: Multimodal Vision-Language Reasoning for Situational
    Awareness in Underground Mining Disasters'
- abstract: For the last decade, layered stacks have dominated the way of reasoning
    about architectures for quantum networks. However, layered architectures impose
    stringent design and timing constraints on quantum networks, adding additional
    latency to the time required to serve an entanglement generation request. Moreover,
    increasing delays from the layered approach to network control causes degradation
    of state, effectively minimizing achievable fidelities. In this work we simulate
    a resource-centric, task-based approach to quantum network control by utilizing
    a centralized controller. Using the SeQUeNCe quantum network simulator, we implement
    the centralized controller which tracks quantum memory availability across all
    nodes, and schedules objectives in an offline fashion using a priority based scheduler.
    We evaluate the performance of this controller on multiple topologies (bottleneck,
    grid, star, caveman) of significant scale, with varying reservation patterns,
    thereby also demonstrating the viability of the resource-centric task-based quantum
    network control framework at scaling. Our simulation results show that the caveman
    and grid topologies have a higher fraction of delivered requests with low delay
    compared to the star topology, but with a higher fraction of highly delayed requests
    as well. Furthermore, we find a linear shift of the CDFs in terms of queue size
    for all topologies depending on the reservation delay. More interestingly, we
    conclude that the CDFs of priority queues for the star topology converge fast
    into saturation for increasing request arrival rates, demonstrating together with
    the other results that the framework is robust for high load scenarios in quantum
    networks.
  authors: Alexander Pirker, Robert Hayek, Alexander Kolar, Igor Kadota, Joaquin Chung,
    Rajkumar Kettimuthu
  board_number: D1
  institution: Quantum Network Design GmbH; Argonne National Laboratory, University
    of Chicago, Northwestern University
  number: 86
  room: Dillo
  session: 2
  title: Centralizing Task-based Approach to Quantum Network Control
- abstract: 'The creation of virtual memory was a watershed moment for systems software.
    It enabled safe multi-tenancy, memory protection, and demand paging through a
    simple but powerful abstraction: the page. Yet the page is a poor match for how
    modern applications actually organize memory. User-space programs allocate, access,
    and optimize around objects, often only tens of bytes in size, while the kernel
    manages memory in multi-kilobyte pages. This granularity mismatch forces virtual-memory
    mechanisms such as swapping, protection, and access tracking to operate over pages
    that may indiscriminately mix hot and cold objects. This is fundamentally because
    the virtual memory system cannot have generalized introspection into each application''s
    specific memory semantics and use cases.


    In this work, we present Yukon, a hardware extension that extends the virtual-memory
    philosophy to individual heap objects through handles: a level of indirection
    managed entirely in user space. Yukon adds a simple hardware structure, the Handle
    Translation Lookaside Buffer (HTLB), to the load/store unit allowing handle-based
    object translation to occur directly in hardware rather than through software
    handle dereferences. We describe an implementation of the HTLB in the BOOMv3 RISC-V
    out-of-order core running in FireSim.


    With a small hardware addition and a simple hardware/software interface, Yukon
    enables virtual-memory-like mechanisms at object granularity and under user-space
    control. By making individual objects relocatable and observable, Yukon opens
    the door to fine-grained memory management techniques such as object-level swapping,
    compression, protection, and locality optimization without requiring the kernel
    to understand application-specific data structures.'
  authors: Nick Wanninger, Nikos Hardavellas, Peter Dinda
  board_number: D2
  institution: Northwestern University
  number: 92
  room: Dillo
  session: 2
  title: Minimal Hardware Extensions for Object-Level Memory Management
- abstract: "Floating point virtualization allows existing, unmodified application\n\
    binaries to be run using an alternative arithmetic system. Such\nvirtualization\
    \ is geared to alternative numbers that are \u201Clarger\u201D\n(require more\
    \ bits) than the IEEE 754 numbers (e.g., 64 bit doubles)\nthey replace. In this\
    \ work, we approach the challenge of virtualizing\nwith \u201Csmaller\u201D numbers\
    \ (requiring fewer bits), which is of increasing\ninterest given the explosion\
    \ of low-precision hardware targeting AI.\nWe focus specifically on the ubiquitous\
    \ x64 architecture through a\nhardware/software co-design that leverages x64 functionality\
    \ that\ncurrently lays fallow. The design combines (a) instruction traps\nvia\
    \ lazy FPU abduction, and (b) simplified memory management\nby tiny value boxing.\
    \ We also develop an example tiny alternative\narithmetic system that allows smaller\
    \ IEEE 754 numbers, down to 3\nbits, with the exact precision able to be specified\
    \ on a per-value or\nper-instruction basis at runtime. Our prototype system is\
    \ evaluated\nusing validation and performance tests based on running NAS and\n\
    other benchmarks with a range of lower precision numbers."
  authors: Kevin Hayes and Peter Dinda
  board_number: D3
  institution: Northwestern University
  number: 93
  room: Dillo
  session: 2
  title: Enabling Floating Point Virtualization With Tiny Numbers
- abstract: "Executing large-scale, high-throughput lightweight Large Language Model\
    \ (LLM) inference workflows on conventional shared clusters leads to long job\
    \ queues due to inefficient static resource allocation. While opportunistic GPU\
    \ clusters offer a vast pool of compute, their transient nature makes them challenging\
    \ to utilize, as the overhead of repeatedly initializing an inference job's state\
    \ with billions of parameters after preemption is prohibitively high.\n\nWe introduce\
    \ StickyInvoc, a symbiotic relationship between two new task models for high-throughput\
    \ workflows. Specifically, a \u201Csticky\u201D task creates a persistent and\
    \ inheritable state on a worker node from a user-provided template, while subsequent\
    \ \u201Cinvocation\u201D tasks inherit this state and perform the actual computation\
    \ without incurring the state creation overhead or destroying the state upon exit.\
    \ This allows efficient reuse and rapid context transfer between inferences across\
    \ intermittently available GPUs, virtually eliminating initialization costs. With\
    \ StickyInvoc, a claim verification workflow achieves a 3.6x speedup on a stable\
    \ testbed with 20 GPUs, and completes in just 784 seconds using 186 opportunistic\
    \ GPUs."
  authors: Thanh Son Phung, Douglas Thain
  board_number: D4
  institution: University of Notre Dame
  number: 95
  room: Dillo
  session: 2
  title: 'StickyInvoc: Rethinking Task Models for High-throughput Workflows in the
    LLM Era'
- abstract: 'Programming irregular graph applications is challenging on today''s scalable
    supercomputers. We describe a novel programming model, KVMSR+UDWeave, that supports
    extreme scaling by exposing fine-grained parallelism.  By enabling the expression
    of maximum parallelism, it opens the door for extreme scaling, even on both small
    and large graph problems.


    KVMSR+UDWeave cleanly separates the three key dimensions of parallel programming:
    parallelism, computation binding, and data placement.  This decomposition reduces
    effort to achieve scalable, high-performance for graph algorithms on real-world,
    highly skewed graphs.  Key features of the UpDown supercomputer (computation location
    naming and shared global address space) enable decomposition and scalable, high
    performance.


    In the IARPA AGILE program, we built numerous graph benchmarks and workflows,
    and use them to illustrate the programming model.  Simulation results for UpDown
    show excellent strong-scaling to million-fold hardware parallelism and high absolute
    performance.  Results suggest KVMSR+UDWeave enables reduced programming effort
    for scaling the most demanding irregular applications.'
  authors: Alexander Fell, Yuqing Wang, Tianshuo Su, Marziyeh Nourian, Wenyi Wang,
    Jose M. Monsalve-Diaz, Andronicus Rajasukumar, Jiya Su, Ruiqi Xu, Rajat Khandelwal,
    Tianchi Zhang, David F. Gleich, Yanjing Li, Hank Hoffmann, Andrew A. Chien
  board_number: D5
  institution: University of Chicago
  number: 116
  room: Dillo
  session: 2
  title: 'KVMSR+UDWeave: Extreme-Scaling with Fine-grained Parallelism on the UpDown
    Graph Supercomputer'
- abstract: "Record/Replay (RR) allows developers to record an execution and deterministically\
    \ replay it's behavior later to diagnose production bugs.\nUnfortunately, RR introduces\
    \ non-negligible performance overhead for multi-threaded and I/O bound workloads.\n\
    Recordings capture either a total or partial order of synchronization events,\
    \ which the replayer later enforces.\nPartial orders produce faster replays, but\
    \ require pre-processing before replay.\nRecording also effectively doubles the\
    \ I/O performed as any data read must be duplicated and written to the log. \n\
    \nWe present two complimentary techniques to reduce the overhead of RR.\nRelaxed\
    \ Total Order (RTO) is a weakening of total order that preserves cross-thread\
    \ constraints needed for replay while avoiding unnecessary serialization.\nRTO\
    \ can operate online (i.e., during runtime), enabling deterministic replay without\
    \ pre-processing the log.\nRTO's strictness is a novel point between total and\
    \ partial order.\nA prototype implementation in an existing RR system, JMVX, halves\
    \ recording overhead from 21.7% to 13.7% and replay overhead from 64.9% to 13.2%.\n\
    \nSecond, we combine RR with Multi-Version eXecution (MVX), a technique similar\
    \ to online RR, to eliminate RR's poor performance on I/O-bound processes.\nA\
    \ follower variant, i.e., an online replayer in a separate process, absorbs the\
    \ I/O needed for logging and backfills I/O which can be safely re-executed on\
    \ the same system, keeping the user-facing leader off the critical path.\nOur\
    \ prototype reduces the overhead on I/O bound programs from 196.1% to just 25.8%.\n\
    Together, RTO and hybrid MVX/RR substantially narrow the gap between today\u2019\
    s RR systems and practical, low-overhead, always-on deployment."
  authors: David Schwartz
  board_number: D6
  institution: UIC
  number: 117
  room: Dillo
  session: 2
  title: Optimizing Record/Replay through Relaxed Total Ordering and Multi-Version
    eXecution
- abstract: "Semi-structured data has created a wealth of information that remains\
    \ difficult to navigate due to its nested and often inconsistent nature. Knowledge\
    \ Graphs (KGs) offer a powerful and visual solution by transforming these isolated\
    \ data objects into a connected web of entities and relationships. However, such\
    \ data objects can represent similar or different entity types and can range from\
    \ simple key-value pairs to deeply nested ones. Building coherent structured KG\
    \ requires a carefully designed data pipeline that maintains semantic integrity\
    \ as well as the context of the information. Such a data pipeline faces two main\
    \ challenges.\nThe first challenge is identifying when different data objects\
    \ represent the same entity in order to merge them. Traditional string-matching\
    \ or rule-based systems often fail to detect similarity in varied schemas, leading\
    \ to duplicate nodes and fragmented graphs. The second challenge is determining\
    \ the optimal level of normalization. Over-normalization can lead to trivial nodes\
    \ that obscure high-level relationships, while excessive denormalization results\
    \ in big nodes that lose the granular connectivity essential for graph-based discovery\
    \ and reasoning. \nIn this project we propose Doc2Graph to address these challenges.\
    \ Doc2Graph implements a multi-tiered similarity solution by utilizing Vector\
    \ Databases for a rapid cosine similarity filtering then a Large Language Models\
    \ (LLMs) for a deep contextual similarity check. Doc2Graph also explores an adaptive\
    \ and user-driven schema that balances normalization and denormalization, ensuring\
    \ that the resulting KG representation is semantically rich across diverse entity\
    \ types. The project is a work in progress and, in the presented work, we focus\
    \ on addressing the first challenge."
  authors: Abdul Haseeb Shams, Mohammad Bachcha, Ahmed Khaled
  board_number: D7
  institution: Northeastern Illinois University
  number: 138
  room: Dillo
  session: 2
  title: 'Bridging the Gap: Semantic Vector Middleware for Knowledge Graph Construction'
- abstract: Identifying research limitations is central to rigorous scientific assessment.
    However, zero-shot large language models (LLMs) often produce superficial or generic
    critiques. They usually restate the author's disclosed weaknesses while missing
    deeper methodological and contextual flaws. This problem is made worse because
    many authors disclose only partial or trivial limitations. We introduce \textbf{SciLimAgents},
    a model-agnostic multi-agent framework for generating evidence-based limitations
    from scholarly text. It consists with LimitAgents and NovAgents. Here, LimitAgents
    uses empirically derived specialist roles to decompose limitation generation across
    complementary critique dimensions, while NovAgents, a novelty-focused extension
    compares each paper against retrieved related work to surface novelty-specific
    weaknesses that single-paper analysis misses. To ground critique beyond the input
    manuscript, our framework incorporates shared-memory retrieval over a 120K-paper
    scholarly corpus and citation-grounded evidence from referenced work. We evaluate
    on a large-scale AI/ML benchmark, where the full framework consistently outperforms
    strong zero-shot and multi-agent baselines, improving F1 by 20.15 to 44.77 points.
    We further validate both the limitation extraction pipeline and the evaluation
    protocol with human annotators, obtaining agreement of at least 0.92.
  authors: Ibrahim Al Azher,  Hamed Alhoori
  board_number: D8
  institution: Northern Illinois University
  number: 144
  room: Dillo
  session: 2
  title: 'LimAgents: Scalable Multi-Agent RAG for Scientific Critique Generation at
    Corpus Scale'
- abstract: 'High-Performance Computing (HPC) and large-scale AI systems now consume
    tens of megawatts of power, making energy efficiency a first-class design constraint
    alongside performance. Existing job-level power management relies on single-knob,
    static policies that fail to capture the complex interactions between multiple
    hardware controls, node power limits, GPU, CPU, and Uncore DVFS, across heterogeneous
    node configurations and dynamic workload phases.

    We aim to develop a multi-knob, job-level performance-energy optimization framework
    for any HPC system. The approach builds lightweight phase-aware response models
    describing how runtime and energy vary across different knob combinations at distinct
    phases of a workload. These models are learned online using a bandit controller
    interfacing directly with GEOPM (Global Extensible Open Power Manager), which
    enforces control decisions across all nodes allocated to a job in real time. By
    incorporating node-to-node hardware variability, the framework supports non-uniform
    power assignment across the node allocation redistributing power headroom toward
    nodes on the critical path to improve load balancing and total job throughput.

    The best knob configuration at each phase is identified by combining the learned
    response models with performance and facility power constraints, using the Energy-Delay
    Product (EDP) as the optimization objective. We aim to demonstrate measurable
    EDP reduction across representative HPC and large-scale AI workloads, establishing
    a generalizable foundation for adaptive multi-knob power optimization in heterogeneous
    environments.'
  authors: "Niccol\xF2 Brembilla, Zhiling Lan, Michael E. Papka"
  board_number: D9
  institution: University of Illinois Chicago
  number: 150
  room: Dillo
  session: 2
  title: Multi-Knob Job-Level Performance-Energy Optimization via Phase-Aware Bandit
    Control and GEOPM
- abstract: 'Large language model coding agents are increasingly used to generate
    scientific data-analysis workflows, but evaluations usually stop at output correctness.
    For data-intensive science, this is incomplete: two workflows can produce the
    same valid result while placing very different pressure on storage systems. This
    poster studies I/O behavior in correctness-passing LLM-generated scientific workflows.


    We evaluated Sonnet 4.5, Gemini 2.5 Flash, and Gemma 4 26B on five tasks: climate
    reanalysis, satellite raster processing, meteorological time-series composition,
    neuroscience HDF5/NWB analysis, and genomic variant-format conversion. Each workflow
    was executed in a container and validated against expected scientific outputs.
    For passing runs, we traced POSIX-level reads, writes, metadata operations, and
    per-step behavior, then compared the resulting I/O profiles against expert-written
    implementations.


    Across these five tasks, 46 of 105 agent-generated workflows passed validation.
    We summarized only cases where the same model completed the same task successfully
    at least three times. In all of those comparisons, the expert implementation used
    fewer POSIX operations and read less data. The median validated agent workflow
    used 3.8x more POSIX operations and read 6.5x more data than the expert baseline.
    We decomposed I/O into final-solution execution versus exploratory steps such
    as failed attempts, inspection, and verification. Exploration overhead varied
    by model: some passing runs concentrated nearly all I/O in the final solution,
    while others spent much more I/O during exploration.


    These results suggest that correctness alone is insufficient for evaluating LLM-generated
    scientific code. Storage behavior should be measured directly, especially before
    deploying agent-generated workflows on shared HPC or cloud storage systems.'
  authors: Izzet Yildirim, Jaime Cernuda, Xian-He Sun, Anthony Kougkas
  board_number: L1
  institution: Illinois Institute of Technology
  number: 87
  room: Lake
  session: 2
  title: 'Correct Is Not I/O Efficient: Measuring Storage Costs of LLM-Generated Scientific
    Workflows'
- abstract: 'Shor''s algorithm threatens every blockchain that relies on ECDSA signatures
    for transaction authentication. NIST has standardized post-quantum digital signature
    schemes, ML-DSA (Dilithium) and Falcon, but their cost in a real blockchain pipeline,
    where signatures must be serialized, transmitted, batch-verified, and committed
    under strict block deadlines, remains poorly understood. Most existing studies
    measure isolated cryptographic primitives, not their interaction with consensus
    and networking layers. We integrated Falcon-512 and ML-DSA-44 into the MEMO Proof-of-Space
    blockchain, replacing fixed-size Ed25519 transactions with a unified crypto_backend
    abstraction that supports compile-time scheme selection and runtime hybrid operation,
    where validators using different signature schemes coexist on the same network.
    Variable-length signatures (64 to 2,420 bytes) and public keys (32 to 1,312 bytes)
    flow end-to-end through wallet, transaction pool, OpenMP-parallel batch verification,
    block construction, and ledger commitment. We conducted controlled experiments
    on Chameleon Cloud across multiple transaction batch sizes. At 500 transactions,
    Ed25519, Falcon-512, and ML-DSA-44 deliver statistically equivalent end-to-end
    throughput (1,400 to 2,600 TPS), confirming the pipeline is network-bound rather
    than verify-bound at this scale. At 1,000 transactions, Falcon-512 outperforms
    ML-DSA-44 by 68% (2,572 vs. 1,533 TPS) despite ML-DSA''s 2x faster raw verification
    speed. Signature size differences drive this divergence: Ed25519 at 64 bytes,
    Falcon-512 at 700 bytes, and ML-DSA-44 at 2,400 bytes, with the latter saturating
    serialization and ZMQ transfer bandwidth. Our results demonstrate that for deployed
    blockchains, signature size, not verification speed, is the dominant cost of post-quantum
    migration.'
  authors: Likitha Shankar, Venkata Harsha Pedada, Ioan Raicu
  board_number: L2
  institution: Illinois Institute of Technology
  number: 89
  room: Lake
  session: 2
  title: 'qMEMO: Quantum-Resistant Proof-of-Space Blockchain System'
- abstract: Advances in artificial intelligence (AI), particularly large language
    models (LLMs), have demonstrated effectiveness in technical tasks such as software
    engineering and code generation. However, their direct application to scientific
    experiments remain challenging, specifically quantum networks, where strict formalism
    and complex reasoning is demanded.  We introduce Agentic Quantum Network Simulator
    Arena (AQNSA), a framework designed to replicate and extend quantum networking
    research using AI agents. Given an experimental prompt, AQNSA orchestrates a multi-agent
    workflow in which a research agent develops a structured experiment plan and an
    engineering agent translates that plan into executable simulations using the Simulator
    of QUantum Network Communication (SeQUeNCe) framework. To ground agent reasoning
    and support planning and execution, we construct a knowledge graph from the cited
    materials of eight quantum networking studies selected for replication. Domain-expert
    graders evaluate agent reasoning traces, simulations and results. Our results
    investigate the feasibility agentic research workflows for scientific experiments
    in quantum networks.
  authors: Pablo Cesar Bedolla Ortiz, Joaquin Chung, Rajkumar Kettimuthu
  board_number: L3
  institution: Dominican University, Argonne National Laboratory
  number: 96
  room: Lake
  session: 2
  title: 'AQNSA: Agentic Quantum Network Simulator Arena'
- abstract: "Automatic parallelization of sequential programs remains ineffective\
    \ outside small kernels with regular structure.\nAs a consequence, expert programmers\
    \ achieve multithreaded execution manually by reasoning about coarser-grained\
    \ operations, reshaping data structure layouts to support parallel access, and\
    \ exploiting algorithm-specific knowledge.\nNone of the insights behind these\
    \ transformations can be inferred by static analysis.\nExisting compilers reason\
    \ about fine-grained dependences and fall short beyond scalar and array reductions,\
    \ failing to capture opportunities that expert programmers routinely exploit.\n\
    \nWe propose a new compiler abstraction called the Dependence Termination Graph\
    \ (DTG) that pairs dependences with programmer-defined transformations that can\
    \ terminate them.\nBy making these transformations first-class in compiler reasoning,\
    \ DTG exposes parallelism that prior abstractions cannot represent or infer.\n\
    This allows compilers to parallelize complex operations such as sequence appends\
    \ and hash-table insertions across different concrete implementations.\nWe define\
    \ the DTG over a lightweight extension of LLVM IR that captures dependences between\
    \ high-level memory operations beyond traditional low-level reads and writes.\n\
    Programmers express relations through an annotation interface that lowers directly\
    \ to the IR extension.\n\nWe evaluate DTG on 11 benchmarks from PARSEC, GAPBS,\
    \ and SPEC CPU 2017 where prior compilers failed to match the performance of manual\
    \ parallel implementations.\nOn a 28-core processor, our compiler T-800 outperforms\
    \ prior automatic and semi-automatic approaches by 3.1\xD7, closing 96\\% of the\
    \ speedup achievable via manual parallelization."
  authors: Federico Sossai
  board_number: L4
  institution: Northwestern University
  number: 98
  room: Lake
  session: 2
  title: Rethinking Dependences for Compiler Parallelization
- abstract: "Leader-based consistency protocols often struggle with scalability due\
    \ to the centralization of client request ordering. The leader, responsible for\
    \ ensuring consistency by ordering\nreads and writes, becomes a bottleneck under\
    \ high load, limiting overall system performance. This limitation is exacerbated\
    \ by the tight coupling of consistency protocols with fault tolerance mechanisms,\
    \ which further strain the leader\u2019s capacity.\nKeyspace sharding, a widely\
    \ adopted technique in databases and blockchain systems, helps mitigate this bottleneck\
    \ by distributing the workload. However, it introduces two primary challenges:\
    \ first, maintaining consistency across shards, and second, balancing the workload\
    \ between them. While several multi-leader approaches have been proposed to address\
    \ consistency issues, they often neglect the crucial aspect of leadership balancing.\n\
    Furthermore, these existing solutions frequently fail to consider dynamic factors\
    \ such as CPU utilization, request frequency, and other performance metrics that\
    \ significantly impact overall system efficiency.\nTo address these gaps, we propose\
    \ Skiff, a variant of the Raft protocol that automatically balances leadership\
    \ for a single shard. Furthermore, we introduce Shipyard, a higher-level protocol\
    \ that manages all sharded keyspaces as a unified system, integrating failure\
    \ recovery and offering linearizable reads and writes."
  authors: Xincheng Yang, Kyle Hale
  board_number: L5
  institution: Illinois Institute of Technology
  number: 100
  room: Lake
  session: 2
  title: 'Shipyard: A Multi-Leader Consensus Protocol with Auto-Balanced Leadership
    of the Sharded Keyspace'
- abstract: "Kersten et al. (2018) compared vectorized and data-centric compiled query\
    \ execution within a single test framework on a single-socket Skylake X at moderate\
    \ thread counts, concluding that the two paradigms achieve broadly similar performance\
    \ with principled tradeoffs by query class. Their conclusions and recommendations\
    \ have since been treated as settled. We reproduce their methodology on five contemporary\
    \ platforms \u2014 multi-socket Cascade Lake, Neoverse N1, Neoverse V2 in single-\
    \ and dual-NUMA configurations, and AMD EPYC \u2014 at higher thread counts and\
    \ finer thread-count sampling. We find that the paper's qualitative mechanisms\
    \ generalize: compilation wins register-resident compute, vectorization hides\
    \ cache-miss latency better, and the relative engine ranking on most queries matches\
    \ the paper's findings at single thread. The quantitative conclusions do not generalize.\
    \ Engine performance ratios at high thread counts are governed by which platform-specific\
    \ bottleneck binds \u2014 memory bandwidth on single-socket hardware, cross-NUMA\
    \ coordination on multi-NUMA hardware, execution-port contention under SMT \u2014\
    \ and these bottlenecks vary in ways the paper's measurement platform could not\
    \ have surfaced. Several specific recommendations from the paper actively mislead\
    \ on modern hardware: vector size 1024 is suboptimal across all tested platforms,\
    \ SIMD optimizations that the paper found neutral on AVX-512 produce substantial\
    \ engine-ranking shifts on ARM, and hyperthreading degrades rather than improves\
    \ throughput on most queries on modern server parts. We argue that engine choice\
    \ on modern many-core systems is a function of platform topology and operating\
    \ point that no single benchmark configuration can capture."
  authors: Alex Butler
  board_number: L6
  institution: Northwestern University
  number: 103
  room: Lake
  session: 2
  title: Everything You Think You Know About Compiled and Vectorized Queries Is Wrong
- abstract: 'The ATLAS project is adopting container technologies to improve workflow
    portability and reproducibility. However, this causes concern about I/O performance
    in derivation workflows on HPC systems, where inefficient I/O can affect both
    ATLAS and other users.


    To enable reliable production deployment on HPC resources, we systematically study
    I/O behavior in ATLAS derivations across container runtimes supported by ATLAS,
    including Podman, Shifter, and Apptainer, and compare them against native execution.
    We conduct experiments on both CERN computing resources and the Perlmutter supercomputer
    at NERSC.


    Our study finds that containerization can generate distinct, runtime-dependent
    I/O performance differences in ATLAS derivations, particularly related to shared
    file system scalability and bottlenecks. We identify which container runtimes
    degrade or maintain I/O efficiency when compared to native execution. These outcomes
    provide practical guidance for deploying ATLAS derivations on HPC systems to secure
    efficient and fair use of shared storage infrastructure.'
  authors: Wesley Kwiecinski
  board_number: L8
  institution: University of Illinois Chicago
  number: 108
  room: Lake
  session: 2
  title: Evaluating I/O Behavior of ATLAS Derivations Across Container Runtimes on
    HPC Platforms
- abstract: "Manycore architectures are a promising direction for single-chip performance.\
    \ They typically use in-order cores and caches as building blocks and can produce\
    \ good performance on regular applications. However, on irregular applications,\
    \ they have low core utilization due to data-dependent control-flow and memory\
    \ access. \n\nWe propose UpDown manycore that employs a novel core with Event-Driven\
    \ Scheduling (EDS), Software-controlled Lightweight Threading (SLT), and Split-transaction\
    \ Memory Access with software synchronization (SMA) to deliver both high core\
    \ utilization and chip performance. On a variety of graph and sparse applications,\
    \ UpDown outperforms a much larger commercial multicore chip (20-core, OoO) by\
    \ up to 81x. \n\nCompared to simple, in-order cores, the UpDown core\u2019s novel\
    \ mechanisms provide a 2.4-5.9x performance advantage, specifically 1.9x (EDS),\
    \ 1.4x (SLT), and 1.4x (SMA). For a manycore chip, these architectural benefits\
    \ enable a 2048-core UpDown to outperform an 8192-core in-order chip of similar\
    \ Si area by 3.1x overall. By efficiently scheduling computation from  many parallel\
    \ threads, UpDown achieves high core utilization. Further, UpDown mechanisms enable\
    \ it to more effectively exploit the growing bandwidth available from HBMs and\
    \ tolerate higher NoC latencies, supporting future scaling. "
  authors: Andronicus Rajasukumar, Ruiqi Xu, Tianchi Zhang, Yuqing (Ivy) Wang, Tianshuo
    Su, Marziyeh Nourian, Jianru Ding, Jiya Su, Rajat Khandelwal, Alexander Fell,
    David F. Gleich, Yanjing Li, Henry Hoffmann, Andrew A. Chien
  board_number: L9
  institution: University of Chicago, Purdue University
  number: 110
  room: Lake
  session: 2
  title: 'UpDown: Efficient Manycore based on Many Threading and Scalable Memory Parallelism'
- abstract: 'TLA+ has supported industrial verification at companies such as Amazon
    and Microsoft, yet writing correct TLA+ specifications from natural language still
    requires time and expertise, which limits adoption. LLMs show promise, but no
    prior study measures whether they produce semantically correct TLA+ specifications
    from natural language. Our research presents the first systematic evaluation of
    LLM-based TLA+ specification synthesis from natural language.  Our study evaluates
    30 LLMs across eight families on a curated dataset of 205 TLA+ specifications:
    25 open-weight models across four prompting strategies (2,600 runs) and 5 proprietary
    models under few-shot prompting (130 runs), all validated by the SANY parser and
    TLC model checker. LLMs achieve up to 26.6% syntactic correctness but only 8.6%
    semantic correctness, with successes exclusive to progressive prompting. Results
    show that model size does not predict quality, e.g., DeepSeek r1:8b outperforms
    its 70B variant across all strategies, which suggests the importance of reasoning
    alignment for formal languages. Code-specialized models consistently underperform
    due to negative transfer from mainstream language training. We identify five recurring
    hallucination categories, all traceable to specific training data biases. These
    results suggest that current LLMs do not generate reliable TLA+ specifications
    without expert oversight. We release the evaluation framework, code, and dataset
    to support reproducibility and future research.'
  authors: Brian Ortiz, Arslan Bisharat, Eric Spencer, Khushboo Bhadauria, Anisa Ramos,
    Mohammed Abuhamad, Konstantin Laufer, TaiNing Wang, George K. Thiruvathukal
  board_number: L11
  institution: Loyola University Chicago
  number: 113
  room: Lake
  session: 2
  title: 'Large Language Models (LLM) and Temporal Logic of Actions (TLA): How Effective
    are LLMs for Verification Systems'
- abstract: "Traditional supercomputers have focused on dense computation performance\
    \ as exemplified by HPL. Graph processing applications differ with extreme irregularity\
    \ (10^9 imbalance in skewed, real-world graphs) that produces unpredictable work,\
    \ parallelism, memory access, and communication. Together, these make scalable\
    \ performance and programming difficult.\n\nWe describe the UpDown system architecture,\
    \ co-designed for irregular graph computations. UpDown provides efficient fine-\
    \ grained thread invocations (\u223C10 instructions), direct messaging (no network\
    \ interface card) for scalable local and global messaging, and split-transaction\
    \ memory operations that enable extremely high memory bandwidth. Combined with\
    \ architectural support for global addressing and an aggressive network design,\
    \ these UpDown features enable direct exploitation of edge and vertex parallelism,\
    \ using it to deliver breakthrough graph processing performance and programmability.\n\
    \nWe evaluate the performance of the UpDown system using a challenging suite of\
    \ graph applications (Pagerank, Breadth-first Search, Triangle Counting, Partial\
    \ Match, etc). For a single-node, results show a 100-fold performance advantage\
    \ over multicore CPUs. Compared to today\u2019s fastest scalable parallel computers,\
    \ UpDown achieves 1000-fold performance increases. UpDown delivers these levels\
    \ of performance with high-level programmability; these programs directly express\
    \ vertex-edge parallelism, which UpDown exploits directly in hardware."
  authors: Andrew A. Chien, Charles Colley, Jianru Ding, Alexander Fell, David F.
    Gleich, Henry Hoffmann, Moubarak Jeje, Rajat Khandelwal, Yanjing Li, Jose M. Monsalve
    Diaz, Marziyeh Nourian, Andronicus Rajasukumar, Jiya Su, Tianshuo Su, Yuqing (Ivy)
    Wang, Wenyi Wang, Ruiqi Xu, Tianchi Zhang
  board_number: L12
  institution: University of Chicago, Argonne National Laboratory, Tactical Computing
    Laboratories, Purdue University
  number: 114
  room: Lake
  session: 2
  title: 'UpDown: A Supercomputer Co-designed for Scalable Graph Processing'
- abstract: 'Reproducing distributed scientific workflows in HPC environments requires
    capturing the complete execution state of both the workflow coordinator and all
    compute nodes. While application virtualization techniques can audit a single
    process and produce a self-contained replayable container, applying this to distributed
    workflows introduces three unsolved problems. (1) auditing each worker independently
    produces heavily overlapping file sets, making naive aggregation impractical at
    scale due to redundant data transfer. (2)  each worker produces its own isolated
    provenance log, leaving cross-node data dependencies ( files produced by one worker
    and consumed by another)  unrecorded, with process identities that are only locally
    meaningful. (3) replaying the workflow on a new cluster requires efficiently distributing
    the captured environment without shipping files that were not true dependencies
    (read before write).

    This paper proposes a system that addresses all three problems. To capture worker
    environments efficiently, each worker sends its provenance log to the head node,
    which uses it to identify files already present using content hash and requests
    only the missing delta container reducing transfer proportionally to environment
    overlap across workers. To unify provenance, we merge per-worker logs into a single
    coherent record by mapping intermediate files to a canonical identity via content
    hashing and namespacing process identifiers to eliminate conflicts across nodes.
    For replay, we construct a minimal hermetic container containing only the files
    accessed at audit time, which is efficiently distributed to compute nodes on the
    target cluster. Together, these contributions enable faithful, auditable reproduction
    of distributed workflows without access to the original execution environment.'
  authors: Talha Azaz, Raza Ahmad, Tanu Malik
