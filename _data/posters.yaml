- abstract: "WebGPU is a cross-platform GPU programming\nstandard that maps a single\
    \ shader codebase to Vulkan, Di-\nrect3D 12, and Metal, reaching every major GPU\
    \ vendor on\nboth web browsers and native runtimes. However, unlike vendor-\n\
    specific ecosystems that ship mature compute libraries (e.g.,\nThrust for CUDA),\
    \ WebGPU currently lacks a standard library\nof reusable GPU compute primitives.\
    \ As a step toward filling this\ngap, we implement a representative family of\
    \ GPU set operations,\nnamely intersection, union, difference, and symmetric difference,\n\
    in WebGPU. Our implementation provides eight set operations\n(four keys-only and\
    \ four key-value variants) through a single\npipeline abstraction and introduces\
    \ a batched execution model\nthat processes thousands of input-array pairs in\
    \ a single GPU\nsubmission. We demonstrate the efficacy of our implementation\n\
    across five GPU platforms, NVIDIA RTX 3060, NVIDIA A100\n(Polaris supercomputer),\
    \ AMD, Intel integrated, and Apple\nSilicon, and three application domains: frequent\
    \ itemset mining\n(ECLAT), SQL query execution (TPC-H Q12), and genomic\nJaccard\
    \ similarity. On the A100, WebGPU runs within 14% of\nnative CUDA across all workloads;\
    \ on the RTX 3060, the gap\nwidens to 1.16\xD7\u20131.60\xD7 (WebGPU slower).\
    \ Our batched pipeline\noutperforms Thrust by up to 9.9\xD7 end-to-end on high-pair-count\n\
    workloads. The same WGSL code produces correct results on all\nfive platforms\
    \ without modification, confirming that WebGPU is\na viable platform for scalable\
    \ and portable GPU computing."
