- abstract: "Current work on Natural Language-to-SQL (NL2SQL) LLM models and systems\
    \ largely focus on improving end-to-end generation and execution accuracy of SQL\
    \ queries, as measured by popular benchmarks such as BIRD-Bench and Spider. However,\
    \ execution accuracy alone is insufficient in practice because the ground-truth\
    \ correctness is not always known or clear to the data analyst. In our ongoing\
    \ work, we propose LLM SQL verifier as an important part of the NL2SQL workflow.\
    \ \nAt a basic level, verifiers are an LLM-as-a-judge approach to evaluate the\
    \ correctness of the generated SQL queries. They use the natural language, schema,\
    \ and other auxiliary information, but do not involve comparing against ground\
    \ truth as in the above benchmarks. With better verifiers, we can improve the\
    \ generation accuracy for NL2SQL systems, using them as selectors for multiple\
    \ generated queries and thus augmenting prior multiple-generation approaches.\
    \ In a different direction, they can be used to provide a confidence metric in\
    \ real-life database use cases where ground truths are not known to the data analyst,\
    \ which is a point typically neglected in current literature. \nTo this end, we\
    \ present methods to improve the accuracy of verifiers, in particular through\
    \ reinforcement learning (GRPO). Finally, we discuss our work on going beyond\
    \ single model verifiers and building agentic frameworks using verifiers to automate\
    \ NL2SQL generation. We plan to further develop approaches using iterative verification\
    \ and refinement for NL2SQL generation without relying on execution verification.\n"
  authors: Donghyun Sohn, Junho Won
  board_number: N14
  institution: Northwestern University
  long_bio: "Donghyun Sohn is a 4th-year Computer Science PhD student at Northwestern\
    \ University, working with Prof. Jennie Rogers on privacy-preserving database\
    \ systems. His research sits at the intersection of cryptographic protocols and\
    \ database query optimization, with a particular interest in how hardware properties\u2014\
    memory hierarchy, thread allocation, and accelerator topology\u2014shape the design\
    \ of efficient secure analytics engines. He is the lead author of Alchemy (VLDB\
    \ 2025), a cost-based query optimizer for secure multi-party computation that\
    \ introduces an analytical model over AND-gate counts and yields 21.8\xD7 speedup\
    \ over baseline plans. His current work on HAMMER explores hybrid FHE+MPC OLAP\
    \ execution, including a secure context-switching protocol between encryption\
    \ regimes and joint optimization of cryptographic parameters with physical query\
    \ plans. He has also contributed to differentially-private performance regression\
    \ testing (ScanTwin, SeQureDB 2026) and natural-language-to-SQL translation. He\
    \ will join LinkedIn's Materialized View team as a research intern in summer 2026\
    \ and IBM Research Zurich in fall 2026.<br/><br/>Junho Won is a 6th-year Mathematics\
    \ PhD student at Northwestern University, working with Prof. Bao Le Hung on number\
    \ theory. His mathematical research focuses on geometric structures arising in\
    \ the p-adic Langlands program and connections to representation theory. Recently,\
    \ he has also worked on applications of LLMs, particularly to mathematical problem\
    \ solving and to database systems. He has collaborated with Donghyun Sohn on natural-language-to-SQL\
    \ translation using LLMs, with a particular focus on automatic verification of\
    \ queries and applications to improving query accuracy."
