  title: Empowering scientific workflows with federated agents
- abstract: The Sage Grande Testbed is an open artificial intelligence testbed that
    supports edge computing and intelligent sensing. The platform allows researchers
    to develop new AI algorithms and measurement strategies. After a decade of experience,
    our current project is set to deploy 300 new state-of-the-art AI-enabled platforms
    across the USA, and in every state. Scientists and students can explore next-generation
    AI-enabled infrastructure for real-time monitoring of sensor data for many applications
    including wildfire, flooding, and agriculture. As edge computing platforms become
    more powerful, they can support bigger AI models, including large language models
    (LLMs). In the future, scientists will be able to use natural language prompts
    and AI agents to program their sensing strategies and collect relevant data. With
    new AI-enabled infrastructure, Sage can provide users with new ways to write programs
    and control Sage nodes.
