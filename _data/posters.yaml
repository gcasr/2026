  room: Lake
  session: 2
  title: 'Drava: An Event-Driven Runtime for Energy-Efficient, Agent-Aided Scientific
    Workflows'
- abstract: 'Modern cybersecurity systems generate large volumes of network and log
    data, making reliable detection of malicious activity increasingly challenging.
    This project presents an anomaly detection system for cybersecurity traffic using
    both simulated security logs and the CICIDS2017 real-world dataset. The study
    evaluates rule-based detection, unsupervised anomaly detection models and a supervised
    benchmark to better understand how different approaches perform across controlled
    and real-world environments.


    The project first explored rule-based methods, Local Outlier Factor, One-Class
    Support Vector Machine and Isolation Forest. These methods highlighted the difficulty
    of detecting attacks without labeled training data, especially in noisy and imbalanced
    cybersecurity traffic. Isolation Forest achieved the strongest performance among
    the unsupervised models after feature selection, sampling and parameter tuning.
    To improve detection accuracy, a supervised Random Forest model was added using
    labeled normal and attack traffic. Random Forest achieved the best overall performance,
    with an F1 score of approximately 0.97.


    The final system includes an interactive Streamlit dashboard that displays model
    performance, precision, recall, F1 score, false positives, false negatives, ROC
    curve, feature importance and sample predictions. This work highlights the practical
    difference between unsupervised anomaly detection and supervised classification
    in cybersecurity settings. Future work will focus on enhanced feature engineering,
    additional hybrid models and improving the dashboard for real-time security monitoring
    and analysis.'
  authors: Maheen Syeda, Yi Yang
  board_number: L17
  institution: Northeastern Illinois University
