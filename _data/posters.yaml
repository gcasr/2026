- abstract: "This study analyzes bibliometric data to map the research footprint of\
    \ Loyola University Chicago. We started with a dataset provided by SciSciNet and\
    \ OpenAlex that documents the collaboration networks, topics, funding, and more\
    \ that goes into a successful research paper: 250 million papers by 100 million\
    \ authors representing over 100 thousand institutions across the world; 30+ tables,\
    \ hundreds of fields, and over 100GB. \nTo navigate this complex schema, we utilized\
    \ parquet push-down predicates to mine the data, target Loyola's ID, and filter\
    \ through nearly 1 billion paper-author affiliations to create a focused subset:\
    \ 42,015 papers with at least one author from Loyola University. We then mapped\
    \ Loyola's research network throughout US institutions and the world, analyzing\
    \ trends in impact and collaboration shifts.\nThese metrics tell the story of\
    \ a school with global reach, broad interests, and recognized expertise. Looking\
    \ ahead, we can expand this analysis beyond Loyola's historical output. Our robust\
    \ dataset provides the opportunity to build a complete picture of the scientific\
    \ ecosystem \u2014 the untapped collaboration networks, the way topic switches\
    \ are encouraged by historical events like COVID, and the downstream effects of\
    \ funding. Understanding this data is the gateway to future models that promote\
    \ smarter, more efficient academic growth and scientific development. "
