- abstract: Data lakes contain highly heterogeneous data with little to no schema,
    resulting in columns that are semantically joinable but syntactically incompatible
    (e.g., "Springfield, IL" vs. "Springfield"). Transformation discovery systems
    such as AutoJoin enumerate possible transformation sequences to identify one that
    enables equi-joins between such columns. However, exhaustive search is prohibitively
    expensive at data lake scale. In this work, we investigate the use of inexpensive
    column-level statistics (e.g., string-length distributions, delimiter frequencies,
    and token counts) to prune large portions of the transformation search space.
    To handle the diversity of transformation types that may be needed to achieve
    joinability, we study how to automatically derive statistics and pruning rules
    from the preconditions of transformation operators. As a proof of concept, we
    integrate our techniques into the AutoJoin transformation search algorithm. Our
    preliminary results on 10 real-world datasets show up to a 47x speedup over vanilla
    AutoJoin. Beyond Autojoin, these techniques can be integrated into other transformation
    discovery systems, such as FlashFill, making them more feasible at data lake scale.
