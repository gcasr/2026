  long_bio: "Lucian Mocan is a computer science researcher and software engineer pursuing\
    \ his M.S. in Networks, Internet and Systems Engineering at the University of\
    \ Strasbourg, where he also holds a B.S. (ranked 6th of 122), and is enrolled\
    \ in the highly selective five-year Cursus Master en Ing\xE9nierie track, run\
    \ by R\xE9seau Figure.<br/><br/>He is currently a visiting student researcher\
    \ at Northwestern University's Prescience Lab under Professor Peter Dinda, working\
    \ on systems research with a broader interest in how AI can accelerate and potentially\
    \ automate it. Previously, he contributed to Althread, an educational programming\
    \ language for model checking distributed systems, extending its Rust compiler,\
    \ designing a modular import system, and building a web IDE, as part of both an\
    \ independent research project and an internship at the University of Strasbourg\
    \ advised by Professor Quentin Bramas.<br/><br/>Beyond his academic research,\
    \ Lucian applies his technical expertise to build practical, real-world solutions.\
    \ During a summer internship at Emerson, he built a full-stack platform that eliminated\
    \ supply chain bottlenecks and saved over 800 hours annually. Applying this same\
    \ solutions-oriented approach to open science, he also led a small student team\
    \ to design a privacy-centric IoT platform for crowdsourcing health and environmental\
    \ data for scientific research.<br/><br/>Lucian is seeking internship, job, and\
    \ research collaboration opportunities starting September 2026. Find him at lucianmocan.com.<br/><br/>Michael\
    \ is a PhD candidate at Northwestern University advised by Peter Dinda. Broadly,\
    \ his research interests lie in security and privacy in computer systems and networks\
    \ with a focus on applying innovations in software and hardware to address recurring\
    \ and pervasive security issues. He also has emerging interests in the systemic\
    \ challenges to the security and privacy landscape that will result from agentic\
    \ AI.<br/><br/>His current work examines how both well-known and novel techniques\
    \ can be used to exploit scientific applications to manipulate results and compromise\
    \ infrastructure. It is part of the Buoyancy Project (https://buoyancy-project.org).<br/><br/>Michael\
    \ has a BS (summa cum laude) and MS in Computer Science from Northwestern.<br/><br/>His\
    \ website is https://michaelpolinski.com.<br/><br/>Friedrich is a second-year\
    \ PhD candidate and systems security researcher working on operating systems,\
    \ computer architecture, and the foundations of trusted computing.\_ He builds\
    \ prototypes that test whether theoretical security guarantees actually hold up\
    \ on commodity hardware, and he is especially drawn to the points where formal\
    \ models meet the messier realities of physical devices.<br/><br/>His recent projects\
    \ sit on opposite ends of the trust spectrum. On the keyless side, he has built\
    \ one of the first working implementations of an unconditional software root of\
    \ trust on a commodity ARM platform, using timing based challenges and an external\
    \ verifier to detect malware without relying on stored secrets, TPMs, or trusted\
    \ on-chip hardware. Furthermore, he has designed a kernel-bypass I/O architecture\
    \ that uses hardware capabilities to enforce fine-grained, register-level access\
    \ control on unmodified commodity devices, showing that strong isolation and high-performance\
    \ userspace drivers can coexist.<br/><br/>A recurring theme across his work is\
    \ shrinking the trusted computing base. He is interested in replacing cryptographic\
    \ stacks and proprietary silicon with smaller, auditable components grounded in\
    \ either hardware capabilities or measurable physical constraints, and in honestly\
    \ characterizing the assumptions that any such system has to satisfy in practice.\
    \ More at https://fdoku.me.<br/><br/>Peter Dinda is a professor in the Department\
    \ of Computer Science at Northwestern University, and also holds an appointment\
    \ in the Department of Electrical and Computer Engineering.   He headed the Computer\
    \ Engineering and Systems division for five years within the previous Department\
    \ of Electrical Engineering and Computer Science.   He holds a B.S. in electrical\
    \ and computer engineering from the University of Wisconsin and a Ph.D. in computer\
    \ science from Carnegie Mellon University. He works in experimental computer systems,\
    \ particularly parallel and distributed systems, and has authored over 140 scientific\
    \ papers, authored or is a major contributor to several large publicly available\
    \ codebases, and holds five patents. His research currently involves virtualization\
