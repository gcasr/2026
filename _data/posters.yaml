  title: 'FlowCompile: An Optimizing Compiler for Structured LLM Workflows'
- abstract: 'AI coding agents get feedback from many tools: linters, build systems,
    compilers, profilers, and more.

    However, there are no methods to systematically measure the quality of this feedback.

    We introduce an experimental methodology that evaluates feedback for AI coding
    agents on two axes: descriptiveness (explaining what is wrong) and prescriptiveness
    (how to fix it).

    We apply this methodology to a case study on triggering compiler auto-vectorization.

    We find that while Clang''s compiler feedback can help AI coding agents trigger
    auto-vectorization 3x more frequently, many remarks were not very descriptive.

    After we made Clang''s compiler feedback more descriptive by adding specific data
    dependence remarks, we observed a 43\% improvement in how frequently AI coding
    agents triggered auto-vectorization.

    This demonstrates that decomposing feedback into descriptiveness and prescriptiveness
    helps systems researchers improve their tools.'
  authors: Akash Deo, Simone Campanoni, Tommy McMichen
