  long_bio: "Idunnuoluwa A. Adeniji is a Ph.D. student in Computer Science at the\
    \ University of Illinois Chicago, where her research explores the intersection\
    \ of scientific visualization, human\u2013computer interaction, immersive technologies,\
    \ and high-performance computing. She earned her B.Sc. in Computational Science\
    \ and Engineering from Kean University. Her work focuses on developing visualization\
    \ systems and computational tools that enable intuitive exploration of large-scale\
    \ scientific data across web, XR, and GPU-accelerated environments. She has collaborated\
    \ with the Visualization Team at the Argonne Leadership Computing Facility (ALCF),\
    \ contributing to browser-based visualization systems, large-scale scientific\
    \ visualization using Unity, and immersive analysis of cosmological data using\
    \ XR technologies. Her recent work investigates client-side architectures for\
    \ scalable ingestion, processing, and rendering of cosmological particle data\
    \ within HPC workflows. Beyond her research, Idunnuoluwa is deeply engaged in\
    \ the intersection of art and technology. She uses game engines such as Unity\
    \ for large-scale visualization and immersive storytelling, and is particularly\
    \ interested in experiences that operate at the boundary of computation and spectacle.\
    \ Other creative interests include concert set design and the translation of audio\
    \ signals into dynamic lighting and projection systems, alongside a broader curiosity\
    \ about how real-time rendering and immersive technologies can transform audience\
    \ engagement in both live and digital environments. This creative practice informs\
    \ her commitment to scientific visualization \u2014 reflecting a conviction that\
    \ the tools we build for science should be as compelling as they are functional."
