- abstract: "Multi-GPU systems are the building blocks of modern AI and HPC clusters.\
    \ The variery of vendors and hardware complexity creates a challenge in conceiving\
    \ composable, performant and portable applications [1]. Macro-dataflow systems\
    \ are a solution to meet this challenge, delegating the responsibility from programs\
    \ to architecture-aware compilers and runtime systems. Workloads are split into\
    \ tasks and distributed on available processors, implicitly overlapping computation\
    \ and data transfers following a data-flow [2].\n\nThis poster presents XK.BLAS:\
    \ the BLAS module of the Julia package XK.jl [3]. It provides BLAS APIs for multi-device\
    \ architectures natively in Julia, portably across all three major GPU vendors\
    \ (AMD, Intel, NVIDIA). XK.BLAS is built on top of the XKRT tasking runtime systems\
    \ and the XKBlas library \u2014 that implements a macro-dataflow programming model\
    \ [4]. We evaluate XK.BLAS primitives and its use as a multi-GPU backend for the\
    \ package Krylov.jl [5] showing up to 2.8\xD7 speedup when scaling from 1 to 4\
    \ H100 GPUs. More importantly, XK.BLAS solves Krylov.jl problems that would not\
    \ otherwise fit on a single GPU with no code changes at all."
