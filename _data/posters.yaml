  title: 'Pre-RoPE versus Post-RoPE: Per-Step Compute for a Reduced KV-Cache Memory
    Footprint'
- abstract: "Storage-disaggregated databases decouple compute from storage, improving\
    \ elasticity but suffering from network bottlenecks. Most cloud databases primarily\
    \ use page-based B+trees and buffer pools. Under disaggregation, each index traversal\
    \ incurs serial network round-trips. Page-granularity transfers and caching also\
    \ amplify network traffic and lower cache efficiency. Pushing down the full index\
    \ to storage and caching only hot records at compute is appealing as a solution,\
    \ but an efficient design must (1) provide a holistic record cache that accelerates\
    \ both point and range queries, (2) mitigate the negative search penalty of confirming\
    \ non-existence via remote probes, and (3) enforce storage-agnostic phantom protection\
    \ despite the index being encapsulated by the storage service.\n\nWe introduce\
    \ Nemo, a holistic index-and-buffer design optimized for storage-disaggregated\
    \ OLTP with index pushdown. Nemo employs a tree-structured record buffer that\
    \ unifies caching and buffering and accelerates both point and range queries.\
    \ It further reduces negative search penalty by caching negative search results.\
    \ Nemo provides storage-agnostic phantom protection that is robust against large\
    \ key domains, varying data skew, and partition schemes. Experiments show that\
    \ Nemo outperforms page-based B+Tree and the state-of-the-art 2-Tree by up to\
    \ 11.42\xD7 and 2.97\xD7 on positive point queries, and achieves up to 4.76\xD7\
    \ speedup on negative searches over a hash-indexed record cache. For phantom protection,\
    \ Nemo outperforms PCL by up to 1.55\xD7 even under a dense key domain. Moreover,\
    \ Nemo maintains stable performance while PCL degrades sharply as the key domain\
    \ grows large and sparse."
