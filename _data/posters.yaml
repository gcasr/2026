  title: 'ChronoLog: Distributed Shared Tiered Log Store'
- abstract: "Speech Large Language Models (SpeechLLMs) unify speech perception and\
    \ language reasoning in a single framework and are rapidly being deployed in assistants,\
    \ accessibility tools, and multimodal agents. While safety of text\u2011only LLMs\
    \ has been extensively studied, the safety of SpeechLLMs is less understood, especially\
    \ under audio\u2011conditioned jailbreak and adversarial attacks. This work investigates\
    \ whether current SpeechLLM safety is sufficient under a suite of strong attacks\
    \ and defenses.\n\nBuilding on recent safety benchmarks for audio\u2011language\
    \ models, we use the AABench dataset of red\u2011team and harmful prompts as audio\
    \ queries and quantify robustness with Attack Success Rate (ASR) and StrongReject\u2011\
    based refusal metrics. We consider several prompt\u2011level and audio\u2011level\
    \ attacks: JBC, PAIR, PGD, AutoDan, BOOST+GPTFuzzer, TAP and Autoattack. Our experimental\
    \ pipeline targets a diverse set of open and closed SpeechLLMs, evaluates models\
    \ with and without an external StrongReject safety layer, and measures safety\u2013\
    utility trade\u2011offs."
