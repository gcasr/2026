- abstract: "Maximizing performance on available GPU hardware is an ongoing challenge\
    \ for modern AI inference systems. Traditional approaches include writing custom\
    \ GPU kernels and using specialized model compilers to tune high-level code for\
    \ specific GPU targets. Recent work shows that LLM-based multi-agent systems can\
    \ effectively perform such tuning, often outperforming existing compilers and\
    \ eliminating the need for manual kernel development. However, the dynamics of\
    \ multi-agent systems for this task remain unexplored. In this work, we present\
    \ a logical framework for comparing multi-agent PyTorch optimization systems.\
    \ Our evaluation shows that exploit-heavy strategies perform best when paired\
    \ with error-fixing agents, and that performance correlates with the granularity\
    \ of optimization steps. The best implementation achieves an average 2.88\xD7\
    \ speedup over PyTorch Eager (1.85\xD7 over torch.compile) on an H100 GPU across\
    \ diverse tasks in KernelBench, a benchmark suite covering a range of machine\
    \ learning architectures in PyTorch. Code is publicly available at: https://github.com/pike-project/pike"
  authors: Kirill Nagaitsev, Luka Grbcic, Samuel Williams, Costin Iancu
  board_number: N17
  institution: Northwestern University, Lawrence Berkeley National Laboratory
  long_bio: 'Kirill Nagaitsev: I am a computer science Ph.D. candidate and DOE CSGF
    fellow at Northwestern University, advised by Peter Dinda as part of the Prescience
    Lab. My research applies LLM-based systems to compiler and performance-engineering
    problems. Recently, I have focused on understanding and improving agent-based
    approaches to performance engineering tasks such as PyTorch inference optimization.
    I emphasize rigorous evaluation of agent-based systems through representative
    benchmarks, failure-mode analysis, and correctness verification. This work is
    leading me toward exploring machine learning model optimization across various
    abstraction levels and programming models. I am also interested in hybrid approaches
    that combine LLM-based optimization with reinforcement learning and autotuning.<br/><br/>Luka
    Grbcic: I am a postdoctoral researcher at the Lawrence Berkeley National Laboratory
    in the Applied Math and Computational Research Division. I am a part of the Applied
    Computing for Scientific Discovery group, where my research is focused on developing
    computational tools and methods that accelerate scientific discovery. More specifically,
    my research work encompasses topics such as hybrid machine learning and optimization
    methods, batch active learning for autonomous experimentation, tandem neural networks,
    and surrogate black-box optimization. Currently also interested in developing
    LLM agents and evolutionary inspired frameworks for algorithm improvement. All
    of my research motivation and ideas are driven by real-world problems in science
    and engineering.<br/><br/>Samuel Williams: Dr. Williams is a Senior Scientist
    at the forefront of high-performance computing (HPC) and machine learning (ML).  His
    research is focused on the development of performance modeling and analytical
    capabilities for novel and emerging accelerated HPC and ML architectures and the
    co-design of algorithms and architectures that balance mathematical and ML performance
    with computational efficiency and distributed memory scalability. Among his many
    accomplishments, he is best known for the creation of the Roofline Model which
    enables developers, computer scientists, computer architects, and applied mathematicians
    to quickly and visually assess performance bottlenecks on multicore, manycore,
    and GPU-accelerated systems.<br/><br/>Costin Iancu: Over the years I''ve been
    involved in multiple disciplines. I tend to favor simple and practical designs.
    I am still performing research in the areas of programming models and code optimization
    for large scale parallel systems. The emphasis here is in composing calls to parallel
    libraries either at the runtime or at language level. My recent interest is in
    quantum circuit compilation, where I have started the Berkeley Quantum Synthesis
    Toolkit (BQSkit) effort. The BQSKit code has shown how synthesis can be deployed
    for large scale circuit compilation with very good results, often surpassing "commercial"
    compilers. We have shown how to use synthesis for circuit optimization, algorithm
    discovery and hardware-algorithm codesign.<br/>'
