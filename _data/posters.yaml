    \ property tests. He studies techniques that connect properties to the code they\
    \ can reach, identify uncovered execution paths, and provide feedback for improving\
    \ generators, constraints, and test design. His work also explores how large language\
    \ models can assist developers in reasoning about reachability and understanding\
    \ why certain code paths are or are not exercised by a property. Jesse\u2019s\
    \ research is informed by more than three decades of professional experience in\
    \ software systems, IT infrastructure, and technology consulting, as well as prior\
    \ experience as an adjunct faculty member. These experiences shape his interest\
    \ in building testing tools that are technically rigorous, understandable, and\
