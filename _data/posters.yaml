  title: 'Icicle: Scalable Metadata Indexing and Real-Time Monitoring for HPC File
    Systems'
- abstract: "Modern High-Performance Computing (HPC) sys-\ntems are increasingly bottlenecked\
    \ by static, heuristic-based\nschedulers that cannot adapt to heterogeneous and\
    \ dynamic\nworkloads. While Deep Reinforcement Learning (DRL) offers\nadaptability\
    \ in principle, its high training cost and retraining\noverhead limit practical\
    \ deployment. We present SchedTwin, a\nframework that formulates adaptive scheduling\
    \ as a contextual\nmulti-armed bandit (CMAB) problem, enabling continuous on-\n\
    line learning of policy selection strategies without retraining.\nSchedTwin\u2019\
    s key innovation is a dual-context representation of\nreal-time system state and\
    \ simulator-projected policy outcomes,\novercoming the delayed feedback inherent\
    \ to job scheduling\nand enabling the CMAB agent to select policies based on both\n\
    current conditions and anticipated future impact. Evaluation on\nproduction traces\
    \ from ALCF systems ranging from 560 to 10,624\nnodes shows that SchedTwin consistently\
    \ outperforms traditional\nheuristics and DRL-based baselines, reducing job wait\
    \ time by\nup to 86.6% and job slowdown by up to 92.6%. Live deployment\non a\
    \ PBS-managed cluster confirms that SchedTwin incurs only\nseconds of overhead\
    \ per scheduling decision, demonstrating its\npracticality for production HPC\
    \ environments."
