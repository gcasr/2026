  title: 'The Science of Science: Loyola University''s Research Network'
- abstract: 'Modern data-driven systems operate in dynamic environments where distributional
    drift can silently degrade performance, reliability, and interpretability. This
    work presents a modular supervision architecture for real-time drift detection
    across heterogeneous research systems. The framework combines embedding-based
    similarity, lightweight statistical signals, and k-nearest neighbor classification
    to identify deviations from expected behavior in a transparent and domain-agnostic
    manner.


    To support non-stationary data, the system incorporates both fixed and adaptive
    reference baselines, enabling it to distinguish meaningful divergence from routine
    variation. The architecture is designed for extensibility and low overhead, making
    it suitable for integration into machine learning pipelines, experimental instrumentation,
    and broader scientific workflows.


    By prioritizing interpretability, configurability, and generality, this work offers
    a practical foundation for monitoring and maintaining reliability in modern research
    infrastructure.'
