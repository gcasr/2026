  title: Towards Automation and Reproducibility for Research Data Meshes
- abstract: "Next-generation detectors in high-energy physics (HEP) and X-ray science\
    \ (XRS) are driving continuous, multi-stage streaming pipelines with facility-scale\
    \ data rates approaching petabytes per second. These pipelines require real-time\
    \ reconstruction under strict energy constraints, integrating data ingestion,\
    \ preprocessing, AI inference, and feedback-driven control, with intermediate\
    \ results steering detector configuration and analysis decisions. Such closed-loop\
    \ workflows have usually relied on custom, one-of-a-kind hardware components,\
    \ with limited ability to adapt to new sensor or compute technologies after deployment.\
    \ We argue that a well-designed software infrastructure can efficiently orchestrate\
    \ these workflows, avoiding manual tuning and allowing general-purpose computing\
    \ hardware integration.\n\nWe present Drava, an event-driven runtime system for\
    \ scientific pipelines based on a lightweight event-driven model.\nDevelopers\
    \ express application stages as reusable components, while Drava manages event\
    \ scheduling, batching, data movement, and transport-aware execution across heterogeneous\
    \ resources. This design separates scientific logic from system concerns and enables\
    \ control over execution granularity, data locality, and resource utilization.\n\
    \nOur contributions are threefold. First, we introduce a runtime abstraction for\
    \ composing multi-stage scientific workflows as end-to-end streaming pipelines.\
    \ Second, Drava provides stage-level and pipeline-level instrumentation to quantify\
    \ how batching, concurrency, transport, and resource placement affect throughput,\
    \ latency, and energy efficiency. Third, we enable agentic workflows for runtime\
    \ optimization: one agent performs guided exploration to identify top-performing\
    \ configurations, while another learns a surrogate model from sampled executions\
    \ to predict promising configurations. \n\nWe demonstrate Drava using multi-stage\
    \ ptychography and tomography applications, showing sustained high-throughput\
    \ execution and ability to adapt to increasing data rates and bandwidth demands\
    \ of next-generation detectors."
