  title: "\u201CDCGen 1.1: Generating Datacenter Configs (IT, Power, Cooling)"
- abstract: "Applications are chained to their storage\u2014moving from POSIX files\
    \ to HDF5, ADIOS2, or cloud formats requires rewriting code. I/O Router breaks\
    \ that chain.\nOur framework intercepts file operations at three levels (LD_PRELOAD,\
    \ FUSE, eBPF) and routes them to diverse backends without application modification.\
    \ Our insight: separate data from metadata. System calls like fstat() and access()\
    \ pass through to the real filesystem (keeping HPC benchmarks happy), while read()\
    \ and write() redirect to structured storage via configurable path rules (/data/**/*.h5).\n\
    A hybrid architecture makes this practical: eBPF tracks process lifecycles via\
    \ ring buffers, a userspace controller maintains interception sets, and LD_PRELOAD\
    \ performs O(1) file-descriptor routing at open() time. This avoids race conditions\
    \ and preserves compatibility with IOR, HDF5, and MPI-IO.\nBuilt in Rust with\
    \ lock-free concurrency, I/O Router achieves <50% overhead for data-path operations\
    \ while enabling zero-code-modification adoption of next-generation storage."
  authors: Neeraj Rajesh, Xian-He Sun, Anthony Kougkas
  board_number: R5
  institution: Illinois Tech
  long_bio: Neeraj Rajesh is a PhD Candidate in Computer Science at Illinois Institute
    of Technology, where his research bridges artificial intelligence and high-performance
    computing systems. With a background spanning machine learning, natural language
    processing, and neural networks, he now applies these techniques to optimize parallel
    and distributed systems. His current work focuses on I/O interception and routing
    frameworks, storage system architecture, and building safe, high-performance infrastructure
    using Rust. Neeraj is deeply committed to free and open-source software principles,
    with interests in federated communication protocols (XMPP, Matrix), low-power
    ARM and RISCV single-board computers, and reclaiming personal data ownership through
    self-hosted solutions. Outside of research, he enjoys exploring food, language,
    history, and culture, and enjoys bouldering in his off-time, and describes himself
    as a "tech+comicbook geek" and part-time metalhead.<br/><br/>Anthony Kougkas is
    an Associate Research Professor in Computer Science at Illinois Institute of Technology,
    where he serves as Deputy Director of the Gnosis Research Center and a Guest Research
    Scientist at Argonne National Laboratory. His research focuses on high-performance
    computing storage and I/O, multi-tiered storage architectures, hierarchical data
    buffering and prefetching, and data management for AI/ML workflows. He has led
    development of several major systems including Hermes (heterogeneous-aware multi-tiered
    distributed I/O buffering), LABIOS (label-based distributed I/O system), DLIO
    (data-centric benchmark for scientific deep learning), and ChronoLog (distributed
    log storage). He has secured over $12 million in federal research funding and
    published 50+ peer-reviewed papers. He has received Best Paper Awards at HPDC'19
    (for LABIOS) and CCGrid'21 (for DLIO), and holds a patent on "Label-Based Data
    Representation I/O Process and System." His research bridges I/O characterization
    and practical middleware solutions for large-scale scientific computing. He currently
    co-advises ten doctoral students and actively contributes to the HPC community
    through conference organization and journal editorial boards. His current projects
    include IOWarp, IRIS, Coeus, DTIO, and DeepIO, advancing data management for exascale
    systems and AI workflows.<br/><br/>Dr. Xian-He Sun is a University Distinguished
    Professor and holds the Ron Hochsprung Endowed Chair of Computer Science at the
    Illinois Institute of Technology (Illinois Tech), where he directs both the Gnosis
    Research Center for accelerating data-driven discovery. He previously served as
    Department Chair of Computer Science from 2009 to 2014. An IEEE Fellow recognized
    for his contributions to memory-bounded performance metrics and scalable parallel
    computing, Dr. Sun has published over 300 research articles and holds six U.S.
    patents. His seminal contributions include the memory-bounded speedup model (Sun-Ni's
    Law, 1990), the Concurrent Average Memory Access Time (C-AMAT, 2013), and the
    Layered Performance Matching (LPM) method for addressing the memory-wall problem.
    He has led the development of influential software systems including Hermes (heterogeneous-aware
    multi-tiered distributed I/O buffering), ChronoLog (high-performance storage for
    log workloads), and PortHadoop. His research has been supported by over $30 million
    in federal funding from the NSF and other agencies. Dr. Sun has received numerous
    accolades including the ACM Karsten Schwan Best Paper Award (2019), IEEE CS Golden
    Core Award (2017), and the CSE Distinguished Alumni Award from Michigan State
    University (2022). He currently serves as Editor-in-Chief of IEEE Transactions
    on Parallel and Distributed Systems (TPDS).
