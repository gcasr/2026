    \ and Protocol Buffers, cryptographic primitives (Ed25519, BLAKE3), and performance\
    \ profiling of distributed systems. Harsha's research interests broadly encompass\
    \ the design and optimization of high-throughput consensus protocols, distributed\
    \ ledger technologies, post-quantum cryptography considerations, and the practical\
    \ implementation of blockchain systems aligned with real-world design patterns.\
    \ He is committed to producing rigorous academic contributions while building\
    \ production-quality systems that bridge theoretical blockchain innovations with\
    \ engineering reality.<br/>Dr. Ioan Raicu: Dr. Ioan Raicu is an Associate Professor\
    \ in the Department of Computer Science at Illinois Institute of Technology and\
