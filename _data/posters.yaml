  long_bio: "Shazzadul Islam is a Ph.D. candidate in Computer Science at the Illinois\
    \ Institute of Technology, where he works as a Research Assistant at the Gnosis\
    \ Research Center under the guidance of Dr. Xian-He Sun. He holds an M.S. in Computer\
    \ Science from Illinois Tech and brings prior industry experience as an AI Engineer\
    \ building machine learning systems for industrial applications. His current research\
    \ investigates how agentic systems, large language models, and computer vision\
    \ can be combined to accelerate scientific computing workflows on high-performance\
    \ computing platforms. He is an active contributor to the IOWarp project, which\
    \ bridges HPC, AI, and advanced data management to enable AI-driven scientific\
    \ discovery, and to the design and evaluation of MCP-based agent frameworks for\
    \ HPC environments. He recently presented at the International Parallel Data Systems\
    \ Workshop (PDSW'25, co-located with SC25) and is the lead author of \"Towards\
    \ an AI-Driven Scientific Workflow,\" published at the 21st IEEE International\
    \ Conference on eScience (eScience'25). He is multilingual (Bengali, English,\
    \ Hindi) and engages actively with the academic conference community as a student\
    \ volunteer and reviewer.<br/><br/>Dr. Jaime Cernuda is a Research Assistant Professor\
    \ in the Department of Computer Science at the Illinois Institute of Technology\
    \ and a member of the Gnosis Research Center, where he works under the mentorship\
    \ of Dr. Xian-He Sun. He completed his Ph.D. at Illinois Tech. His research focuses\
    \ on distributed systems, high-performance computing, and streaming applications,\
    \ with particular emphasis on hierarchical and elastic data movement frameworks\
    \ for HPC and AI workloads. He is the principal architect of HStream, a hierarchical\
    \ data streaming engine for high-throughput scientific applications published\
    \ at ICPP'24, and lead author of HFlow (CLUSTER'21), Hades (CCGRID'24), and Jarvis\
    \ (PDSW'24). He has also contributed to influential systems including LabStor\
    \ (SC'22), DTIO (SSDBM'25), and Apollo (HPDC'21). His work informs ongoing studies\
    \ of data streaming for next-generation experimental\u2013HPC pipelines at U.S.\
    \ Department of Energy facilities, and he is an active collaborator on the IOWarp\
    \ project and the broader I/O and data-management ecosystem at the Gnosis Research\
    \ Center.<br/><br/>Dr. Xian-He Sun is a University Distinguished Professor, the\
    \ Ron Hochsprung Endowed Chair of Computer Science, and the Director of the Gnosis\
    \ Research Center and the Scalable Computing Software (SCS) Laboratory at the\
    \ Illinois Institute of Technology, where he served as Chair of the Department\
    \ of Computer Science from 2009 to 2014. He received his Ph.D. and M.S. in Computer\
    \ Science and an M.S. in Mathematics from Michigan State University, and his B.S.\
    \ in Mathematics from Beijing Normal University. Before joining Illinois Tech\
    \ in 1999, he was a postdoctoral researcher at Ames National Laboratory, a staff\
    \ scientist at ICASE/NASA Langley Research Center, an ASEE Fellow at the U.S.\
    \ Navy Research Laboratories, and a faculty member at Louisiana State University.\
    \ He is an IEEE Fellow, an IEEE CS Golden Core member, and a senior member of\
    \ ACM. His research spans parallel and distributed processing, memory and I/O\
    \ systems, software systems for big data, and performance evaluation and optimization.\
    \ He is best known for the memory-bounded speedup model (Sun-Ni's law), the Concurrent\
    \ Average Memory Access Time (C-AMAT) model, and the Layered Performance Matching\
    \ method. He has authored more than 300 publications, holds six U.S. patents,\
    \ and has received numerous awards including the ACM Karsten Schwan Best Paper\
    \ Award at HPDC'19 and the CSE Distinguished Alumni Award from Michigan State\
    \ University in 2022. He currently serves as Editor-in-Chief of IEEE Transactions\
    \ on Parallel and Distributed Systems.<br/><br/>Dr. Anthony Kougkas is an Associate\
    \ Research Professor in the Department of Computer Science at the Illinois Institute\
    \ of Technology, where he serves as the Deputy Director of the Gnosis Research\
    \ Center, and a Guest Research Scientist at Argonne National Laboratory. He received\
    \ his Ph.D. in Computer Science from Illinois Tech in 2019, and previously earned\
    \ an M.Sc. in Computer Science from the University of Piraeus and a B.Sc. from\
    \ the Hellenic Army Academy. His research focuses on data management, parallel\
    \ and distributed I/O, multi-tiered storage architectures, and integrated platforms\
    \ for the convergence of high-performance computing, cloud, and AI/ML workloads.\
    \ He has led the development of widely used systems including Hermes, LABIOS,\
    \ ChronoLog, IOWarp, IRIS, Coeus, DTIO, and DeepIO. He has authored more than\
    \ 50 peer-reviewed publications, holds a U.S. patent on label-based data representation\
    \ I/O (\"US 2021/0374152 A1\"), and has secured over $12M in federal research\
    \ funding. He is a recipient of the ACM Karsten Schwan Best Paper Award at HPDC'19\
    \ for LABIOS and a Best Paper Award at CCGrid'21 for DLIO. He co-advises ten doctoral\
    \ students and has contributed open-source software such as DLIO, which is now\
    \ part of the MLPerf storage benchmark suite."
