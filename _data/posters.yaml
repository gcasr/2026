    (ASPLOS''20, HPCA''21, HPCA''22, ISCA''24), Quantum Computing(QCE''23), Compiler
    Optimization(CGO''21), Super Computing(ICS''20), and Workload Characterization(IISWC''20).<br/>Currently,
    he is working on noise-aware compilers for NISQ computers. He is also interested
    in quantum algorithms including quantum machine learning and quantum combinatorial
    algorithms such as VQE and the Quantum Approximate Optimization Algorithm.<br/><br/><br/>Quinn
    Langfitt is a second-year PhD student in Computer Science at Northwestern University,
    where he is advised by Prof. Kaitlin N. Smith. His research focuses on quantum
    computing, with an emphasis on quantum error mitigation and characterization,
    and classical machine learning for quantum systems. He works within the SQMS collaboration
    at Fermilab and Argonne National Laboratory, and has conducted quantum algorithms
    research at Los Alamos National Laboratory. His work has appeared in venues including
    Quantum Machine Intelligence and IEEE QCE, and he received a Best Paper Award
    at IEEE QCNC 2025.<br/><br/><br/>Mingyoung Jessica Jeng is a third-year PhD student
    in Computer Science at Northwestern University, where she is advised by Prof.
    Nikos Hardavellas. Her research interests include modular quantum architectures,
    quantum data representations, and hybrid quantum-classical algorithms. Her work
    has appeared in venues including IEEE QCE, SC, The Journal of Supercomputing,
    and IEEE Transactions on Computers, and she has co-authored a book chapter on
    practical applications of quantum computing.<br/><br/><br/>Alvin Gonzales received
    his Ph.D. in 2021 from Southern Illinois University Carbondale and joined Argonne
    under the Intelligence Community Postdoctoral Research Fellowship Program in October
    2023.<br/>His expertise is in quantum error correction and error mitigation, quantum
    dynamical maps, and distributed quantum computing. He is a co-founder of the technology
    startup Quantum Quadrivium Technologies LLP.<br/><br/><br/>Noble Agyeman-Bobie
    is an undergraduate student at Grambling State University, where he is pursuing
    degrees in Computer Science, Mathematics, and Physics. He was an Open Quantum
    Initiative (OQI) Fellow through the Chicago Quantum Exchange, during which he
    conducted quantum computing research at Northwestern University, and was selected
    as a Prospective PhD Preview Scholar at Princeton University. His research interests
    include quantum error mitigation for NISQ systems and higher-dimensional quantum
    computing. He has contributed to research on quantum optics, analyzing soliton
    solutions of nonlinear wave models, and has worked on generalizing error mitigation
    strategies to higher-dimensional Hilbert spaces.<br/><br/><br/>Kaiya Jones graduated
    summa cum laude with a BS in Computer Science and a minor in Mathematics from
    Tuskegee University in December 2025. She was an Open Quantum Initiative (OQI)
    Fellow through the Chicago Quantum Exchange, during which she conducted quantum
    computing research at Northwestern University. She is also a research scholar
    with the IBM HBCU Quantum Center, where her work has focused on quantum computing
    applications in cybersecurity, including quantum autoencoders for network intrusion
    detection. She is currently a Data Analyst in Vanguard''s Technology Leadership
    Program.<br/><br/><br/>Siddharth Vijaymurugan is a second-year undergraduate student
    at Duke University, where he is pursuing degrees in Physics and Mathematics. He
    was a SULI research intern at Argonne National Laboratory, where he evaluated
    quantum error detection techniques with Qiskit under biased noise models, contributing
    to the development of the QuantEM compiler. He is currently a research assistant
    at the Duke Quantum Center, where his work includes studying entanglement in Gaussian
    systems and simulating Bose-Einstein condensates.<br/><br/><br/>Daniel Dilley
    is a Postdoctoral Researcher at Argonne National Laboratory. He received his PhD
    in Applied Physics from Southern Illinois University Carbondale, where he researched
