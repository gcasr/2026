    \ and RestAPI, and he recently helped his team win second place at the SparkHacks\
    \ hackathon by engineering a full-stack web app. After graduation, he looks forward\
    \ to pursuing data-driven roles.<br/><br/>Elizabeth Cardoso is a Computer Science\
    \ student at the University of Illinois Chicago, they currently serve as a Research\
    \ Assistant at the Electronic Visualization Laboratory (EVL). Their research focuses\
    \ on the intersection of Edge AI, system architecture, and real-time spatial analytics.\
