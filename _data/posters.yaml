  title: A Structured Benchmarking Dataset for TLA+ Specification Reasoning
- abstract: The rapid growth of high-frequency time-series data across domains such
    as computational finance and scientific simulation has introduced significant
    challenges in storage, querying, and large-scale analysis. Workloads such as parameter
    sweeps in backtesting pipelines often require executing billions of simulations
    over decades of fine-grained data, placing extreme pressure on storage systems
    in terms of throughput, scalability, and resource utilization. Traditional storage
    solutions such as MongoDB, InfluxDB, CSV (via Pandas), and Parquet experience
    difficulty with balancing performance and efficiency under highly concurrent workloads
    and diverse access patterns.
  authors: Lan Nguyen, Ioan Raicu
  board_number: L12
  institution: Illinois Institute of Technology
