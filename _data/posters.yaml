  title: 'Contour: Elevating Scientific Applications to Scalable Workflows'
- abstract: 'Large Language Models (LLMs) have become a critical part of broad workflows.
    Increasingly, users use many LLMs in their work, ranging from small to large models,
    fine-tuned on different corpora, and optimized for different use cases. As such,
    institutions face the challenge of serving many LLMs concurrently to their users.
    Existing solutions, like vLLM, focus on high-performance multi-GPU model serving
    for a single model. Deploying many such instances can be inefficient at scale.
    We explore serving multiple machine learning models with varied GPU requirements
    in a resource-constrained environment with a limited number of GPUs. We introduce
    MPI-LLM, a serving system designed to support efficient, scalable, multi-node
    inference of LLMs. Our work extends vLLM, the leading model serving system, with
    a novel Message Passing Interface backend, providing faster startup and resource
    allocation optimized for HPC systems. MPI-LLM offers three primary contributions:
    (i) an MPI-based backend that accelerates initialization and ensures compatibility
    with HPC infrastructure, (ii) support for hosting multiple models simultaneously,
    and (iii) rapid model switching capabilities.'
  authors: Shu Shi, Wenyi Wang, Yadu Nand Babuji, Kyle Chard, Ian Foster
  board_number: L8
  institution: University of Chicago
  long_bio: Shu Shi is a first-year Ph.D. student in Computer Science at the University
    of Chicago. He works with Prof. Ian Foster and Prof. Kyle Chard in Globus Labs.
    His research focuses on machine learning systems, with a particular emphasis on
    scalable serving systems for large language models on high-performance computing
    platforms. He is broadly interested in designing efficient and reliable systems
    for emerging AI workloads, especially in improving the scalability and resource
    efficiency of LLM inference. His work draws on ideas from distributed systems,
    high-performance computing, and machine learning infrastructure.Before joining
    the University of Chicago, he received his B.S. in Computer Science from the University
    of Science and Technology of China, advised by Prof. Yongkun Li.<br/><br/>Wenyi
    Wang is a Ph.D. student in the Department of Computer Science at the University
    of Chicago and a member of Globus Labs, advised by Prof. Ian Foster and Prof.
    Kyle Chard. His research lies at the intersection of computer systems and machine
    learning, focusing on building fast, scalable, and efficient systems by exploiting
    fine-grained parallelism. He is currently working on large-scale LLM inference
    on many-node HPC systems, as well as fine-grained parallelism techniques in OpenMP
    tasking models. Previously, he was advised by Dr. Camilo Rojas and Prof. Pattie
    Maes at the MIT Media Lab, and by Prof. Peter Dinda at Northwestern University.<br/><br/>Yadu
    N. Babuji is a Senior Software Engineer at the University of Chicago. He conducts
    systems research at Globus Labs, focusing on helping scientists scale their computations
    on massive distributed systems. He is the primary developer and technical lead
    of Parsl, a parallel scripting library designed to support scalable scientific
    computing workflows. More recently, his work has included funcX, a function-serving
    platform for science that enables distributed function execution across computing
    resources. His broader interests include distributed systems, high-performance
    computing, and infrastructure for scientific applications. He has also served
    as General Chair for the Workshop on High Performance Serverless Computing, held
    in conjunction with HPDC 2021.<br/><br/>Kyle Chard is a Research Associate Professor
    in the Department of Computer Science at the University of Chicago. He also holds
    a joint appointment at Argonne National Laboratory. He received his Ph.D. in Computer
    Science from Victoria University of Wellington, New Zealand in 2011. He is a member
    of the ACM and IEEE, received the IEEE TCHPC Award for Excellence for Early Career
    Researchers in HPC, was part of the Globus team that won an R&D100 award, and
    received the New Zealand Top Achiever Doctoral Scholarship. He co-leads the Globus
    Labs research group, which focuses on a broad range of research problems in data-intensive
    computing and research data management. He leads NSF-funded projects related to
    distributed and parallel computing, scientific reproducibility, research automation,
    and cost-aware use of cloud infrastructure.<br/><br/>Ian Foster is Senior Scientist
    and Distinguished Fellow, and director of the Data Science and Learning Division,
    at Argonne National Laboratory, and the Arthur Holly Compton Distinguished Service
    Professor of Computer Science at the University of Chicago. He has a BSc from
    the University of Canterbury, New Zealand, and a PhD from Imperial College, United
