  title: A Lightweight AI-Driven Framework for Rapid Intrusion Detection in IoT
- abstract: 'We propose TIDES, a reasoning-attacking method that exposes a previously
    unrecognized failure of test-time scaling: as reasoning traces lengthen, model
    performance degrades sharply rather than improves. Unlike prior attacks on large
    reasoning models (LRMs), TIDES exploits the intrinsic properties of test-time
    scaling laws to manipulate reasoning trace length, producing degradations that
    are inherently difficult to detect. Methodologically, we define Depth-Guided Latent
    Tracker (DLT), a depth-based tracker that injects microscopic steering vectors
    into intermediate reasoning traces stealthily and combines them with on-policy
    distillation to precisely position LRMs under test-time scaling. Theoretically,
    we model latent space as a depth-indexed dynamic process and prove that under
    test-time scaling, small bounded perturbations introduced at intermediate layers
    induce non-vanishing trajectory drift, explaining why DLT remains effective yet
    difficult to detect in large reasoning models. Empirically, we evaluate TIDES
    on multiple reasoning benchmarks using two strong reasoning models, DeepSeek-R1-Distill-Qwen-7B,
    and DeepSeek-R1-Distill-Llama-8B, where it consistently outperforms state-of-the-art
    reasoning attack methods such as DecepChain and BadChain. Notably, TIDES delivers
    an average 30.3% improvement in attack performance over the baselines, demonstrating
    that TIDES remains efficient within large reasoning model generation.'
  authors: Haoran Dai , Haozheng Luo, Haotian Zhang, Meng lin, Yan Chen, Binghui Wang
  board_number: R9
  institution: NU, IIT
  long_bio: "Haozheng Luo is a fourth-year Ph.D. candidate in the Computer Science\
    \ Department at Northwestern University, advised by Professor Yan Chen in the\
    \ LIST Lab. Prior to joining the LIST Lab, he was advised by Professor Han Liu.\
    \ His research is generously supported by the Adobe Fellowship and the DAAD AINeT\
    \ Fellowship. Haozheng's primary research focuses on the learning and safety aspects\
    \ of Artificial Intelligence. He aims to enable efficient systems\u2014such as\
    \ quantization robustness, efficient reasoning, and parameter-efficient fine-tuning\u2014\
    and ensure the safety of Large Language Models, Large Reasoning Models, and multi-modal\
    \ environments. His impactful work has been widely published and recognized at\
    \ top-tier academic venues including ICML, ICLR, NeurIPS, and USENIX Security.\
    \ In addition to his academic research, Haozheng is the founder of GLB\xB2, an\
    \ open-source community that bridges researchers across computer science, engineering,\
    \ biology, cognitive science, and other fields. Through GLB\xB2, he champions\
    \ the initiative to extend large foundation models beyond traditional boundaries,\
    \ deploying them to support real-world, downstream applications in everyday settings.<br/><br/>Haoran\
    \ Dai is a Ph.D. student in the Department of Computer Science at the Illinois\
    \ Institute of Technology, where he is advised by Professor Binghui Wang. His\
    \ primary research lies in the domain of Trustworthy Artificial Intelligence,\
    \ with a strong emphasis on understanding and evaluating the safety, security,\
    \ and vulnerabilities of foundation models. Specifically, Haoran's work rigorously\
    \ investigates the inherent risks of large reasoning models and multimodal diffusion\
    \ architectures, aiming to expose and mitigate adversarial threats such as test-time\
    \ inference drift and backdoor modality collapse. By addressing both the theoretical\
    \ foundations and empirical evaluations of model vulnerabilities\u2014such as\
    \ test-time scaling attacks and latent space perturbations\u2014Haoran's research\
    \ seeks to build more robust, reliable, and secure AI systems capable of maintaining\
    \ their integrity under complex, real-world deployments."
