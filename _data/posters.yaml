  long_bio: "Nick Wanninger is a Ph.D. candidate in Computer Science at Northwestern\
    \ University, advised by Peter Dinda. Before that, he received a B.S. in Computer\
    \ Science from Illinois Tech, where I worked with Kyle Hale on low-latency virtualization\
    \ technology. His research focuses on enabling new memory management systems in\
    \ unmanaged languages like C and C++ through co-design of compiler and runtime\
    \ systems, with a particular interest in kernel and runtime support for specialized\
    \ programming models. His current work centers on Alaska, a compiler and runtime\
    \ technique that brings object mobility to unmanaged languages \u2014 enabling\
    \ capabilities like live object relocation, defragmentation, and dynamic memory\
    \ tiering that have historically been limited to managed runtimes. He is expected\
    \ to graduate in the coming year and is interested in pursuing research in industry.\
    \ Learn more at https://nickw.io"
