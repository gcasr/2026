  title: Reducing Energy Cost of On-Device LLM Inference via DVFS and Adaptive Decoding
- abstract: "A research data mesh is a data platform consisting of collection of data\
    \ commons, data repositories, cloud-based computational resources, and other cloud-based\
    \ resources (\"data nodes\") that interoperate using a common set of core software\
    \ services and is designed to accelerate research by supporting the management,\
    \ exploration, analysis and sharing of data. \n\nIn this work we present Mesh\
    \ and Node cards, which are JSON documents that are designed to automate the set\
    \ up and maintenance of research data meshes. Mesh Cards provide a machine readable\
    \ advertisement to data nodes of valid standards that can be used for interoperation,\
    \ whereas node cards provide API specific details for data meshes to use for aggregation.\n\
    \nWe also explore the use of publish-subscribe mechanisms within the data mesh\
    \ ecosystem for a highly scalable data sharing protocol. In our use case, users\
    \ can share metadata with the centralized hub to facilitate search and discovery\
    \ while also creating a history of data publications for future reference.\n\n\
    In addition, because of the nature of publish-subscribe paradigms, multiple services\
    \ can consume broadcast data from publishers. This allows for easy internode and\
    \ intranode communication and clearly defined mesh state, since any subscriber\
    \ may observe changes to a node or mesh by simply observing the channels describing\
    \ the changes."
