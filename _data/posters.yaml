- abstract: "Scientific discovery increasingly relies on the collaboration between\
    \ diverse institutions, such as telescope observatories, satellites, and laboratories,\
    \ which each observe only a fragment of the underlying phenomenon.\n\nWe study\
    \ private, distributed inference in this setting, where such parties hold partial,\
    \ multi-modal observations over local timestamps and cannot directly share raw\
    \ data. We model the system as a multilayer tree comprising participant nodes,\
    \ intermediate forwarders, and a trusted root orchestrator that coordinates request\
    \ fulfilment and computation. Each node submits requests when the required modalities\
    \ for a fixed calculation are missing locally. \n\nWe evaluate our privacy-aware\
    \ network routing protocol under varying environmental conditions: data availability,\
    \ network topology, and request constraints such as accuracy and speed. To validate\
    \ this protocol, we compare it against an integer linear program baseline for\
    \ the model system with the objective set to minimise communication overhead across\
    \ the network. We also take into account the variable sizes of these modalities\
    \ (e.g. numerical data, images, videos). \n\nIn preliminary per-timestamp settings,\
    \ our protocol matched the ILP baseline on feasibility and communication cost\
    \ across 25,536 request-level evaluations while reducing mean runtime from 8.15s\
    \ to 0.08s, a roughly 99x improvement. It maintained 100\\% successful calculation\
    \ completion with zero failures, while a random baseline incurred 14.8\\% higher\
    \ communication cost. These results suggest that structured routing can preserve\
    \ optimization-quality performance while making distributed scientific inference\
    \ far more practical."
