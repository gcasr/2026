- abstract: 'Deploying large language models (LLMs) on edge devices enables privacy
    and low-latency applications, but remains challenging due to limited compute capacity
    and strict thermal constraints. Existing power management approaches, such as
    dynamic voltage and frequency scaling (DVFS), primarily operate at the hardware
    level and often face a fundamental trade-off between performance and energy efficiency.


    In this work, we present PELM, a system that jointly optimizes hardware control
    and LLM decoding behavior for energy-efficient on-device inference. Our key observation
    is that not all tokens require full-depth execution to maintain high output quality.
    Building on this insight, PELM expands the optimization space beyond frequency
    scaling by incorporating self-speculative decoding and adaptive verification depth,
    enabling dynamic control over both computation and hardware usage.


    To manage this multi-dimensional design space, PELM employs a lightweight reinforcement
    learning-based controller that continuously adjusts processor frequencies and
    decoding parameters at runtime, adapting to workload characteristics and thermal
    conditions. We implement PELM on NVIDIA Jetson edge platforms and evaluate it
    across diverse workloads.


    Results show that PELM reduces energy consumption by up to 52.4% while achieving
    up to 23.1% speedup compared to existing DVFS-based approaches, without significant
    degradation in task performance. These findings highlight the importance of cross-layer
    co-design for efficient LLM deployment on resource-constrained devices.'
  authors: Weisi Yang, Stephen Xia
  board_number: L14
  institution: Northwestern University
  number: 131
  room: Lake
  session: 2
  title: Reducing Energy Cost of On-Device LLM Inference via DVFS and Adaptive Decoding
- abstract: "A research data mesh is a data platform consisting of collection of data\
    \ commons, data repositories, cloud-based computational resources, and other cloud-based\
    \ resources (\"data nodes\") that interoperate using a common set of core software\
    \ services and is designed to accelerate research by supporting the management,\
    \ exploration, analysis and sharing of data. \n\nIn this work we present Mesh\
    \ and Node cards, which are JSON documents that are designed to automate the set\
    \ up and maintenance of research data meshes. Mesh Cards provide a machine readable\
    \ advertisement to data nodes of valid standards that can be used for interoperation,\
    \ whereas node cards provide API specific details for data meshes to use for aggregation.\n\
    \nWe also explore the use of publish-subscribe mechanisms within the data mesh\
    \ ecosystem for a highly scalable data sharing protocol. In our use case, users\
    \ can share metadata with the centralized hub to facilitate search and discovery\
    \ while also creating a history of data publications for future reference.\n\n\
    In addition, because of the nature of publish-subscribe paradigms, multiple services\
    \ can consume broadcast data from publishers. This allows for easy internode and\
    \ intranode communication and clearly defined mesh state, since any subscriber\
    \ may observe changes to a node or mesh by simply observing the channels describing\
    \ the changes."
  authors: Michael Lukowski, Matthew West, Robtert L. Grossman
  board_number: L15
  institution: University of Chicago
  number: 132
  room: Lake
  session: 2
  title: Towards Automation and Reproducibility for Research Data Meshes
- abstract: "Next-generation detectors in high-energy physics (HEP) and X-ray science\
    \ (XRS) are driving continuous, multi-stage streaming pipelines with facility-scale\
    \ data rates approaching petabytes per second. These pipelines require real-time\
    \ reconstruction under strict energy constraints, integrating data ingestion,\
    \ preprocessing, AI inference, and feedback-driven control, with intermediate\
    \ results steering detector configuration and analysis decisions. Such closed-loop\
    \ workflows have usually relied on custom, one-of-a-kind hardware components,\
    \ with limited ability to adapt to new sensor or compute technologies after deployment.\
    \ We argue that a well-designed software infrastructure can efficiently orchestrate\
    \ these workflows, avoiding manual tuning and allowing general-purpose computing\
    \ hardware integration.\n\nWe present Drava, an event-driven runtime system for\
    \ scientific pipelines based on a lightweight event-driven model.\nDevelopers\
    \ express application stages as reusable components, while Drava manages event\
    \ scheduling, batching, data movement, and transport-aware execution across heterogeneous\
    \ resources. This design separates scientific logic from system concerns and enables\
    \ control over execution granularity, data locality, and resource utilization.\n\
    \nOur contributions are threefold. First, we introduce a runtime abstraction for\
    \ composing multi-stage scientific workflows as end-to-end streaming pipelines.\
    \ Second, Drava provides stage-level and pipeline-level instrumentation to quantify\
    \ how batching, concurrency, transport, and resource placement affect throughput,\
    \ latency, and energy efficiency. Third, we enable agentic workflows for runtime\
    \ optimization: one agent performs guided exploration to identify top-performing\
    \ configurations, while another learns a surrogate model from sampled executions\
    \ to predict promising configurations. \n\nWe demonstrate Drava using multi-stage\
    \ ptychography and tomography applications, showing sustained high-throughput\
    \ execution and ability to adapt to increasing data rates and bandwidth demands\
    \ of next-generation detectors."
  authors: Ahmedur Rahman Shovon, Romain Pereira, Brice Videau, Swann Perarnau
  board_number: L16
