  session: 1
  title: Agentic Orchestrator for Scientific LLM Inference
- abstract: "The rapid growth of deep learning model sizes has made single-GPU training\
    \ and inference increasingly infeasible. State-of-the-art language models, vision\
    \ transformers, and multimodal architectures routinely exceed the memory and compute\
    \ capacity of individual accelerators, driving organizations toward multi-GPU\
    \ infrastructures as the primary vehicle for both training and serving.\n\nWe\
    \ present a GNN\u2013based approach to estimating data movement latency within\
    \ clustered GPU topologies. We evaluate three GNN architectures: MPNN (NNConv),\
    \ GAT, and GCN using scenario-aware data splitting to prevent counterfactual leakage\
    \ and ensure generalization to unseen topologies. Our results demonstrate that\
    \ GNNs are a viable and generalizable alternative to static cost models for data\
    \ movement estimation in GPU clusters, with potential applications in real-time\
    \ routing and adaptive congestion avoidance for collective communication libraries."
  authors: Chalmers Phua, Animesh Saxena
  board_number: N32
  institution: University of Illinois Chicago
  number: 75
  room: Northwestern
  session: 1
  title: 'Bottlenet: Estimating data movement latency within a clustered GPU topology
    using GNN'
- abstract: The rapid adoption of drones across various domains, alongside advancements
    in computer vision, has driven growing interest in vision-based airborne object
    detection from moving aerial platforms. However, this task remains challenging
    due to the small scale of objects, camouflage within cluttered backgrounds, and
    occlusions. To address these challenges, we introduce an end-to-end detection
    framework that integrates a Drone Receptive Field Block (DRFB) to extract multiscale
    and geometrically diverse features, specifically designed to enhance the detection
    of small and camouflaged airborne objects. To model motion patterns over time
    while preserving spatial structure, particularly for detecting camouflaged, cluttered
    and occluded objects with limited appearance cues, we incorporate a Convolutional
    Long Short-Term Memory (ConvLSTM) module, which effectively captures temporal
    dependencies across consecutive frames. Additionally, we introduce a SpatioTemporal
    Attention Block (STAB), inspired by Multi-Head Attention, to aggregate spatial
    and temporal context for improved semantic understanding. The detection head combines
    a Swin Transformer with a Cross Stage Partial (CSP) Bottleneck, offering lightweight
    yet powerful global context modeling for robust detection in complex aerial scenes.
    We evaluate our model on four publicly available airborne object detection datasets
    from moving drones, achieving significant improvements in accuracy while maintaining
    real time inference speed. Moreover, when integrated into various You Look Only
    Once (YOLO) architectures, our spatial feature extraction module (DRFB) consistently
    boosts performance, demonstrating its broad applicability and effectiveness.
  authors: Md. Hasibur Rahman and Sanjay Madria
  board_number: N33
  institution: Missouri University of Science and Technology
  number: 78
  room: Northwestern
  session: 1
  title: 'STARD-Net: SpatioTemporal Attention for Robust Detection of Tiny Airborne
    Objects from Moving Drones'
- abstract: 'Higher-dimensional quantum systems (qudits) provide a promising route
    toward more efficient quantum computation by increasing the information encoded
    per physical mode. However, compiling arbitrary unitary operations into hardware-executable
    instructions remains a key bottleneck, particularly for superconducting cavity-based
    platforms. In this work, we study practical compilation strategies for qudit systems
    using SNAP (Selective Number-dependent Arbitrary Phase) and displacement gates,
    a universal control set for bosonic architectures.


    We evaluate both structured and search-based decomposition methods across a range
    of system sizes, circuit depths, and initialization conditions. Our analysis focuses
    on fidelity, gate count, and variability across optimization runs. Through systematic
    parameter sweeps, we identify tradeoffs between expressivity and stability, showing
    that search-based approaches can achieve high fidelity but exhibit significant
    run-to-run variability due to non-convex optimization landscapes. In contrast,
    structured methods provide more consistent performance, though often at the cost
    of deeper circuits.


    These results highlight key challenges in compiling for near-term qudit hardware
    and provide guidance on selecting decomposition strategies under realistic constraints.
    More broadly, this work advances efforts to bridge the gap between abstract quantum
    algorithms and practical, hardware-level implementations.'
  authors: "Katie Harrison, Leonardo Bove, Yuchen Zhu, Mu-Te Lau, Tanay Roy, Jos\xE9\
    \ Cruz Serrall\xE9s, Nikos Hardavellas, Kate Smith"
  board_number: R1
  institution: Northwestern University, Fermi National Lab
