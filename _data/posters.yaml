- abstract: 'Understanding how spectrum is used in real-world environments is central
    to dynamic spectrum access and spectrum policy. Most existing approaches rely
    on threshold-based occupancy, which indicates activity but does not distinguish
    different usage patterns.


    We present a proof-of-concept pipeline for characterizing spectrum use from long-term
    passive measurements. Using year-long data collected at a fixed monitoring site
    in Chicago, we extract interpretable features from sliding windows of channel-level
    power and apply density-based clustering to identify recurring operational regimes.


    These regimes capture distinct patterns such as persistent transmission, burst-dominated
    activity, and extended silence. Representing each day as a mixture of regimes
    provides a compact summary of channel behavior and enables tracking of long-term
    stability and structural change.


    The resulting representation can support labeling of large-scale measurement data
    and can be combined with contextual information for improved interpretation. The
    approach is measurement-driven and designed to generalize across bands and deployments.'
