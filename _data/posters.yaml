  institution: Northwestern University
  long_bio: "Tommy McMichen is a final-year Ph.D. student at Northwestern University,\
    \ advised by Simone Campanoni. His research focuses on extending compilers to\
    \ reason about the high-level concepts that software developers take for granted\
    \ \u2014 identifying where valuable information is lost across system boundaries\
    \ and building general-purpose infrastructure to preserve it.<br/>His thesis work,\
    \ MemOIR, bridges the abstraction gap between developers and compilers by exposing\
    \ high-level data collections as first-class compiler citizens, unlocking novel\
    \ analyses and optimizations that achieve order-of-magnitude performance gains.<br/>He\
    \ is now applying this methodology to AI coding agents, where the compiler-agent\
    \ interface remains largely uncharted. His work identifies where existing tools\
    \ fall short of agent needs, adapts and improves them for agentic workflows, and\
    \ develops new compiler infrastructure purpose-built for the AI era \u2014 with\
    \ the long-term vision of agents that are economical and correct by construction\
    \ rather than by scale.<br/>Tommy has published at top venues including CGO and\
    \ ASPLOS, and has industry experience at Meta working on C++ compiler analyses\
    \ for ClangIR."
