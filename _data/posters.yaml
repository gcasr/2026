    \ Program run by the former Computation Institute. He is an active member of both\
    \ ACM and IEEE.<br/>---------------------------------------------------------------------------------------------------------------------------------------------<br/>Dr.\
    \ Anthony Kougkas is an Associate Research Professor in the Department of Computer\
    \ Science at the Illinois Institute of Technology (Illinois Tech), where he serves\
    \ as Deputy Director of the Gnosis Research Center. He additionally holds a position\
    \ as a Guest Research Scientist at Argonne National Laboratory's Mathematics and\
    \ Computer Science division.<br/>His research focuses on developing cutting-edge\
    \ data management and storage solutions, with a strong emphasis on High-Performance\
