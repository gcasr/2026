  title: Centralizing Task-based Approach to Quantum Network Control
- abstract: 'The creation of virtual memory was a watershed moment for systems software.
    It enabled safe multi-tenancy, memory protection, and demand paging through a
    simple but powerful abstraction: the page. Yet the page is a poor match for how
    modern applications actually organize memory. User-space programs allocate, access,
    and optimize around objects, often only tens of bytes in size, while the kernel
    manages memory in multi-kilobyte pages. This granularity mismatch forces virtual-memory
    mechanisms such as swapping, protection, and access tracking to operate over pages
    that may indiscriminately mix hot and cold objects. This is fundamentally because
    the virtual memory system cannot have generalized introspection into each application''s
    specific memory semantics and use cases.


    In this work, we present Yukon, a hardware extension that extends the virtual-memory
    philosophy to individual heap objects through handles: a level of indirection
    managed entirely in user space. Yukon adds a simple hardware structure, the Handle
    Translation Lookaside Buffer (HTLB), to the load/store unit allowing handle-based
    object translation to occur directly in hardware rather than through software
    handle dereferences. We describe an implementation of the HTLB in the BOOMv3 RISC-V
    out-of-order core running in FireSim.


    With a small hardware addition and a simple hardware/software interface, Yukon
    enables virtual-memory-like mechanisms at object granularity and under user-space
    control. By making individual objects relocatable and observable, Yukon opens
    the door to fine-grained memory management techniques such as object-level swapping,
    compression, protection, and locality optimization without requiring the kernel
    to understand application-specific data structures.'
