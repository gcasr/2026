- abstract: "Kersten et al. (2018) compared vectorized and data-centric compiled query\
    \ execution within a single test framework on a single-socket Skylake X at moderate\
    \ thread counts, concluding that the two paradigms achieve broadly similar performance\
    \ with principled tradeoffs by query class. Their conclusions and recommendations\
    \ have since been treated as settled. We reproduce their methodology on five contemporary\
    \ platforms \u2014 multi-socket Cascade Lake, Neoverse N1, Neoverse V2 in single-\
    \ and dual-NUMA configurations, and AMD EPYC \u2014 at higher thread counts and\
    \ finer thread-count sampling. We find that the paper's qualitative mechanisms\
    \ generalize: compilation wins register-resident compute, vectorization hides\
    \ cache-miss latency better, and the relative engine ranking on most queries matches\
    \ the paper's findings at single thread. The quantitative conclusions do not generalize.\
    \ Engine performance ratios at high thread counts are governed by which platform-specific\
    \ bottleneck binds \u2014 memory bandwidth on single-socket hardware, cross-NUMA\
    \ coordination on multi-NUMA hardware, execution-port contention under SMT \u2014\
    \ and these bottlenecks vary in ways the paper's measurement platform could not\
    \ have surfaced. Several specific recommendations from the paper actively mislead\
    \ on modern hardware: vector size 1024 is suboptimal across all tested platforms,\
    \ SIMD optimizations that the paper found neutral on AVX-512 produce substantial\
    \ engine-ranking shifts on ARM, and hyperthreading degrades rather than improves\
    \ throughput on most queries on modern server parts. We argue that engine choice\
    \ on modern many-core systems is a function of platform topology and operating\
    \ point that no single benchmark configuration can capture."
