  institution: Loyola University Chicago
  number: 54
  room: Dillo
  session: 1
  title: Status-Coherent Clique Mining in Signed Networks
- abstract: "AI agents are becoming the primary interface to scientific data, yet\
    \ discovering datasets on HPC filesystems remains a guess-and-check process. Agents\
    \ repeatedly invoke find and ls with regex patterns, wasting compute, time, and\
    \ LLM credits on failed searches. Filesystem metadata \u2014 rich type information,\
    \ dimensional annotations, and simulation parameters embedded in formats like\
    \ HDF5 \u2014 is invisible to these tools. Ideally, storage systems would support\
    \ semantic search natively, but scientific metadata is highly distributed across\
    \ cluster nodes, and no benchmark exists to evaluate which search technique best\
    \ serves agent-driven discovery in this setting.\n\nIn this project, we benchmark\
    \ four search backends \u2014 BM25 keyword matching, Elasticsearch (external BM25\
    \ over REST), Neo4j knowledge graph traversal, and Qdrant vector cosine similarity\
    \ \u2014 integrated into CLIO, an optimized multi-tiered context storage system\
    \ with support for filesystem semantics. Each backend is plugged into CLIO's Context\
    \ Transfer Engine through a factory pattern, receiving identical LLM-generated\
    \ summaries (Qwen 2.5 3B) extracted from HDF5 simulation metadata. This enables\
    \ controlled comparison across keyword, graph, and semantic approaches. We evaluate\
    \ on 273 GADGET-2 N-body astrophysics snapshots spanning 16 simulation configurations\
    \ with 20 natural-language queries.\n\nEmbedding BM25 directly in CLIO's I/O layer\
    \ achieves 70% Top-1 accuracy at 0.047 ms per query \u2014 350\xD7 faster than\
    \ Elasticsearch running the same algorithm over REST (16.4 ms), isolating the\
    \ speedup to transport elimination. Qdrant cosine similarity reaches 95% Top-1\
    \ by bridging synonym gaps that keyword methods miss. Neo4j graph traversal enables\
    \ structured entity-relationship queries at 62% accuracy. On a 4-node distributed\
    \ deployment, accuracy remains invariant while query latency stays below 2 ms.\
    \ These results establish performance tradeoffs between keyword, semantic, and\
    \ graph-based search for agent-driven scientific data discovery."
  authors: Rajni Parshuram Pawar, Luke Logan, Xian-He Sun, Anthony Kougkas
  board_number: D10
  institution: Illinois Institute of Technology
  number: 56
  room: Dillo
  session: 1
  title: Benchmarking the Performance of Semantic Search Techniques for Agent Discovery
- abstract: 'Training machine learning (ML) surrogates for expensive subroutines in
    simulations is traditionally done up-front on large datasets, with fine-tuning
    often employed to specialize these surrogates on specific systems. Even with fine
    tuning, highly dynamic simulations often encounter system states which are outside
    of the training domain of ML surrogate for which the ML prediction will be highly
    uncertain and which can render the simulation results inaccurate. On-the-fly learning,
    which involves updating the ML surrogate when such states are encountered, is
    a promising but underexplored solution to this problem. We propose Cascade: a
    distributed agentic framework built with Academy, that enables on-the-fly training
    of ML simulation surrogates across distributed resources. In Cascade, specialized
    agents continue simulations until halted by an auditor agent if a control system
    identifies if the simulation has drifted too far from the training data. Additional
    agents produce new training data, train new surrogate models, and make them available
    to runner agents. We discuss the design considerations of Cascade and their impact
    on scalability. We also discuss results from a serial implementation which reduces
    error from 80% to 5% by carefully blending in new ML surrogates over time rather
    than naively swapping in newly trained surrogates. By separating simulation, auditing,
    and retraining into coordinated agents, Cascade creates a testbed for evaluating
    strategies for training data drift-detection, data selection, and surrogate integration.
    Cascade can be distributed across heterogeneous resources to account for the varying
    hardware demands of running simulations and training surrogate models, aiming
    for efficient HPC resource utilization.

    '
  authors: Michael Tynes, Logan Ward, Kyle Chard, Ian Foster
  board_number: D11
  institution: University of Chicago, NVIDIA, Argonne National Laboratory
  number: 76
  room: Dillo
  session: 1
  title: 'Cascade: A Distributed Agentic Framework for On-the-Fly Surrogate Learning
    in Scientific Simulations'
- abstract: "Emerging cyber-physical systems increasingly require real-time inference\
    \ from streaming sensor data while maintaining models that reflect complex and\
    \ evolving physical processes. However, high-fidelity simulations and model training\
    \ often require execution on remote high-performance computing (HPC) systems,\
    \ creating a fundamental mismatch between the latency requirements of edge applications\
    \ and the computational cost and availability of HPC resources.\n\nWe present\
    \ RBF (Reverse Backfill), a hybrid edge\u2013HPC learning and inference architecture\
    \ that integrates real- time edge inference with asynchronous simulation-driven\
    \ model improvement on HPC systems. RBF reinterprets HPC backfilling by using\
    \ opportunistic, delay-tolerant computation to improve model accuracy rather than\
    \ system utilization. RBF decouples low-latency inference from expensive simulation\
    \ and training workflows by deploying lightweight surrogate models with a regular\
    \ cadence. It also uses batch-controlled HPC resources to generate improved models\
    \ that are retrained opportunistically as resources become available. The architecture\
    \ supports pluggable surrogate models and orchestrates computation across heterogeneous\
    \ infrastructure spanning edge devices, private 5G networking, cloud services,\
    \ and HPC clusters.\n\nTo demonstrate and evaluate RBF, we instantiate it using\
    \ a real digital agriculture application. The deployment couples edge sensing\
    \ with computational fluid dynamics (CFD) simulations to infer spatial airflow\
    \ patterns in a large agricultural screenhouse. Our evaluation characterizes the\
    \ end-to-end performance of the RBF pipeline under realistic system constraints,\
    \ quantifying simulation latency, model training cost, inference throughput, and\
    \ the impact of delayed model updates on prediction accuracy. Results show that\
    \ HPC resources can be effectively integrated into operational cyber-physical\
    \ systems to deliver real-time inference from AI surrogates trained on high-fidelity\
    \ simulations."
  authors: Ryan Hartung, Douglas Thain
  board_number: D12
  institution: University of Notre Dame
  number: 77
  room: Dillo
  session: 1
  title: Hybrid Edge-HPC Systems for Low-Latency Data-Driven Inference
- abstract: Sorting encrypted data under fully homomorphic encryption (FHE) is a critical
    primitive for privacy-preserving computation, enabling applications from secure
    database operations to confidential machine learning pipelines. However, the prohibitive
    computational cost of homomorphic operations makes efficient sorting on encrypted
    data exceptionally challenging. While recent work has demonstrated single-node
    parallel sorting algorithms for FHE data using shared-memory architectures, these
    approaches remain fundamentally limited by the computational capacity and memory
    constraints of individual machines. This paper presents the first distributed-memory
    parallel sorting algorithm for homomorphically encrypted data, extending beyond
    single-node limitations to multi-node supercomputing environments. We develop
    a hybrid MPI+OpenMP implementation that exploits the constant-depth, embarrassingly
    parallel structure of the Mazonne sorting algorithm (USENIX Security 2025), enabling
    effective utilization of distributed computing resources. Our approach incorporates
    efficient load balancing schemes to ensure optimal workload distribution across
    processors and nodes. The compute-dominated nature of FHE operations, combined
    with low-latency interconnects on modern supercomputers, makes the marginal communication
    overhead negligible compared to computational gains from massive parallelism.
    Experimental evaluation on the Polaris supercomputer at Argonne Leadership Computing
    Facility shows that distributed execution significantly mitigates the quadratic
    runtime growth observed in the single-node setting and achieves up to a 2^7x speedup.
    We successfully scale to 1,024 MPI processes and 16,384 threads to sort 65,536
    CKKS-encrypted elements in 3,069 seconds, the largest reported FHE sorting experiment
    to date.
  authors: Charis Hulu, Valentino Guerrini, Sidharth Kumar, Anrin Chakraborti
  board_number: L1
  institution: University of Illinois of Chicago
  number: 4
  room: Lake
  session: 1
  title: 'Beyond Single-Node: High-Performance Parallel Sorting for CKKS Encrypted
    Data'
- abstract: To fulfill their promise, quantum networks must transform from isolated
    testbeds into scalable infrastructures for distributed quantum applications. In
    this paper, we present a prototype orchestrator for the Argonne Quantum Network
    (ArQNet) testbed that leverages design principles of software-defined networking
    (SDN) to automate typical quantum communication experiments across buildings in
    the Argonne campus connected over deployed, telecom fiber. Our implementation
    validates a scalable architecture supporting service-level abstraction of quantum
    networking tasks, distributed time synchronization, and entanglement verification
    across remote nodes. We present a prototype service of continuous, stable entanglement
    distribution between remote sites that ran for 12 hours, which defines a promising
    path towards scalable quantum networks.
  authors: Md Shariful Islam, Joaquin Chung, Ely Marcus Eastman, Robert J. Hayek,
    Prem Kumar, Rajkumar Kettimuthu
  board_number: L2
  institution: Northwestern University, Argonne National Laboratory
  number: 5
  room: Lake
  session: 1
  title: Experimental Demonstration of Software-Orchestrated Quantum Network Applications
    over a Campus-Scale Testbed
- abstract: "User queries may reveal a client\u2019s intent with their predicate parameters.\
    \ Concealing these parameters from the untrusted server during queries over a\
    \ public database is private information retrieval (PIR), a well-studied problem\
    \ in cryptography. This work is the first SQL query evaluation system to address\
    \ a stronger variation of this problem that preserves both predicate confidentiality\
    \ and the privacy of the database\u2019s records\u2013not revealing them to the\
    \ client\u2013the symmetric PIR (SPIR) setting. Prior PIR work used heavyweight\
    \ fully homomorphic encryption (FHE) schemes while selectively offloading some\
    \ tasks onto the client to make their performance practical. In our work, the\
    \ client does not take part in query evaluation, only receiving the final query\
    \ answer. These settings are well-suited to lightweight clients such as mobile\
    \ devices. SPIR querying is also useful for settings like anti-money laundering\
    \ compliance for banks, where regulators issue private queries to learn about\
    \ how transactions are moving through accounts without divulging information about\
    \ all their customers to the government.\n\nWe present HAMMER a query execution\
    \ system that offers SPIR over SQL queries using a combination of local, server-side\
    \ query evaluation, FHE, and multiparty computation (MPC) to make this process\
    \ secure and scalable. FHE supports SIMD, which makes it 1-2 OOM faster than MPC\
    \ on data-parallel operators. We therefore evaluate private filters and aggregates\
    \ under FHE with operators organized to reduce their circuit depth and we support\
    \ precise integer arithmetic. For steps with long sequences of conditional logic,\
    \ such as sorts, we turn to MPC via our novel secure context switch. We convert\
    \ FHE-encrypted intermediate results into secret shares among the original server\
    \ and a non-colluding MPC helper node with no client assistance. In addition,\
    \ HAMMER selects per-query FHE parameters guided by analytical depth bounds, and\
    \ it supports parallelism on multicore CPUs and GPUs. Our hybrid query evaluation\
    \ achieves 5.3\xD7\u20138.4\xD7 speedups over the state-of- the-art FHE database\
    \ on TPC-H workloads. With GPU-accelerated FHE evaluation, the majority of our\
    \ query workload runs at SF1 in under a minute."
  authors: Donghyun Sohn, Zohaib Azam, Minxuan Zhou, Jennie Rogers
  board_number: L3
  institution: Northwestern University, Illinois Institute of Technology
  number: 8
  room: Lake
  session: 1
  title: 'HAMMER: Homomorphic Analytics with Multiparty Method for Encrypted Relational
    Queries'
- abstract: "Privacy-preserving machine learning (PPML) protocols partition computation\
    \ across two paradigms: function secret sharing (FSS) handles non-linear operations\
    \ such as ReLU and comparison, while additive secret sharing handles linear operations.\
    \ Both adopt offline/online decompositions to minimize online latency, but this\
    \ shifts the burden to the offline phase, where generating and storing correlated\
    \ randomness becomes the dominant bottleneck. Our profiling of Orca, a GPU-accelerated\
    \ FSS-based PPML system, reveals that precomputed FSS keys grow from gigabytes\
    \ to tens of gigabytes as model complexity increases, with key storage, I/O, and\
    \ memory movement consuming as much time as GPU computation even for moderate-sized\
    \ models. These costs worsen as FSS-based frameworks target heavier workloads.\n\
    We propose a unified acceleration framework addressing this offline bottleneck\
    \ across both paradigms. For FSS-based non-linear evaluation, we replace large\
    \ precomputed keys with compact seeds expanded on-the-fly on GPU. Chunked online\
    \ key generation reduces peak staged key footprint by up to 128\xD7 compared to\
    \ one-shot generation with under 2\xD7 time overhead, providing a tunable memory-efficiency\
    \ knob. For secret-sharing-based linear evaluation, we GPU-accelerate Ring-LPN\
    \ pseudorandom correlation generators (PCGs). Our GPU NTT engine, adapted from\
    \ Cheddar's two-phase kernel structure, achieves roughly 89\xD7 polynomial multiplication\
    \ speedup over the NFLLib CPU baseline, providing the fast polynomial core that\
    \ online PCG expansion requires. Built on this, our GPU Ring-LPN VOLE expansion\
    \ prototype demonstrates that PCG-based correlation generation runs efficiently\
    \ on GPU, with validated correctness across polynomial degrees from 8,192 to over\
    \ one million for both 32-bit and 64-bit modulus widths. We are currently integrating\
    \ these components into Orca"
  authors: Fatih Cetin, Chenkai Wang, Yanxue Jia, Minxuan Zhou
  board_number: L4
  institution: Illinois Institute of Technology, Arizona State University
  number: 9
  room: Lake
  session: 1
  title: 'Toward Scalable Privacy-Preserving Machine Learning: Unified GPU Acceleration
    for Offline Correlation Generation'
- abstract: "Blockchain consensus mechanisms face the trilemma of balancing security,\
    \ decentralization, and resource efficiency. Two dominant consensus algorithms,\
    \ Bitcoin\u2019s Proof-of-Work (PoW) and Ethereum\u2019s Proof-of-Stake (PoS),\
    \ balance security, scalability, and energy efficiency, though PoW is energy-intensive\
    \ and PoS faces risks centralizing power among wealthy validators, creating risks\
    \ of centralization, governance capture, censorship, and reduced network fairness\
    \ over time. Chia\u2019s Proof-of-Space (PoSp) offers a middle-ground, using storage\
    \ (instead of computation) for validation in the network while maintaining decentralization.\n\
    \nPoSp turns the computational-intensive problem into a data-intensive problem.\
    \ Participants\ndedicate unused disk space to store pre-computed cryptographic\
    \ proofs, which can later be\nverified with minimal computational effort. We present\
    \ VaultX, a clean-slate PoSp system that utilizes a minimalist approach redesigned\
    \ from the ground up for hardware efficiency, simplicity, and scalability. It\
    \ uses a two-table construction using BLAKE3 cryptographic hashing that defends\
    \ against time\u2013memory trade-off attacks while dramatically reducing algorithmic\
    \ complexity. Parallelism is achieved in VaultX through OpenMP with I/O-aware\
    \ data layouts, and optimizations targeting mechanical hard drives through large\
    \ sequential I/O calls. We evaluate VaultX on the Mystic testbed across 9 heterogeneous\
    \ machines, from 4-core Raspberry Pi nodes to 384-core HPC servers, spanning HDD,\
    \ SSD, NVMe, NFS, and Ceph storage.\n\nVaultX can generate 2^32 cryptographic\
    \ proofs (K32 vault) in as low as 6 minutes versus 18\nminutes for BladeBit, Chia\u2019\
    s fastest CPU plotter working across 64-cores and 512GB RAM.\nOur hash compression\
    \ strategy allows hash values to be omitted from the final saved state,\nreducing\
    \ stored information from 40 bytes per proof to 8 bytes, producing 32GB K32 com-\n\
    pressed vaults compared to Chia\u2019s 105GB K32 plots, or 160GB K32 uncompressed\
    \ vaults.\nAn economic analysis shows that PoSp is cost-competitive with PoW over\
    \ a 5-year horizon,\nwith significantly lower ongoing energy expenditure, producing\
    \ less ewaste, making VaultX a\nviable, sustainable, and egalitarian foundation\
    \ for decentralized consensus."
  authors: Samuel Fatunmbi, Ioan Raicu
  board_number: L5
  institution: Illinois Institute of Technology2
  number: 12
  room: Lake
  session: 1
  title: 'VaultX: A Lightweight Proof-of-Space Consensus System'
- abstract: "Scientific applications are executed in a broad variety of cluster ecosystems\
    \ which use several layers of supporting technology to connect processes with\
    \ data and manage resources. The applications themselves are composed with invocations\
    \ of various domain specific software packages. \nMany applications benefit in\
    \ performance, scalability, and portability when described and executed as a task-based\
    \ workflow, with order of execution defined by a DAG (Directed-Acyclic-Graph).\
    \ The challenge in writing such a workflow is the description of tasks and their\
    \ dependencies in order to form the DAG. Programs often exhibit implicit behavior\
    \ and depend on unexpected information, making it difficult to define the behavior\
    \ of a task.\n\nThis work presents Contour, an I/O analysis and workflow composition\
    \ toolkit which observes a running application to create an execution contract.\
    \ The contract describes the behavior of the application and facilitates its transposition\
    \ to a high-level distributed workflow. Contour enables task-based workflow description\
    \ and execution for complex scientific applications. "
  authors: "Colin Thomas, Andr\xE9s Iglesias, Douglas Thain"
  board_number: L6
