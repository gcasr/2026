  title: Conventional Attacks on Scientific Applications
- abstract: "Blockchain technology enables decentralized, tamper-proof transaction\
    \ processing but faces challenges in terms of energy efficiency and throughput.\
    \ Bitcoin's Proof-of-Work (PoW) power consumption, coupled with its low 7 transactions\
    \ per second (TPS) yields an effective per-transaction cost of over $100, limiting\
    \ Bitcoin's adoption for many small everyday transactions. We present MEMO, a\
    \ PoSpace blockchain system in C that explores high-throughput block creation\
    \ through a multi-process architecture with dedicated components for transaction\
    \ pooling, proof-of-space consensus, block validation, and timing coordination.\
    \ Power efficiency is achieved through the Memoization of cryptographic proofs\
    \ that are stored and retrieved from persistent storage. MEMO introduces deadline-aware\
    \ batch processing, where validators verify EdDSA signatures in parallel using\
    \ OpenMP and construct blocks within strict time budgets. Validators send partially-filled\
    \ blocks when deadlines approach rather than missing them, ensuring consistent\
    \ block intervals across all configurations. The architecture separates concerns\
    \ across independent processes connected via ZeroMQ messaging and Google Protocol\
    \ Buffer serialization, a design that mirrors real-world blockchain deployments\
    \ where transaction submitters, memory pools, validators, and chain nodes operate\
    \ as distinct entities. This separation enables each component to be independently\
    \ optimized, tested, and eventually distributed across multiple machines without\
    \ altering the core consensus logic. We evaluate MEMO across 42 parameter configurations\
    \ spanning block intervals of 1\u201332 seconds, block sizes up to 64K transactions\
    \ per block, demonstrating over 8K/sec end-to-end confirmed throughput on a single\
    \ node. Future work targets distributed deployment across 10~1K nodes using gossip-based\
    \ propagation, persistent storage backends, and post-quantum signature support\
    \ through a pluggable cryptographic interface."
  authors: Venkata Harsha Pedada, Ioan Raicu
