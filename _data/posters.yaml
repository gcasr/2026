  title: A Modular Architecture for Detecting Data Drift in Research Systems
- abstract: 'Scientific simulations on leadership-class HPC systems routinely waste
    millions of core-hours producing invalid results, yet no tool monitors whether
    a running simulation computes valid science. We call this blind spot "dark waste":
    simulations that run to completion while computing the wrong answer. Large language
    models are increasingly used to automate scientific visualization, yet they cannot
    directly process the volumetric, multi-resolution data produced by scientific
    simulations. Current approaches either control visualization tools without accessing
    data content, or reduce simulation outputs to statistical summaries that discard
    spatial structure. We introduce a multi-resolution translation layer that converts
    raw simulation data in standard formats into LLM-native representations, combining
    hierarchical metadata extraction, derived quantities to encode spatial, temporal,
    and topological relationships in a form LLMs can reason about: not merely view
    as rendered images. Building on this capability, we present Vigil, which couples
    deterministic science-aware triggers with multimodal LLM confirmation through
    a trigger-render-reason pipeline. Vigil instruments simulations with lightweight
    checks on derived-quantity operators and regions of interest; when a check detects
    a potential anomaly, the flagged data is translated and analyzed by a multimodal
    model to assess scientific validity. Upon confirming invalid behavior, Vigil can
    terminate or restart the simulation from a checkpoint, preventing further expenditure
    on "dark waste". Together, the translation layer and trigger-render-reason pipeline
    enable a new class of data-aware visualization agents capable of anomaly localization
    and physics-informed visualization design, which neither tool-mediation nor metadata-only
    approaches can support. We evaluate Vigil across four codes spanning numerical
    instability, pattern dynamics, turbulence dissipation, and molecular-dynamics
    failures. Vigil detects every deliberately configured failure with zero false
    positives and supplies an actionable semantic verdict for each alert.'
