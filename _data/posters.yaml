  long_bio: "Andrew A. Chien received the BS, MS, and PhD degrees from the Massachusetts\
    \ Institute of Technology. He is the William Eckhardt Distinguished Service Professor\
    \ in Computer Science at the University of Chicago and a senior computer scientist\
    \ at Argonne National Laboratory. He has broad interests in computer systems and\
    \ renewable energy. Chien served as Vice President of Research of Intel Corporation\
    \ (2005\u201310), the SAIC Professor in Computer Science at the University of\
    \ California, San Diego (1998\u20132005), and professor of computer science at\
    \ the University of Illinois (1990\u201398). He is a fellow of the ACM, IEEE,\
    \ and AAAS.<br/><br/>Charles Colley received his BS/MS degrees from Tufts University\
    \ and his PhD from Purdue University. His research interests are in numerical\
    \ linear algebra, spectral graph theory, and parallel algorithms. He is currently\
    \ a research scientist at Instagram.<br/><br/>Jianru Ding is a Ph.D. candidate\
    \ at the University of Chicago and received his B.S. from The Ohio State University.\
    \ His research focuses on adaptive runtimes for scalable distributed systems,\
    \ bridging application-level optimizations with underlying hardware characteristics.\
    \ He is particularly interested in improving the performance and efficiency of\
    \ large-scale machine learning workloads.<br/><br/>Alexander Fell received his\
    \ PhD from the Indian Institute of Science, Bangalore, India, and during his career,\
    \ he contributed to the RISC-V architecture and LLVM compiler development at the\
    \ Barcelona Supercomputing Center and Nanyang Technological University, Singapore.\
    \ Now, he is a Senior Research Specialist at the University of Chicago, focusing\
    \ on the compiler and simulator for the UpDown architecture.<br/><br/>David F.\
    \ Gleich received the BS degree from Harvey Mudd College and the PhD degree from\
    \ Stanford University. He is a Professor of Computer Science at Purdue University\
    \ and a University Faculty Scholar. His research is on data-driven scientific\
    \ computing, matrix computations, network and graph algorithms, and parallel and\
    \ distributed computing. He is a fellow of SIAM.<br/><br/>Henry Hoffmann received\
    \ the BS degree from UNC-Chapel Hill and the SM and PhD degrees from MIT. He is\
    \ the Liew Family Chair of the Department of Computer Science at the University\
    \ of Chicago. His research includes adaptive and self-aware computing systems.<br/><br/>Moubarak\
    \ Jeje received his BS and MS degrees from the University of Wisconsin\u2013Madison.\
    \ He currently works as a Senior Research Engineer at Tactical Computing Laboratories\
    \ (2023\u20132026). His expertise includes FPGA simulation, hardware-software\
    \ co-design, design verification, RTL microarchitecture, and the RISC-V ISA.<br/><br/>Rajat\
    \ Khandelwal is a PhD student at the University of Chicago. He received his B.Tech\
    \ from the Indian Institute of Technology BHU, India. He worked as a System Software\
    \ Developer at Intel (2020\u20132023) on USB, Type-C, and Thunderbolt subsystems.\
    \ His current research spans systems and architecture, focusing on networking\
    \ and high-performance data movement.<br/><br/>Yanjing Li received the BS and\
    \ MS degrees from Carnegie Mellon University and a PhD from Stanford. She is an\
    \ Associate Professor of the Department of Electrical and Computer Engineering\
    \ at Northeastern University. Her research includes intersections of AI and systems,\
    \ computing architecture for emerging technologies and applications, and hardware\
    \ security.<br/><br/>Jose M. Monsalve Diaz is a Member of Technical Staff at AMD.\
    \ He received his PhD and MS in Electrical and Computer Engineering from the University\
    \ of Delaware and his BSc in Electronics Engineering from Pontificia Universidad\
    \ Javeriana, Colombia. He was a Postdoctoral Researcher at Argonne National Laboratory.\
    \ His research interests include runtime systems, compilers, and heterogeneous\
    \ computing.<br/><br/>Marziyeh Nourian received her Ph.D. in Computer Engineering\
    \ from North Carolina State University. Her work addresses challenges in high-performance\
    \ computing, focusing on data transformation, scalable execution of large-scale\
    \ workloads, and hardware\u2013software co-design. Her expertise includes parallel\
    \ computing, heterogeneous and reconfigurable architectures, and compiler and\
    \ runtime techniques.<br/><br/>Andronicus Rajasukumar is a PhD candidate at the\
    \ University of Chicago. He received his BE from the College of Engineering Guindy,\
    \ India, and MTech from the Indian Institute of Technology, Delhi. He worked as\
    \ a Senior Staff Engineer at Qualcomm (2014\u201320) and Intel (2010\u201314)\
    \ in 3D-graphics GPU pre-silicon performance. His current research spans specialized\
    \ and general-purpose computer architectures and processing near memory.<br/><br/>Jiya\
    \ Su is a Ph.D. student in Computer Science at the University of Chicago. She\
    \ received the B.S. degree from Renmin University of China in 2020 and the M.S.\
    \ degree from the Illinois Institute of Technology in 2023. Her research focuses\
    \ on graph processing, parallel computing, and computer architecture.<br/><br/>Tianshuo\
    \ Su received his BS from the University of Wisconsin\u2013Madison and his MS\
    \ from Georgia Institute of Technology. His research interests include computer\
    \ architecture and high-performance computing. He was a senior engineer at Qualcomm\
    \ working on DSP performance. Currently, he works at Google in cloud infrastructure\
    \ efficiency.<br/><br/>Yuqing (Ivy) Wang is a computer science PhD student at\
    \ the University of Chicago. She received her BSci degree from the University\
    \ of Edinburgh. Her research spans parallel programming, operating systems, and\
    \ unified memory models for novel accelerator systems.<br/><br/>Wenyi Wang is\
    \ a PhD student at the University of Chicago. He earned his B.E. from Northeastern\
    \ University, China, and his M.S. from Northwestern University, USA. His research\
    \ focuses on high-performance computing and parallel computing.<br/><br/>Ruiqi\
    \ Xu received the BS and MS degrees from Northwestern University in 2023. He is\
    \ currently working toward a PhD degree at the University of Chicago. His research\
    \ interests include computer architecture and parallel programming.<br/><br/>Tianchi\
    \ Zhang received the B.S. degree from the University of Michigan and Shanghai\
    \ Jiao Tong University in 2020 and the M.S. degree from the University of Michigan\
