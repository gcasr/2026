  title: Private Inference for Decentralized Multimodal Data Silos
- abstract: "Modern IoT and embedded platforms must start execution from a known trusted\
    \ state to thwart persistent malware and protect critical infrastructure. Current\
    \ approaches to establish a root of trust depend on manufacturer-provisioned secret\
    \ keys and specialized secure hardware. If secrets are leaked or a hardware vulnerability\
    \ is discovered, the security of the entire device is permanently subverted. Furthermore,\
    \ these methods drive up costs, may involve third-parties, and rely on assumptions\
    \ about an attacker\u2019s computational power that may not hold over the device\u2019\
    s lifespan. \n\nThis paper presents TRUSTCHECKPOINTS, the first implementation\
    \ of an unconditional software root of trust on commodity hardware. We define\
    \ malware operationally as any deviation from the device\u2019s expected memory\
    \ contents, and detect it by physical footprint. Our novel algorithm, MULTIPASS,\
    \ uses k-independent randomized polynomial evaluation (via Horner\u2019s rule)\
    \ to force persistent malware into slower off-chip storage, causing detectable\
    \ timing delays. An external verifier, physically connected to the device by the\
    \ owner, measures these delays to detect even single-instruction payloads, enabling\
    \ integrity checking without cryptographic keys or specialized trusted hardware.\n\
    \nOur ARM Cortex-A53 prototype validates 192 KB of SRAM in \u223C10 s using 500\
    \ passes. Two modes, SRAM-bootstrap and full-memory scan, balance speed and coverage\
    \ on unmodified hardware. Our evaluation introduces new assumptions that bound\
    \ unconditional software root-of-trust establishment.\n"
  authors: Friedrich Doku, Peter Dinda
  board_number: N3
  institution: Northwestern University
  long_bio: Friedrich is a second-year PhD candidate and systems security researcher
    working on operating systems, computer architecture, and the foundations of trusted
    computing.  He builds prototypes that test whether theoretical security guarantees
    actually hold up on commodity hardware, and he is especially drawn to the points
    where formal models meet the messier realities of physical devices.<br/><br/>His
    recent projects sit on opposite ends of the trust spectrum. On the keyless side,
    he has built one of the first working implementations of an unconditional software
    root of trust on a commodity ARM platform, using timing based challenges and an
    external verifier to detect malware without relying on stored secrets, TPMs, or
    trusted on-chip hardware. Furthermore, he has designed a kernel-bypass I/O architecture
    that uses hardware capabilities to enforce fine-grained, register-level access
    control on unmodified commodity devices, showing that strong isolation and high-performance
    userspace drivers can coexist.<br/><br/>A recurring theme across his work is shrinking
    the trusted computing base. He is interested in replacing cryptographic stacks
    and proprietary silicon with smaller, auditable components grounded in either
    hardware capabilities or measurable physical constraints, and in honestly characterizing
    the assumptions that any such system has to satisfy in practice. More at https://fdoku.me.<br/><br/><br/>Peter
    Dinda is a professor in the Department of Computer Science at Northwestern University,
    and also holds an appointment in the Department of Electrical and Computer Engineering.   He
    headed the Computer Engineering and Systems division for five years within the
    previous Department of Electrical Engineering and Computer Science.   He holds
    a B.S. in electrical and computer engineering from the University of Wisconsin
    and a Ph.D. in computer science from Carnegie Mellon University. He works in experimental
    computer systems, particularly parallel and distributed systems, and has authored
    over 140 scientific papers, authored or is a major contributor to several large
