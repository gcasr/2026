- abstract: 'Since the advent of ChatGPT in late 2022, LLMs have become ubiquitous
    in academic settings. Several recent papers have investigated the increase in
    LLM use in scientific papers since 2022, finding a broad and increasing presence
    of LLM-modified text in papers across disciplines. Previous research has attempted
    to measure LLM use in shorter texts: paper abstracts and conference peer reviews.
    In this project, we build on this work by developing a model to quantify the use
    of LLMs in the full text of scientific papers that have been posted on ArXiv,
    an open access archive for pre-print articles primarily in Physics, Mathematics,
    and Computer Science. Our method uses individual word frequencies in known human-written
    and AI-generated articles to train a model to provide a population-level estimate
    of the proportion of text produced by an LLM in a mixed set of human-written and
    AI-generated papers. We then use this model to estimate the percentage of text
    that has been substantially modified by LLMs in a corpus of papers posted on ArXiv
    between 2023 and 2024. This lets us track and quantify the rise of LLM use in
    full text of papers across several disciplines spanning different research areas.'
