- abstract: High-Energy Physics (HEP) applications, like many other scientific applications,
    are growing in scale, requiring more energy, memory, and time out of HPC systems.
    As a result, optimizing resource usage has become a requirement in order to maintain
    sustainable high-throughput computing environments. This necessitates better methods
    to understand and apply resource usage data in our everyday computing. This work
    analyzes the power and memory usage data of a single HEP application in order
    to explore how this data can be used to inform how we manage HEP scientific applications.
    This work also explores methods to profile and fingerprint this data to assist
    in this goal.
