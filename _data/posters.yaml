  title: 'Toward Risk-Aware Bitcoin Forecasting with LLMs: Temporal Robustness and
    Internal Uncertainty Signals'
- abstract: 'I''ll discuss the performance implications of MongoDB''s Document Model.
    Compared to Relational systems, a Document database provides much more opportunity
    for spatial locality of data. Savvy users can take advantage of this to achieve
    superior read performance for many workloads. However, the Relational Model has
    its own strengths, including: clearer semantics for query optimization, better
    support for data integrity constraints, and excellent single-write performance.
    I''ll talk about how MongoDB is broadening support for relational-style workloads,
    and what the open research challenges are in a world where Document vs Relational
    is not a binary choice, but two ends of a continuous schema design space.'
