  title: Multi-Node Inertial Motion Capture Device
- abstract: "Field-deployable edge computing nodes form a network and are used to\
    \ complete scientific tasks for remote sensing and monitoring. The networked nodes\
    \ collectively decide which scientific applications to run while they are constrained\
    \ by various factors, such as differing hardware constraints from heterogeneous\
    \ nodes and time-varying quality of service (QoS) requirements. We model the problem\
    \ of task allocation as an optimization problem that maximizes the QoS, subject\
    \ to the constraints. We solve the optimization problem using a\ndual-descent\
    \ method, which can be easily implemented in a distributed way subject to the\
    \ communication constraints of the network. Using a simulation that uses real-world\
    \ data collected from Sage, a distributed sensor network, we analyze our policy\u2019\
    s performance in dynamic situations where the required QoS and the nodes\u2019\
    \ capabilities change, and verify that it can adapt and return a feasible solution\
    \ while accounting for those changes."
