  title: A Scalable Benchmarking Toolkit for AI-Driven Image Search
- abstract: 'Edge computing enables real-time data processing with low latency and
    improved privacy, making it well-suited for continuous audio sensing applications.
    In this work, we present a real-time speech transcription system deployed on NVIDIA
    Jetson edge devices using optimized implementations of OpenAI Whisper. The system
    captures live audio from a microphone and performs on-device inference to generate
    continuous text output without relying on cloud resources.


    We focus on building a streaming pipeline that supports continuous transcription
    by segmenting incoming audio into overlapping time windows and incrementally processing
    them. To operate under the resource constraints of edge hardware, we evaluate
    multiple Whisper model variants and analyze trade-offs between accuracy, latency,
    and memory usage. System-level optimizations, including GPU acceleration and efficient
    audio buffering, are applied to improve throughput and responsiveness.


    We evaluate the system using real-world audio streams and benchmark its performance
    against reference transcriptions. Results show that real-time transcription is
    feasible on edge platforms with acceptable accuracy and latency, demonstrating
    the practicality of deploying modern speech models outside of cloud environments.


    This work highlights the potential of edge-based speech intelligence systems and
    contributes a scalable approach for continuous, on-device audio transcription
    in real-world settings.'
