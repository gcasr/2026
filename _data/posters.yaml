  room: Lake
  session: 2
  title: 'Evaluating Anomaly Detection Models for Cybersecurity: From Simulation to
    Real-World Data'
- abstract: Complex scientific tasks have increasingly become automated through the
    utilization of agents. This leads to complex multi-agent systems where agent reasoning,
    tool calls, computation, and more are interleaved to solve a problem. In spite
    of this trend, a recent taxonomy of 1,642 multi-agent traces reports failure rates
    of 41 to 87 percent, with 37 percent of failures caused by inter-agent misalignment.
    Some provenance systems have been created to record the lineage of agentic workflows,
    but they are intended as observers and cannot intervene; recovery tools exist
    to rewind state but lack the knowledge provided by formal provenance models. There
    is no system that unifies both capabilities for multi-agent settings. We present
    AgentRecall, a provenance and rewind system that captures agent interactions,
    maintains multi-agent context histories, and enables cost-aware, consistent rewind
    across multiple collaborating agents. AgentRecall contributes (1) a multi-interface
    provenance collection framework spanning heterogeneous stores and multi-level
    agent pipelines, (2) a cost-aware recovery mechanism enabling consistent multi-agent
    context rewind and targeted error correction while reducing unnecessary re-execution,
    and (3) an annotated context history store supporting automated lineage reasoning
    and manual inspection of agent behavior. Preliminary evaluations of AgentRecall
    on benchmarks such as Kramabench and ParEval demonstrate that rollback can improve
    correctness by 50% over non-rewind baselines.
  authors: Keith Bateman, Xian-He Sun, Anthony Kougkas
  board_number: L18
  institution: Illinois Institute of Technology
  number: 135
  room: Lake
  session: 2
  title: 'AgentRecall: Provenance and Rewind for Multi-Agent Workflows'
- abstract: Data lakes contain highly heterogeneous data with little to no schema,
    resulting in columns that are semantically joinable but syntactically incompatible
    (e.g., "Springfield, IL" vs. "Springfield"). Transformation discovery systems
    such as AutoJoin enumerate possible transformation sequences to identify one that
    enables equi-joins between such columns. However, exhaustive search is prohibitively
    expensive at data lake scale. In this work, we investigate the use of inexpensive
    column-level statistics (e.g., string-length distributions, delimiter frequencies,
    and token counts) to prune large portions of the transformation search space.
    To handle the diversity of transformation types that may be needed to achieve
    joinability, we study how to automatically derive statistics and pruning rules
    from the preconditions of transformation operators. As a proof of concept, we
    integrate our techniques into the AutoJoin transformation search algorithm. Our
    preliminary results on 10 real-world datasets show up to a 47x speedup over vanilla
    AutoJoin. Beyond Autojoin, these techniques can be integrated into other transformation
    discovery systems, such as FlashFill, making them more feasible at data lake scale.
  authors: Rubab Zahra Sarfraz, Boris Glavic
  board_number: L19
  institution: University of Illinois Chicago
  number: 136
