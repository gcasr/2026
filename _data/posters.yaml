  institution: Northwestern University, New York University, Cornelis Networks
  long_bio: Peizhi Liu is a Ph.D. candidate in computer science at Northwestern University,
    where he is advised by Professor Peter Dinda. His research focuses on heterogeneous
    interconnects and communication optimizations across large-scale parallel and
    distributed systems. He studies the abstractions, algorithms, and underlying mechanisms
    needed to make complex communication hardware more efficient, programmable, and
    portable. Specifically, his recent work has centered around improving collective
    communication in GPU-accelerated supercomputers with parameterized algorithms
    and simulation. He is also looking into other communication mechanisms in supercomputers.
    Peizhi is an NSF Graduate Research Fellow. More about him can be found on his
    website at peizhiliu.com.<br/><br/>Sean is a first-year PhD student at NYU. His
    research focus is in HPC and in undergrad, Sean worked on collective communication
    algorithms at Northwestern University with Peter Dinda and his students, Mike
    Wilkins and Peizhi Liu. As of recent, Sean has been working on applying formal
    methods to programmable network systems and, in the future, hopes to explore how
    best to leverage the network in HPC settings.<br/><br/>Mike Wilkins is a Senior
    Software Engineer at Cornelis Networks. He received his Ph.D. in computer engineering
    from Northwestern University and was previously a Maria Goeppert Mayer fellow
    at Argonne National Laboratory. His research interests include networks and communication
    for high-performance computing systems, focusing on collective communication autotuning
