  title: Experimental Demonstration of Software-Orchestrated Quantum Network Applications
    over a Campus-Scale Testbed
- abstract: "User queries may reveal a client\u2019s intent with their predicate parameters.\
    \ Concealing these parameters from the untrusted server during queries over a\
    \ public database is private information retrieval (PIR), a well-studied problem\
    \ in cryptography. This work is the first SQL query evaluation system to address\
    \ a stronger variation of this problem that preserves both predicate confidentiality\
    \ and the privacy of the database\u2019s records\u2013not revealing them to the\
    \ client\u2013the symmetric PIR (SPIR) setting. Prior PIR work used heavyweight\
    \ fully homomorphic encryption (FHE) schemes while selectively offloading some\
    \ tasks onto the client to make their performance practical. In our work, the\
    \ client does not take part in query evaluation, only receiving the final query\
    \ answer. These settings are well-suited to lightweight clients such as mobile\
    \ devices. SPIR querying is also useful for settings like anti-money laundering\
    \ compliance for banks, where regulators issue private queries to learn about\
    \ how transactions are moving through accounts without divulging information about\
    \ all their customers to the government.\n\nWe present HAMMER a query execution\
    \ system that offers SPIR over SQL queries using a combination of local, server-side\
    \ query evaluation, FHE, and multiparty computation (MPC) to make this process\
    \ secure and scalable. FHE supports SIMD, which makes it 1-2 OOM faster than MPC\
    \ on data-parallel operators. We therefore evaluate private filters and aggregates\
    \ under FHE with operators organized to reduce their circuit depth and we support\
    \ precise integer arithmetic. For steps with long sequences of conditional logic,\
    \ such as sorts, we turn to MPC via our novel secure context switch. We convert\
    \ FHE-encrypted intermediate results into secret shares among the original server\
    \ and a non-colluding MPC helper node with no client assistance. In addition,\
    \ HAMMER selects per-query FHE parameters guided by analytical depth bounds, and\
    \ it supports parallelism on multicore CPUs and GPUs. Our hybrid query evaluation\
    \ achieves 5.3\xD7\u20138.4\xD7 speedups over the state-of- the-art FHE database\
    \ on TPC-H workloads. With GPU-accelerated FHE evaluation, the majority of our\
    \ query workload runs at SF1 in under a minute."
