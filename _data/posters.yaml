  title: Distributed Edge Computing Task Allocation with Network Effects
- abstract: Most prior work on large language model (LLM) inference has focused on
    online serving, where systems must react to dynamically arriving requests under
    strict latency and fairness constraints. However, batch inference is becoming
    increasingly important in many emerging workloads, including literature mining,
    synthetic data generation, scientific data annotation, and document summarization.
    Despite its growing practical importance, batch inference remains underexplored
    as a systems problem. A defining property of batch inference is that the workload
    is available before execution. This creates opportunities for optimizations that
    are difficult or impossible in online serving. In this work, we argue that advance
    knowledge of batch composition can be leveraged to analyze workload characteristics
    and proactively optimize execution for energy efficiency. We propose a workload-aware
    system design that analyzes a batch before or during execution and uses dynamic
    voltage and frequency scaling (DVFS) to better match hardware behavior to workload
    demand. By exploiting the predictability of batch jobs, such a system can improve
    the energy efficiency of LLM inference while maintaining competitive performance.
    This poster highlights workload-aware DVFS as a promising direction for energy-efficient
    LLM batch inference.
