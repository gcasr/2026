  title: 'SchedTwin: Simulation-Assisted Online Learning for Adaptive HPC Scheduling'
- abstract: "We present the data ingestion and processing architecture of the OpenCosmo\
    \ Visualization Application (OVA), a browser-based system for interactive exploration\
    \ of large-scale cosmological particle data designed for direct integration within\
    \ the OpenCosmo portal. In this workflow, users query subsets of simulation outputs\
    \ containing millions of particles, requiring efficient, low-latency transformation\
    \ from columnar data into interactive visual form.\nOVA executes this pipeline\
    \ entirely on the client. It ingests Apache Parquet datasets directly in the browser\
    \ using WebAssembly, leveraging Parquet\u2019s columnar layout and high compression\
    \ efficiency to reduce data transfer costs while enabling selective decoding of\
    \ relevant fields. Data is processed in parallel via Web Workers and prepared\
    \ as GPU-ready buffers for rendering, enabling end-to-end exploration without\
    \ preprocessing or server-side visualization infrastructure.\nProfiling a baseline\
    \ pipeline processing 3.3M\u201352.9M particles reveals that WebAssembly decoding\
    \ dominates per-file ingestion cost (up to 84%), while structured-clone serialization\
    \ across the Worker\u2013main thread boundary dominates end-to-end latency, averaging\
    \ 14.5 seconds at 3.3M particles and failing at 16.5M due to memory exhaustion.\
    \ We address this bottleneck through a columnar Transferable buffer architecture\
    \ that transfers typed array ownership without copying, reducing transfer time\
    \ by 13\xD7 and memory usage by 4.3\xD7.\nEvaluation demonstrates linear ingestion\
    \ scaling, near-constant transfer overhead, and sustained interactive performance\
    \ on commodity hardware, extending feasible dataset sizes to 52.9M particles.\
    \ This work shows that careful systems design enables scalable, client-side analysis\
    \ of HPC-generated cosmological data without reliance on external visualization\
    \ pipelines."
  authors: Idunnuoluwa A. Adeniji, Joseph Insley, Michael E. Papka
  board_number: N20
