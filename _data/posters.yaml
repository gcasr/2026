    \ cloud, and edge), and machine learning, with a particular focus on system resilience,\
    \ AI for Science, and data compression for scientific instruments. He received\
    \ his PhD in Electrical Engineering and Computer Science from the University of\
    \ California, Merced, where his dissertation work targeted resilience and fault\
    \ tolerance in HPC. At PNNL he is the Principal Investigator of an LDRD on high-performance\
