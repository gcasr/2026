  long_bio: "Brian Ortiz: Brian Ortiz is graduate student at Loyola University Chicago\
    \ finishing his Master's in Computer Science this spring. He holds a Bachelor\
    \ of Arts in Communication from St. Edward's University and a Bachelor of Science\
    \ in Computer Science from Loyola University of Chicago. Professionally, he currently\
    \ works as a DevSecOps Engineer for Seed LLC. a subsidiary of IonQ. He is a part\
    \ of the AI for Formal Methods Lab at LUC and conducts research related to TLA+\
    \ and Large Language Models. Before attending Loyola, Brian was in the United\
    \ States Marine Corps where he served as an ISR Systems Engineer, a Light Armored\
    \ Vehicle Radio Telephone Operator (RTO), and a signals intelligence watch floor\
    \ chief during the 15 Marine Expeditionary Unit's 2020 deployment to INDOPACOM\
    \ and AFRICOM. His broader interest include system administration, distributed\
    \ systems, and systems engineering.<br/>Arslan Bisharat: I am a PhD researcher\
    \ in Computer Science at Loyola University Chicago, working at the intersection\
    \ of adversarial machine learning, natural language processing, and social computing.\
    \ My research centers on developing AI systems that are not only technically strong,\
    \ but also socially aware and dependable in high-stakes settings.<br/>I am driven\
    \ by a core question: how can we design AI systems that are not just powerful,\
    \ but also safe, fair, and accountable in real-world use? To address this, my\
    \ work spans three interconnected areas: online safety and social dynamics, adversarial\
    \ robustness in distributed AI systems, and reasoning verification in large language\
    \ models.<br/>Eric Spencer: Eric Spencer is a Senior Undergraduate Student majoring\
    \ in Computer Science at the College of Arts and Sciences and minoring in Information\
    \ Systems at the Quinlan School of Business at Loyola University Chicago, graduating\
    \ in May 2026. He is a part of the AI for Formal Methods laboratory at Loyola\
    \ University Chicago and conducts research related to TLA+, the temporal language\
    \ of actions programming language, and Large Language Models (LLMs). He has previously\
    \ held positions as managing interns as a part of Microsoft's partnership with\
    \ Loyola's AI Society (fka Loyola AI Club), a software engineering intern at CCC\
    \ Intelligent Solutions, and a service technician for Loyola's Information Technology\
    \ Services. Public contributions and interests span iOS apps, web development,\
    \ SaaS, programming languages, fine-tuning LLMs, agentic programming, cloud computing,\
    \ and buying domains.<br/>Khushboo Bhadauria: Khushboo Bhadauria is a graduate\
    \ student pursuing a Master\u2019s degree in Computer Science at Loyola University\
    \ Chicago, graduating in December 2026. Her academic interests include artificial\
    \ intelligence, machine learning, natural language processing, data analysis,\
    \ and data engineering. She is a member of the AI for Formal Methods Laboratory\
    \ at Loyola University Chicago, where she contributes to research involving TLA+,\
    \ formal methods, and large language models (LLMs). She has worked on large-scale\
    \ data analysis through big data projects and has developed machine learning and\
    \ natural language processing models through academic coursework. Her broader\
    \ interests include cloud computing and big data systems, with a focus on applying\
    \ practical AI and data-driven solutions to real-world problems.<br/>Anisa Ramos:\
    \ Anisa Ramos is a senior undergraduate student at Loyola University Chicago pursuing\
    \ a Bachelor of Science in Cybersecurity with a minor in Computer Crime and Forensic\
    \ Science, expected to graduate in May 2026. She is a researcher in the AI for\
    \ Formal Methods Lab at Loyola, where she works on projects involving TLA+, large\
    \ language models (LLMs), and formal verification datasets. Her academic interests\
    \ include digital forensics, security analysis, and the intersection of artificial\
    \ intelligence and cybersecurity.<br/>Anisa has gained hands-on experience through\
    \ her internship with Northwestern Medicine on the Clinical Technology team, where\
    \ she works with systems management, troubleshooting, and security-related workflows.\
    \ She has also been actively involved in leadership and mentorship across campus,\
    \ including serving in executive roles within Women in CyberSecurity (WiCyS) and\
    \ Women in Leadership (WILL). Through these roles, she has helped organize technical\
    \ workshops, industry events, and initiatives aimed at increasing accessibility\
    \ and representation in cybersecurity. Her broader interests include network security,\
    \ cloud systems, and applied security research, and she aims to continue advancing\
    \ inclusive and impactful work in the cybersecurity field.<br/>Mohammed Abuhamad:\
    \ I am an assistant professor of Computer Science at Loyola University Chicago\
    \ . I received a Ph.D. degree in Computer Science from the University of Central\
    \ Florida (UCF) in 2020. I also received a Ph.D. degree in Electrical and Computer\
    \ Engineering from INHA University , (Incheon, Republic of Korea) in 2020. I received\
    \ a Master degree in Information Technology (Artificial Intelligence) from the\
    \ National University of Malaysia , (Bangi, Malaysia) in 2013.<br/>I am interested\
    \ in the fields of AI/Deep-Learning Security and Software and Mobile/IoT Security,\
    \ with a focus on ensuring the robustness and privacy of AI models in adversarial\
    \ settings. I work on enhancing machine learning applications in security-critical\
    \ systems, such as autonomous vehicles, robotics, and IoT devices, while ensuring\
    \ privacy and efficiency. I have published several peer-reviewed research papers\
    \ in top-tier conferences and journals such as ACM CCS, PoPETS, IEEE TDSC, IEEE\
    \ TIFS, IEEE IoT-J, and IEEE ICDCS.<br/>Konstantin La\xFCfer: I am a professor\
    \ of computer science at Loyola University Chicago. I majored in physics at the\
    \ University of Konstanz, Germany, and attended Rutgers University, New Jersey,\
    \ as an exchange student. Prior to joining Loyola in 1992, I earned a PhD in computer\
    \ science from the Courant Institute at New York University under the supervision\
    \ of Benjamin F. Goldberg and Martin Odersky.<br/>My research and teaching interests\
    \ include programming languages, software architecture, distributed and pervasive\
    \ computing systems, and data engineering, as well as applications in environmental\
    \ sustainability and other areas of social justice. I co-direct the AI for Formal\
    \ Methods Lab and am affiliated with the Software and Systems Lab (SSL) and the\
    \ Vehicle Technology Lab. My research has been funded by government agencies and\
    \ corporations. I\u2019m a co-inventor on two patents owned by Lucent Technologies,\
    \ where I was a research consultant (1996-2000).<br/>TaiNing Wang: Dr. TaiNing\
    \ Wang is a tenure-track Assistant Professor in the Department of Computer Science\
    \ at Loyola University Chicago. She received her PhD and Bachelor of Computing\
    \ (Highest Distinction) in Computer Science from the National University of Singapore,\
    \ where she was advised by Prof. Chee-Yong Chan. Prior to joining Loyola, she\
    \ was a Postdoctoral Research Fellow at NUS and also held research intern positions\
    \ at Microsoft Research, INRIA, and A*STAR. Her research broadly centers on database\
    \ systems, query processing and optimization, graph data management, applied AI/ML,\
    \ AI accountability, formal methods, and data sampling. Her work emphasizes efficient,\
    \ reliable, and responsible approaches to data management and complex data analysis.\
    \ Dr. Wang's contributions have been recognized through publications in leading\
    \ conferences and journals, including ACM SIGMOD, IEEE ICDE, and Future Generation\
    \ Computer Systems, as well as honors such as the Microsoft Research Asia Fellowship\
    \ and the NUS President Graduate Fellowship. She maintains broad interests in\
    \ both foundational and emerging areas of data systems and is open to interdisciplinary\
    \ collaborations across data, AI, and formal reasoning.<br/>George K. Thiruvathukal:\
    \ Dr. George K. Thiruvathukal is a full professor of computer science at Loyola\
    \ University Chicago and chairperson. His primary research interests span high-performance\
    \ computing, distributed systems, and software engineering. My current research\
    \ foci are on machine learning and computer vision, empirical software engineering\
    \ (in support of research software development), and the intersection of cloud\
    \ computing and supercomputing.<br/>He received the PhD and MS degrees in computer\
    \ science from Illinois Institute of Technology in 1995 and 1990, respectively\
    \ and BA degrees in physics and computer science (mathematics minor) from Lewis\
    \ University (Romeoville, IL) in 1988."
