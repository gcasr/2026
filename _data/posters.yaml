  board_number: R5
  institution: Illinois Institute of Technology, University of Chicago
  long_bio: "Eneko Gonzalez is a Research Software Engineer at the Gnosis Research\
    \ Center (GRC) at the Illinois Institute of Technology, where his work focuses\
    \ on distributed systems for high-performance computing (HPC) and AI infrastructure.\
    \ He is part of the team developing ChronoLog, contributing across system development,\
    \ plugin design, and release engineering. His research interests include distributed\
    \ shared-log systems, AI memory coordination, and the integration of next-generation\
    \ infrastructure into scientific computing workflows. He has represented the lab\
    \ at international venues including PEARC25, where he delivered a hands-on technical\
    \ workshop, and NVIDIA GTC 2025. Eneko holds a Double Master's degree in Computer\
    \ Science (Illinois Institute of Technology) and Telecommunications Engineering\
    \ (University of the Basque Country, Spain), obtained through a formal bilateral\
    \ agreement between the two institutions, as well as a Bachelor's degree in Telecommunications\
    \ Technology Engineering. His earlier work includes research and development on\
    \ 3GPP-compliant mission-critical communications systems with Nemergent Solutions\
    \ S.L. and computer vision research on deep fake detection at IIT's Visual Computing\
    \ Lab.<br/>---------------------------------------------------------------------------------------------------------------------------------------------<br/>Dr.\
    \ Kun Feng is a Research Software Engineer in the Department of Computer Science\
    \ at the Illinois Institute of Technology (Illinois Tech), affiliated with the\
    \ Gnosis Research Center \u2014 the successor to IIT's Scalable Computing Software\
    \ (SCS) Laboratory. He works under the guidance of Dr. Xian-He Sun, a leading\
    \ figure in high-performance computing research.<br/>Dr. Feng's work sits at the\
    \ intersection of HPC systems, storage and I/O optimization, and large-scale data\
    \ management. His published research includes work on intelligent I/O bridging\
    \ for complex distributed workflows, scientific data processing for HPC and Big\
    \ Data applications, and performance modeling for parallel systems. He has been\
    \ a contributor to NSF-funded collaborative research projects and has published\
    \ at venues including the IEEE International Conference on Big Data and the IEEE\
    \ International Conference on Cluster Computing.<br/>As a member of the Gnosis\
    \ Research Center, Dr. Feng contributes to the center's mission of advancing scalable\
    \ system software and data-centric computing infrastructure.<br/>---------------------------------------------------------------------------------------------------------------------------------------------<br/>Inna\
    \ Brodkin is a Senior Software and Data Engineer with extensive experience designing\
    \ scalable, high-performance distributed systems for the Capital Markets and Internet\
    \ industries. Known for her ability to translate complex client requirements into\
    \ robust, maintainable architectures, she brings a strong foundation in Data Science\
    \ and Machine Learning to her engineering work.<br/>Brodkin is currently a Research\
    \ Software Engineer at the University of Chicago, a role she has held since November\
    \ 2022. Prior to this, she served as Lead Software Engineer at Eagle Seven for\
    \ nearly four years, and spent close to five years at Pico, where she rose to\
    \ VP of Big Data Instrumentation and Experimentation. Earlier in her career, she\
    \ held Senior Software Engineer roles at Ketchum Trading and Infinium Capital\
