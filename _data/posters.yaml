- abstract: "CPython 3.13's experimental free-threaded mode removes the Global Interpreter\
    \ Lock (GIL) to enable multi-threaded parallelism. Its centerpiece is biased reference\
    \ counting, which splits each object's refcount into a thread-local field \u2014\
    \ updated without atomics by the owning thread \u2014 and a shared field requiring\
    \ atomics from other threads. The design bets that most objects are accessed primarily\
    \ by their creating thread. No systematic study has characterized when this bet\
    \ pays off. We present an empirical evaluation across the object-sharing spectrum\
    \ using three CPython builds from the same commit: a GIL baseline, a free-threaded\
    \ release build, and a free-threaded instrumented build that decomposes every\
    \ `Py_INCREF` and `Py_DECREF` into its local or shared component. We measure throughput,\
    \ per-object memory overhead, deallocation latency, and cache behavior across\
    \ six object types (dict, list, tuple, slots, int, str). Seven microbenchmarks\
    \ span the sharing spectrum \u2014 thread-local allocation, producer-consumer\
    \ handoff, shared-read, shared-write, mixed-locality, object transfer, thread\
    \ churn \u2014 complemented by five application workloads including a thread-pooled\
    \ web server, parallel parser, and multi-stage pipeline. Thread counts span 1\
    \ to 32, and we parameterize the local-to-shared ratio to find the crossover where\
    \ the bias's overhead exceeds its benefit. Using hardware counters (`perf stat`,\
    \ `perf c2c`), we characterize last-level cache misses and false sharing on refcount\
    \ fields, and measure stop-the-world pause durations and per-object merge costs\
    \ during thread termination \u2014 a previously unmeasured cost of the biased\
    \ scheme. We provide actionable guidance on which concurrency patterns preserve\
    \ biased refcounting's advantages and which inadvertently defeat them.\n\n"
