- abstract: "Modern AI coding agents are capable of software development tasks ranging\
    \ from large greenfield projects to low-level optimizations in production-quality\
    \ codebases. However, these agents are computationally expensive and require specialized\
    \ hardware that typically must be accessed from cloud providers, making token\
    \ efficiency important. A necessary step toward token efficiency is to offload\
    \ work to traditional language tooling\u2014such as compilers, linters, and static\
    \ analyzers\u2014yet this tooling was never designed with AI agents in mind.\n\
    There is currently no systematic method for identifying where existing tools fail\
    \ these agents and how they should be extended. In this work, we propose a workflow\
    \ that applies statistical analysis and LLM-as-a-judge to agent trajectories (the\
    \ reasoning and actions taken when solving a problem) to automatically identify\
    \ these gaps, reducing the need for labor-intensive manual analysis. Applying\
    \ this workflow to Python coding agents, we find that agents manually implement\
    \ common program analyses such as program slicing, and get stuck in loops when\
    \ resolving complex import errors. Both findings indicate absent or inadequate\
    \ tooling support, and our workflow prescribes targeted extensions to Python's\
    \ tooling ecosystem for agent workflows. With this methodology, programming language\
    \ implementers, toolchain designers, and agent framework developers can evaluate\
    \ and extend their tools to better support AI coding agents."
  authors: Tommy McMichen
