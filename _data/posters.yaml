  title: Building Reliable AI Through Explainable AI-Enhanced Training Pipelines
- abstract: 'This project introduces Agentic Orchestrator, a framework for adaptive
    inference routing across heterogeneous compute resources, including edge devices,
    cloud servers, and HPC clusters. For each incoming request, an LLM planner produces
    a service-level task DAG that specifies operations and dependencies without binding
    steps to specific machines. A Thompson-sampling multi-arm contextual bandit then
    routes each step to a concrete worker using task and fleet context, while combining
    quality, latency, and energy signals to reflect user priorities rather than throughput
    alone.


    Human feedback is a central part of the design. Because inference quality judgments
    may be delayed and sparse, deferred ratings are used as high-value supervision
    to calibrate the quality bandit and learn preference-aligned trade-offs across
    quality, speed, and efficiency. Between feedback events, runtime telemetry supports
    continual adaptation as workers join, leave, or degrade, while reward normalization
    and decay mechanisms help maintain stability under non-stationarity. Overall,
    Agentic Orchestrator provides an extensible, feedback-aware foundation for planning
    and executing scientific workflows on heterogeneous AI infrastructure.'
