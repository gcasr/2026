- abstract: "Modern LLMs built on the transformer architecture rely on self-attention.\
    \ To avoid recomputing past representations at each decoding step, inference engines\
    \ maintain a key\u2013value (KV) cache that stores the projected keys and values\
    \ of previously seen tokens. Since self-attention is position-agnostic, models\
    \ inject positional information through Rotary Position Embedding (RoPE), which\
    \ rotates query and key vectors by an angle tied to each token's position, so\
    \ that attention scores depend on the relative distance between tokens. A new\
    \ trend has emerged exploring the usage of Pre-RoPE KV-cache, which defers this\
    \ rotation until attention time, leaving cached keys position-free.\n\nPost-RoPE\
    \ storage remains the universal default across production inference engines today.\
    \ Because every cached key has its position baked in, subsequent attention steps\
    \ read them as-is, yielding efficient decoding. Identical content at different\
    \ positions therefore produces distinct keys and cannot share a cache entry. For\
    \ example, when an agent reads the same file twice, the cache may store two separate\
    \ copies, inflating the memory footprint. The pre-RoPE alternative stores unrotated\
    \ keys and applies RoPE at attention time, adding a per-step rotation overhead\
    \ over every cached key.\n\nWe provide the modeling and analysis of pre-RoPE versus\
    \ post-RoPE storage in vLLM. Our results on Llama-3.2-1B-Instruct show that pre-RoPE\
    \ incurs roughly 33% higher TTFT and 30% lower decode throughput while preserving\
    \ output correctness, quantifying the per-step compute price that position-independent\
    \ caching trades for the possibility of a reduced KV-cache memory footprint."
