- abstract: 'Public blockchains continue to struggle with scalability because improving
    throughput is not as simple as increasing block size or reducing block interval.
    Larger blocks increase validation and transmission cost, while shorter intervals
    raise the likelihood of propagation delays, forks, and stale blocks. These limits
    motivate sharding, where transaction processing is divided across multiple parallel
    shard groups. In this work, we present a configurable SimPy-based discrete- event
    simulator for evaluating sharded blockchain architectures under controlled workload
    and network assumptions. The simulator models mining, verification, inter-shard
    coordination, block dissemination, measured throughput, average block time, and
    communication overhead. Our goal is not to claim production deployment performance,
    but to study scaling trends in a controlled environment. Our simulator achieves
    1.4M TPS at 256 shards under a local datacenter like setup and 0.5M TPS in a global
    WAN setup, showing strong throughput gains from parallel execution. However, the
    gains are not unbounded: beyond a certain number of shards, coordination traffic,
    synchronization, and network overhead begin to dominate, leading to diminishing
    returns.'
