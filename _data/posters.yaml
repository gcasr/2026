  title: 'Beyond Assumptions: Measuring Federated Learning over Real 5G Networks'
- abstract: We introduce a Multi-Agent System (MAS) framework grounded in a Cloud
    Native World Model. The system leverages specialized agents (Config, YAML, Module,
    Docs) coordinated by a Master Agent to systematically decompose, validate, and
    synthesize complex cloud configurations. Compared with traditional ground-truth
    comparison, we implement Dynamic Evaluation via a local Kubernetes environment,
    where automated deployment feedback and schema validation act as the evaluation
    oracle. The Environment-Reflection mechanism enables agents to learn from system
    feedback via a verifier-in-the-loop architecture (VERA), propagating system-level
    configuration error messages to the agent for iterative diagnosis and resolution.
    Our enhanced MAS pipeline improves configuration constraint retention by 18.6%
    over baselines, reduces knowledge staleness errors, and achieves a 73.3% win rate
    in A/B testing for end-to-end deployment success.
  authors: Haozheng Luo, Yimin Wang, Xiangmin Shen, Yan Chen
  board_number: N31
  institution: Northwestern University
  long_bio: '**Haozheng Luo** is a Ph.D. candidate in Computer Science at Northwestern
    University, advised by Prof. Yan Chen. His research focuses on trustworthy and
    efficient foundation models, with an emphasis on AI safety, reasoning efficiency,
    quantization robustness, and alignment. He develops methods for improving the
    reliability of large language and reasoning models under practical deployment
    constraints, including low-precision inference, safety-critical code generation,
    and dynamic evaluation. His work combines model architecture design, representation
    analysis, and empirical evaluation to understand and mitigate failure modes such
    as unsafe reasoning, activation outliers, and attention sink behavior. More broadly,
    his research aims to build foundation models that are not only capable, but also
    robust, efficient, and dependable in real-world systems.<br/><br/>**Yimin Wang**
    is a senior undergraduate student studying Data Science at the University of Michigan
    and Mechanical Engineering at Shanghai Jiao Tong University. Her academic background
    spans data science, engineering, and machine learning, giving her a strong interdisciplinary
    foundation for research at the intersection of intelligent systems and applied
    AI. She will join UCLA as a Computer Science Ph.D. student advised by Prof. Yangruibo
    Ding. Her research interests include trustworthy AI, machine learning systems,
    and the development of reliable foundation-model-based technologies. Through her
    training across both engineering and data-driven disciplines, she aims to design
    intelligent systems that are technically rigorous, practically useful, and robust
    in complex real-world environments.<br/><br/>**Xiangmin Shen** is an Assistant
    Professor in the Department of Computer Science at Hofstra University and co-director
    of the Cybersecurity Innovation & Research Center. He received his Ph.D. in Computer
    Science from Northwestern University, where he worked with Prof. Yan Chen. His
    research focuses on cybersecurity, systems security, and trustworthy computing,
    with interests spanning vulnerability discovery, secure software systems, and
    AI-enabled security analysis. He develops techniques for understanding, detecting,
    and mitigating security risks in modern computing systems. His work combines program
    analysis, empirical security measurement, and machine learning to improve the
    robustness and resilience of software and networked systems. As both a researcher
    and educator, he is committed to advancing practical security technologies and
    training students to address emerging cybersecurity challenges.<br/><br/>**Yan
    Chen** is a Professor of Computer Science at Northwestern University. His research
    spans networking and system security, software security, vulnerability discovery,
    network measurement and diagnosis, and software-defined networking. He has made
    broad contributions to the design, analysis, and protection of networked and distributed
    systems, with an emphasis on identifying real-world vulnerabilities and building
    practical defenses. His work combines rigorous systems research with applied security
    analysis, addressing challenges across Internet-scale measurement, intrusion detection,
    software reliability, and emerging computing infrastructures. He has advised numerous
    graduate students and collaborated widely across academia and industry. Through
    his research and mentorship, he has helped advance the foundations of secure,
    reliable, and trustworthy computing systems.<br/>'
