    \ Georgia Institute of Technology, Atlanta, USA. He is a Fulbright alumnus, an\
    \ IEEE senior member, and an ACM member.<br/><br/>Rajkumar Kettimuthu is a senior\
    \ scientist and group leader at Argonne National Laboratory. He has over 20 years\
    \ of experience leading large-scale R&D efforts in high-performance computing,\
    \ AI for science, scientific workflows, and advanced networking, with a recent\
    \ emphasis on quantum networking and distributed quantum computing. His expertise\
    \ spans architecture design, simulation, performance modeling, and testbed deployment\
    \ for heterogeneous systems. He is a Distinguished Member of ACM, a Senior Member\
    \ of IEEE, co-author of nearly 200 peer-reviewed publications, and a recipient\
    \ of an R&D 100 Award.<br/>"
