  title: 'Jetson Sensor Hub: A Virtual Sensor Telemetry Platform for Real-Time Environmental
    Monitoring'
- abstract: Scaling superconducting quantum processors to the millions of qubits required
    for useful quantum applications is hindered by the prohibitive number of control
    lines needed for qubit control and readout. Time Domain Multiplexing (TDM) mitigates
    this wiring overhead by allowing multiple qubits to share control lines, albeit
    at the cost of reduced parallelism and increased idle time. In this work, we investigate
    the impact of TDM on all the levels in the surface code fault tolerance stack.
    We analyze the effect of multiplexing on syndrome extraction, lattice surgery,
    and magic state distillation. We further evaluate whether multiplexed control
    hardware can also be used for multiplexing syndrome extraction and calibration,
    allowing fault-tolerant execution to continue uninterrupted across the periodic
    recalibration that would otherwise pause execution. Finally, during evaluation,
    we account for realistic demultiplexer switches with limited port-to-port isolation,
    which induce crosstalk on idling qubits sharing the same switch. Together, these
    results enable a systematic analysis of the trade-offs between wiring overhead
    and fault-tolerant performance, providing guidance for the design of scalable
    superconducting fault-tolerant quantum architectures.
  authors: Konstantinos-Nikolaos Papadopoulos, Kaitlin N. Smith, Jakub Szefer
  board_number: N1
  institution: Northwestern University
  long_bio: "Konstantinos-Nikolaos Papadopoulos is a first year PhD student at Northwestern\
    \ University advised by Prof. Jakub Szefer, broadly interested in quantum computing\
    \ architectures and quantum computing security. Before joining Northwestern, he\
    \ obtained his (integrated MSc+BSc) diploma in Electrical and Computer Engineering\
    \ from the National Technical University of Athens, and spend a year working as\
    \ research assistant at NTUA CSLab under Prof. Dionisios Pnevmatikatos. During\
    \ his senior year at NTUA, he was also a visitor at DTU Space investigating hardware-assisted\
    \ fault tolerance techniques for spaceborne processors. In his younger academic\
    \ years he also worked with Prof. Stavros Tripakis on neural network robustness\
    \ formal verification.<br/><br/>Within the scope of quantum computing, Kate Smith\u2019\
    s active areas of research include computer architecture, distributed computing,\
    \ optimized compilation, error mitigation, simulation, and security. Prior to\
    \ joining Northwestern CS in January 2024, Kate was at Infleqtion where she managed\
    \ the software engineering team responsible for maintaining Superstaq, a physics-aware\
    \ quantum compiler, and directed the R&D for projects related to optimized compilation,\
    \ error mitigation, and simulation of quantum\_programs on a wide range of quantum\
    \ technology platforms. From January 2020 to September 2022, Kate was a CQE/IBM\
    \ postdoctoral scholar within the University of Chicago Department of Computer\
    \ Science where she was a member of the Enabling Practical-Scale Quantum Computing\
    \ (EPiQC) group . Kate received a B.S. in Mathematics and a B.S. in Electrical\
    \ Engineering in 2014 and a M.S. in Electrical Engineering in 2015 from Southern\
    \ Methodist University (SMU). In addition, she earned her Ph.D. in Electrical\
    \ Engineering at SMU in December 2019. Kate is a co-author of the 2022 IEEE International\
    \ Symposium on High-Performance Computer Architecture (HPCA) Best Paper, named\
    \ a 2021 MIT EECS Rising Star, and a recipient of the 2021 IEEE Computer Society\
    \ Technical Committee on Multiple Valued Logic (TC-MVL) Kenneth C. Smith Early\
    \ Career Award in Microelectronics. She has co-authored more than 25 peer-reviewed\
    \ papers and has served on many conference technical program committees including\
    \ the IEEE/ACM International Symposium on Microarchitecture (MICRO), ACM/IEEE\
    \ International Symposium on Computer Architecture (ISCA), the IEEE International\
    \ Symposium on High-Performance Computer Architecture (HPCA), and the Design Automation\
    \ Conference (DAC). In 2023, Kate co-organized the Computing Research Association\u2019\
    s Computing Community Consortium Five-Year Update to the Next Steps in Quantum\
    \ Computing Workshop, and in 2022, Kate acted as the Program Chair for the 2022\
    \ International Symposium on Multiple-Valued Logic (ISMVL).<br/><br/>Jakub Szefer\
    \ is an Assistant Professor of Electrical and Computer Engineering at Northwestern\
    \ University and  the Computer Architecture and Security Laboratory (CASLAB) where\
    \ he am fortunate to work with a great group of students. His research broadly\
    \ focuses on computer security, with special interest in architectures and hardware\
    \ for securing computer systems: from classical CPUs, GPUs, and FPGAs, to the\
    \ nascent Quantum Computing systems. Beyond research, Jakub enjoys teaching and\
    \ have previously received the 2021 Ackerman Award for Teaching and Mentoring.\
    \ Jakub Szefer graduated from University of Illinois Urbana-Champaign with B.S.\
    \ degree with highest honors in Electrical and Computer Engineering, and later\
    \ obtained M.A. and Ph.D. degrees from Princeton University in (then) Electrical\
    \ Engineering department. Prior to joining Northwestern University he was a faculty\
    \ in (then) Electrical Engineering department at Yale University. Jakub Szefer\u2019\
    s recent, novel research findings include power side-channel vulnerabilities in\
    \ quantum computer controllers and attacks on reset gates in quantum computers.\
    \ Other exciting research findings include novel Secure TLBs and frameworks for\
    \ security verification of processor caches and whole architectures; hardware\
    \ accelerators for code-based and hash-based post-quantum cryptographic algorithms,\
    \ as well as hardware accelerators for digital signature schemes currently being\
    \ considered for standardization by NIST. He also research security attacks and\
    \ defenses for nascent Cloud FPGA computing paradigm and novel side and covert\
    \ channels in Cloud FPGAs; and DRAM-based Physically Uncloneable Functions."
