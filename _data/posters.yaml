  title: 'qMEMO: Quantum-Resistant Proof-of-Space Blockchain System'
- abstract: Advances in artificial intelligence (AI), particularly large language
    models (LLMs), have demonstrated effectiveness in technical tasks such as software
    engineering and code generation. However, their direct application to scientific
    experiments remain challenging, specifically quantum networks, where strict formalism
    and complex reasoning is demanded.  We introduce Agentic Quantum Network Simulator
    Arena (AQNSA), a framework designed to replicate and extend quantum networking
    research using AI agents. Given an experimental prompt, AQNSA orchestrates a multi-agent
    workflow in which a research agent develops a structured experiment plan and an
    engineering agent translates that plan into executable simulations using the Simulator
    of QUantum Network Communication (SeQUeNCe) framework. To ground agent reasoning
    and support planning and execution, we construct a knowledge graph from the cited
    materials of eight quantum networking studies selected for replication. Domain-expert
    graders evaluate agent reasoning traces, simulations and results. Our results
    investigate the feasibility agentic research workflows for scientific experiments
    in quantum networks.
