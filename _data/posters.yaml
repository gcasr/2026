  title: An Agentic AI Flow for Alert Correlation in Enterprise Networks
- abstract: 'IoT systems are notoriously susceptible to network

    attacks, given their ubiquity and often resource-constrained

    Intrusion Detection Systems (IDS). While various IDS solutions

    have been proposed to secure IoT systems, machine learning

    (ML) and deep neural network (DNN) based techniques are

    of recent focus in this field, given their ability to adapt to

    newer attacks. However, such ML and DNN based IDSs are

    typically classified as heavyweight or lightweight based on their

    resource footprint. While lightweight IDSs are often chosen for

    deployment on IoT and edge devices due to their limited resource

    requirements, their accuracy is typically limited, and improving

    it typically impacts the speed of detection, and vice versa. In

    remedy, we introduce a framework that provides an effective

    tradeoff between accuracy and speed, while keeping AI-based

    IDS models lightweight for IoT Edge deployment. By combining

    edge and cloud support, our self-improving framework achieves

    a precision of 0.92, recall of 1.0, and F1-score of 0.93, providing

    reliable and rapid attack detection while demonstrating signifi-

    cantly faster inference compared to baseline models'
  authors: Mina Habibollahi and Sharief M. A. Oteafy
