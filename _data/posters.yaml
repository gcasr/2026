- abstract: Deploying foundation models on edge hardware requires balancing inference
    capability with strict thermal and energy limits. This work presents a thermal
    characterization of an edge-computing hardware design under sustained AI inference,
    with emphasis on the effect of different power modes and cooling configurations.
    We evaluate workloads that vary by inference frequency, model size, and quantization
    level, and measure the resulting energy consumption and thermal behavior during
    continuous AI operation. Our analysis compares transient and steady-state thermal
    responses across workload and cooling conditions, revealing how workload intensity
    and model configuration interact with hardware cooling capacity. The results highlight
    operating regions where the platform sustains stable inference and regions where
    thermal stress becomes a limiting factor. This study provides insight into the
    thermal robustness of edge hardware for foundation AI model deployment and motivates
    future work on thermal-aware workload scheduling and co-design software through
    hardware.
