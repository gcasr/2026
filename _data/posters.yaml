  title: 'TRAMBA: A Hybrid Transformer and Mamba Architecture for Practical Audio
    and Bone Conduction Speech Super Resolution and Enhancement on Mobile and Wearable
    Platforms'
- abstract: 'Underground mining disasters produce pervasive darkness, dust, and collapses
    that obscure vision and make situational awareness difficult for humans and conventional
    systems. To address this, we propose MDSE, Multimodal Disaster Situation Explainer,
    a novel vision-language framework that automatically generates detailed textual
    explanations of post-disaster underground scenes. MDSE has three-fold innovations:
    (i) Context-Aware Cross-Attention for robust alignment of visual and textual features
    even under severe degradation; (ii) Segmentation-aware dual pathway visual encoding
    that fuses global and region-specific embeddings; and (iii) Resource-Efficient
    Transformer-Based Language Model for expressive caption generation with minimal
    compute cost. To support this task, we present the Underground Mine Disaster (UMD)
    dataset--the first image-caption corpus of real underground disaster scenes--enabling
    rigorous training and evaluation. Extensive experiments on UMD and related benchmarks
    show that MDSE substantially outperforms state-of-the-art captioning models, producing
    more accurate and contextually relevant descriptions that capture crucial details
    in obscured environments, improving situational awareness for underground emergency
    response. The code is at https://github.com/mizanJewel/Multimodal-Disaster-Situation-Explainer.'
  authors: Mizanur Rahman Jewel and Sanjay Madria
  board_number: R11
  institution: Missouri University of Science and Technology, Rolla, MO
  long_bio: "Mizanur Rahman Jewel is a PhD candidate in Computer Science at Missouri\
    \ University of Science and Technology, advised by Dr. Sanjay Madria and working\
    \ as a Graduate Research Assistant in the Wireless to Cloud Computing (W2C) Lab.\
    \ His research sits at the intersection of multimodal AI, computer vision, and\
    \ data fusion, combining LiDAR, thermal imaging, and visual data with vision\u2013\
    language models to generate interpretable situational awareness in underground\
