  title: Evaluation of Loss Functions under Fully Homomorphic Encryption for Multiclass
    Classification
- abstract: "Fully homomorphic encryption (FHE) is a key enabler for privacy-preserving\
    \ machine learning (PPML), allowing inference on encrypted data without exposing\
    \ sensitive inputs. However, compiling PPML workloads under FHE remains challenging:\
    \ packing - encoding ML tensors into ciphertexts, each storing a 1D vector - and\
    \ mapping - transforming ML operators into homomorphic operations such as addition,\
    \ multiplication, and rotation - are tightly coupled, with the chosen packing\
    \ scheme constraining which mappings are valid. Meanwhile, orchestration of rescaling,\
    \ relinearization, and data movement must respect the ciphertext's evolving modulus\
    \ level. Current industry-oriented FHE compilers such as HEIR lack comprehensive\
    \ packing and mapping optimization support and do not target emerging hardware\
    \ accelerators like TPUs.\nWe present a compilation framework, integrated into\
    \ HEIR, that addresses both gaps. First, we introduce intermediate representations\
    \ that describe general packing and mapping choices, enabling effective optimization\
    \ of data layouts while integrating naturally with the existing HEIR infrastructure.\
    \ Second, we develop a new backend targeting CROSS, a TPU acceleration library\
    \ for CKKS. The backend analyzes the generated layouts and mappings and produces\
    \ efficient TPU code through a level-aware context API that encapsulates key generation,\
    \ modulus-aware kernel selection, and accelerator-specific wiring behind a stable\
    \ compiler surface. \nPreliminary experiments on encrypted neural-network inference\
    \ validate our implementation, demonstrating improvements over existing manual\
    \ approaches. The proposed framework can boost various research directions including\
    \ scheduling policies for heterogeneous CPU\u2013TPU pipelines, cross-layer operator\
    \ fusion to reduce memory traffic and launch overhead, and exploration of MPC\u2013\
    FHE hybrid compilation under a unified toolchain"
