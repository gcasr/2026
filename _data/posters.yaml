  title: 'StreamGuard: Low-Overhead Resilience for Real-time HPC Data Streams'
- abstract: "Modern computing systems generate data at unprecedented rates exceeding\
    \ TB/s. This growth is driven by the proliferation of sensors, scientific instruments,\
    \ Internet-of-Things devices, and human activities such as web, mobile, and edge\
    \ computing. Beyond conventional data storage, an increasingly prevalent requirement\
    \ is the capture of activity data, also known as log data, which records events\
    \ as they occur rather than static state. A wide range of domains, including scientific\
    \ applications, depend on high-performance logging methods that existing solutions\
    \ cannot deliver at scale.\n \nChronoLog is a scalable distributed log store designed\
    \ to handle the growing volume of activity data, tailored for applications ranging\
    \ from edge computing to High Performance Computing (HPC) systems. ChronoLog provides\
    \ several capabilities that distinguish it from existing data streaming platforms:\
    \ it guarantees log ordering across distributed nodes using physical time, thereby\
    \ avoiding expensive synchronization operations; employs multiple storage tiers\
    \ to scale log capacity; supports efficient concurrent access to data; and enables\
    \ range queries for partial log processing.\n \nThis poster presents the ChronoLog\
    \ architecture and its principal components\u2014ChronoVisor, ChronoKeeper, ChronoGrapher,\
    \ and ChronoPlayer\u2014together with two representative use cases. The first\
    \ demonstrates live HPC telemetry monitoring, in which system statistics such\
    \ as CPU, memory, and network utilization are logged into ChronoLog and visualized\
    \ through a Grafana plugin developed as a custom data source. The second presents\
    \ the ChronoLog Model Context Protocol (MCP) server, which provides episodic memory\
    \ for Claude Code-based agentic workflows by recording agent behaviors and retrieving\
    \ them via ChronoLog's time-based ordering guarantees."
  authors: Eneko Gonzalez, Kun Feng, Inna Brodkin, Kyle Chard, Anthony Kougkas, Xian-He
