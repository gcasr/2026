  title: Parameterized Algorithms and Parameter Selection for Fast GPU-GPU Collective
    Communication
- abstract: 'Modern blockchains struggle to scale - Bitcoin processes roughly 6 transactions
    per second while Visa handles thousands. Sharding, which splits transaction processing
    across parallel groups of validators, is the most promising path forward. NEAR
    Protocol''s Nightshade sharding design claims to achieve up to one million transactions
    per second, but how well do the simulations that inform such designs actually
    reflect reality?

    This poster presents an ongoing effort to find out. We take a validated discrete-event
    sharding simulator modeled after NEAR''s Nightshade architecture and put its predictions
    to the test by running real sharding experiments on Chameleon Cloud, a bare-metal
    testbed, adapting NEAR''s one-million-TPS benchmark harness from its original
    GCP infrastructure to a scaled-down but representative Chameleon configuration.

    By instrumenting both systems for the same core metrics including throughput,
    confirmation latency, and coordination overhead, we can directly measure the gap
    between what the simulation predicts and what real hardware delivers, and interrogate
    what that gap says about the assumptions sharding models rely on.

    The broader implication is what makes this work matter: if simulations systematically
    misrepresent sharding performance, the field needs to know. If they hold up, they
    become a powerful and accessible tool for guiding protocol design decisions without
    depending on commercial cloud deployments.'
  authors: Om Amith Gandhi, Sohini Sahukar, Dr. Ioan Raicu
  board_number: R3
  institution: Illinois Institute of Technology
  long_bio: 'Sohini Sahukar<br/>Sohini Sahukar is a graduate student in Computer Science
    at Illinois Institute of Technology. She has prior experience as a software engineer,
    where she worked on backend systems and web-based applications. Her interests
    lie in distributed systems, blockchain architectures, and system performance.<br/>She
    is particularly fascinated by consensus mechanisms and the challenges of scaling
    decentralized systems. Her current work focuses on evaluating the gap between
    simulated and real-world performance in blockchain systems, specifically examining
    how accurately sharding simulations reflect actual deployments. By comparing simulation
    results with experiments on real infrastructure, she aims to better understand
    the assumptions and limitations underlying large-scale distributed system design.<br/>Sohini
    is broadly interested in systems that operate at scale and in bridging the gap
    between theoretical models and practical implementations. She is motivated by
    exploring how emerging technologies like Web3 can be made more reliable and efficient
    in real-world settings.<br/><br/>Om Amit Gandhi<br/>Om Amit Gandhi is a Computer
    Science student at the Illinois Institute of Technology in Chicago, with a focus
    on systems-level programming, GPU computing, and blockchain infrastructure. His
    academic coursework spans computer architecture, information security, and parallel
    computing, complemented by a strong hands-on project portfolio. His recent work
    includes VaultxGPU, a CUDA-accelerated Proof-of-Space blockchain plotter achieving
