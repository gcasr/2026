  session: 2
  title: 'Exploring WebGPU as a Platform for Scalable and Portable GPU Computing:
    A Case Study with Set Operations'
- abstract: "Current work on Natural Language-to-SQL (NL2SQL) LLM models and systems\
    \ largely focus on improving end-to-end generation and execution accuracy of SQL\
    \ queries, as measured by popular benchmarks such as BIRD-Bench and Spider. However,\
    \ execution accuracy alone is insufficient in practice because the ground-truth\
    \ correctness is not always known or clear to the data analyst. In our ongoing\
    \ work, we propose LLM SQL verifier as an important part of the NL2SQL workflow.\
    \ \nAt a basic level, verifiers are an LLM-as-a-judge approach to evaluate the\
    \ correctness of the generated SQL queries. They use the natural language, schema,\
    \ and other auxiliary information, but do not involve comparing against ground\
    \ truth as in the above benchmarks. With better verifiers, we can improve the\
    \ generation accuracy for NL2SQL systems, using them as selectors for multiple\
    \ generated queries and thus augmenting prior multiple-generation approaches.\
    \ In a different direction, they can be used to provide a confidence metric in\
    \ real-life database use cases where ground truths are not known to the data analyst,\
    \ which is a point typically neglected in current literature. \nTo this end, we\
    \ present methods to improve the accuracy of verifiers, in particular through\
    \ reinforcement learning (GRPO). Finally, we discuss our work on going beyond\
    \ single model verifiers and building agentic frameworks using verifiers to automate\
    \ NL2SQL generation. We plan to further develop approaches using iterative verification\
    \ and refinement for NL2SQL generation without relying on execution verification.\n"
  authors: Donghyun Sohn, Junho Won
  board_number: N14
  institution: Northwestern University
  number: 115
  room: Northwestern
  session: 2
  title: Improving automatic verification of NL2SQL queries with reinforcement learning
- abstract: "Data-intensive scientific workflows in high-performance computing exchange\
    \ intermediate data between pipeline stages through shared storage such as parallel\
    \ file systems, local SSDs, and burst buffers. Existing workflow schedulers select\
    \ storage to maximize individual task throughput, implicitly assuming that faster\
    \ I/O per task yields faster end-to-end execution. We show this assumption is\
    \ wrong.\nWe present an empirical study across two scientific workflows\u2014\
    genomics and climate tracking\u2014on a production HPC cluster. By benchmarking\
    \ storage systems across operation types, transfer sizes, parallelism levels,\
    \ and data volumes, we uncover two non-obvious findings. First, data movement\
    \ between storage tiers scales fundamentally differently from read and write operations:\
    \ copy throughput plateaus or degrades at parallelism levels where reads and writes\
    \ continue to scale, making cross-tier staging costs unpredictable from standard\
    \ I/O benchmarks. Second, producer-consumer task pairs can exhibit performance\
    \ inversion\u2014configurations that maximize throughput for individual tasks\
    \ introduce costly inter-stage data movement that increases total workflow time\
    \ by up to 6.8x compared to storage-aware alternatives.\nAcross both workflows,\
    \ I/O accounts for 42\u201398% of total execution time, yet the penalty from storage\
    \ mismatches between dependent tasks can exceed the compute cost of the tasks\
    \ themselves. These patterns hold across fundamentally different access profiles,\
    \ from large sequential transfers to metadata-heavy many-small-file workloads.\
    \ Our results demonstrate that producer-consumer data dependencies must be treated\
    \ as first-class constraints in workflow scheduling."
  authors: Meng Tang, Luanzheng Guo, Nathan R. Tallent, Anthony Kougkas, Xian-He Sun
  board_number: N15
  institution: Illinois Institute of Technology
  number: 118
  room: Northwestern
  session: 2
  title: 'The Hidden Cost of Storage Mismatches: Why Faster I/O Per Task Can Slow
    Down Entire Workflows'
- abstract: 'Scalable logic-based analytics are frequently dominated by cyclic multi-way
    joins over large relational datasets. State-of-the-art systems evaluate these
    through chained binary joins, incurring substantial overhead from large intermediate
    relations that must be materialized and redistributed across the network. Worst-Case
    Optimal Joins (WCOJ) offer a provably superior alternative by evaluating joins
    one variable at a time, eliminating intermediate blowup. However, all existing
    WCOJ implementations target shared-memory architectures, making distributed-memory
    execution an open problem. We present two contributions toward parallelizing WCOJ
    on distributed HPC systems: a hypercube partitioning scheme that hash-partitions
    relations along variable-aligned grid dimensions and selectively replicates them
    along missing dimensions to maximize locality, and an iterative semi-naive execution
    pipeline that supports recursive fixpoint computation via MPI collective redistribution
    of newly derived tuples. We evaluate our system on leadership class supercomputers
    Aurora and Polaris at ANL using graph mining and program analysis benchmarks,
    demonstrating strong scalability and outperforming state-of-the-art engines. This
    is the first truly scalable distributed WCOJ framework.'
  authors: Kunting Qi, Yihao Sun, Kristopher Micinski, Sidharth Kumar
  board_number: N16
  institution: University of Illinois Chicago, Syracuse University
  number: 119
  room: Northwestern
  session: 2
  title: Parallel Worst-Case Optimal Joins for Distributed-Memory Systems
- abstract: "Notebooks provide an author-friendly environment for iterative development,\
    \ modular execution, and easy sharing. Distributed workflows are increasingly\
    \ being authored and executed in notebooks, yet sharing and reproducing them remains\
    \ challenging. Even small code or parameter changes often force complete re-execution\
    \ of the distributed workflow, limiting iterative development for such workloads.\
    \ Current methods for improving notebook execution largely operate on single-node\
    \ workflows, while optimization techniques for distributed workflows typically\
    \ sacrifice reproducibility. We introduce NBReplay, an end-to-end system for efficient,\
    \ reproducible execution of distributed workflows in notebooks. NBReplay consists\
    \ of two kernels\u2014audit and repeat\u2014which are based on data-flow analysis\
    \ across cells. The audit kernel avoids redundant computations through task level\
    \ caching and incremental, cell-level checkpointing. The repeat kernel replays\
    \ the cached tasks and\nreconstructs the checkpoints to enable partial re-execution\
    \ of notebook cells that manage distributed workflow. Using real-world case studies,\
    \ we demonstrate that NBReplay significantly improves notebook re-execution, and\
    \ enables portable, cross-site reproducibility of notebook-based distributed workflows\
    \ on HPC systems, while adding minimal overhead in terms of execution time and\
    \ storage space."
  authors: Talha Azaz, Raza Ahmad, Md Saiful Islam, Douglas Thain, and Tanu Malik
  board_number: N17
  institution: University of Missouri, DePaul University, University of Notre Dame,
    University of Missouri, University of Notre Dame
  number: 120
  room: Northwestern
  session: 2
  title: Efficiently Reproducing Distributed Workflows in Notebook-based Systems
- abstract: 'Robotic systems present unique safety challenges due to their complex
    integration of computational and physical processes and direct interaction with
    humans and environments. Traditional approaches to robot safety planning either
    rely on conventional methods, which struggle with the complexity of modern robotic
    systems, or on pure machine learning techniques, which lack formal safety guarantees.
    While recent advances in Large Language Models (LLMs) offer promising capabilities,
    pre-trained LLMs alone lack the specific domain expertise required for effective
    robotic safety planning. This paper introduces SafeNet, a novel neural-symbolic
    network architecture that enhances LLMs'' safety planning capabilities through
    formal method-guided fine-tuning for robotic applications. Our approach integrates
    formal logical knowledge and reward machines into pre-trained LLMs by carefully
    designed fine-tuning, creating a neural-symbolic approach that combines the flexibility
    of neural networks with the precision of formal methods for robot trajectory generation
    and task planning. Experimental results demonstrate significant improvements in
    safe trajectory generation for robotic systems, with planning success rates increasing
    from 1.17\% to 91.60\% for the block manipulation task and from 7.23\% to 90.63\%
    for the robotic path planning task.

    '
  authors: Jialiang Fan, Fanxin Kong
  board_number: N18
  institution: University of Notre Dame
  number: 122
  room: Northwestern
  session: 2
  title: 'SafeNet: A Neural-Symbolic Network for Safe Planning in Robotic Systems
    using Formal Method-Guided LLM Fine-Tuning'
- abstract: "Breadth-First Search (BFS) is a fundamental graph-processing tool underlying\
    \ numerous applications. \nMany such applications require running BFS from multiple\
    \ sources, which we refer to as the Multi-BFS (MBFS) problem. MBFS has been studied\
    \ in various specific applications, such as distance oracles, closeness centrality,\
    \ and eccentricity, among many others. Since each BFS may require traversing the\
    \ entire graph, MBFS is inherently computationally expensive, requiring various\
    \ forms of parallelism to improve performance. \n\nIn this paper, we propose BitFluX,\
    \ a general and efficient parallel MBFS framework, including its algorithms, analysis,\
    \ implementations, and how it can be adapted to a broad range of applications.\
    \ \nWe leverage both thread- and bit-level parallelism, both effectively contributing\
    \ to its high performance. \nWhile MBFS and its parallelization have been studied\
    \ in the literature, prior works are usually tailored to specific use cases. Our\
    \ work decouples the core MBFS algorithm from downstream tasks, making it a primitive\
    \ that is readily extendable to multiple applications. To demonstrate its practical\
    \ utility, we adapt the framework to three example applications: landmark labeling,\
    \ eccentricity, and closeness centrality.\nBased on the framework, we also show\
    \ a general theoretical analysis for MBFS.\n\nWe test the performance of BitFluX\
    \ using both microbenchmarks and end-to-end application comparisons against existing\
    \ work. The microbenchmark results show that our performance gains compound multiplicatively\
    \ compared to prior work using solely bit- or thread-level parallelism, indicating\
    \ highly efficient utilization of each form of parallelism. For the applications,\
    \ our general framework is competitive and often outperforms baselines tailored\
    \ for these applications. \n\n"
  authors: Letong Wang; Yan Gu; Yihan Sun
  board_number: N19
  institution: DePaul University; UC Riverside
  number: 124
  room: Northwestern
  session: 2
  title: 'Parallel Batch Breadth-First Search: Framework and Applications'
- abstract: 'Tiny Machine Learning (TinyML) algorithms, designed to operate on constrained
    devices such as those found in Internet of Things (IoT) systems, are vulnerable
    to adversarial threats, including fault injection attacks. These attacks exploit
    physical means to induce errors in computation, compromising the reliability of
    the device and the TinyML models running on it. This work investigates the operation
    of TinyML models under fault injection attacks. Through systematic experimentation
    with voltage glitching and EM fault injection attacks on microcontrollers, this
    work identifies

    configurations that adversaries can exploit to induce faults without triggering
    a system reset, thus focusing on finding the more stealthy attacks. This study
    analyzes four types of TinyML models, and demonstrates that all four evaluated
    TinyML models will generate inference outputs with reduced accuracy under the
    two types of fault injection attacks. Further, in some instances, this work shows
    that it  may be feasible for the attackers to use the faults to cause inference
    operations to return a predictable output, not just random incorrect inference
    results. This highlights the need for more robust fault injection protection mechanisms
    in TinyML implementations. In order to provide one such protection, this work
    demonstrates the use of Randomized Self-Reduction (RSR) schemes and majority voting
    for intermediate values as a means to protect the TinyML models.'
  authors: Anthony Etim, Srilalith Nampally, Aubtin Rasouli, Dustin Mazza, Krishna
    Chilakapati, Tinghung Chiu, Ferhat Erata, Leyla Nazhandali, Wenjie Xiong and Jakub
    Szefer
  board_number: N20
  institution: Yale University
  number: 125
  room: Northwestern
  session: 2
  title: Fault Injection Attacks and Countermeasures on TinyML Algorithms
- abstract: "Moving Target Defense (MTD) is a proactive security paradigm designed\
    \ to increase uncertainty and complexity for attackers by constantly changing\
    \ a system\u2019s attack surface. Despite its potential, deploying MTD in complex\
    \ computation environments remains challenging due to the manual overhead required\
    \ for strategy formulation and the risk of operational disruption.\nAs large language\
    \ models (LLMs) rapid advance, it has shown positive results in many security\
    \ applications. This paper introduces a novel framework, AI-driven MTD, which\
    \ leverages the reasoning and generative capabilities of LLMs to automate the\
    \ lifecycle of MTD strategies. Our approach utilizes LLMs to interpret security\
    \ requirements and automatically generate executable configurations for diverse\
    \ infrastructure layers. Specifically, the framework orchestrates dynamic network\
    \ topology restructuring, automated firewall rule reconfiguration, and adaptive\
    \ load balancing adjustments. By bridging the gap between high-level defensive\
    \ intent and low-level system execution, our method enables an autonomous transition\
    \ among different MTD strategies. Preliminary results indicate that LLM-driven\
    \ orchestration significantly reduces the window of opportunity for adversaries\
    \ while minimizing the manual burden on security administrators. This research\
    \ represents a critical step toward autonomous, self-evolving cyber defenses,\
    \ demonstrating the viability of LLMs in managing complex, real-time infrastructure\
    \ mutations within productive environments"
  authors: Qurat ul ain Khalid , Li Wang
  board_number: N22
  institution: Northeastern Illinois University
  number: 128
  room: Northwestern
  session: 2
  title: AI-driven Moving Target Defense
- abstract: "Safe Reinforcement Learning (safe RL) has been widely used in safety-critical\
    \ cyber-physical systems (CPS) to achieve task goals while satisfying safety constraints.\n\
    Analyzing vulnerabilities that can be exploited to violate safety (i.e., safety-violated\
    \ vulnerabilities) is crucial for understanding and improving the robustness of\
    \ safe RL policies in CPS.\nHowever, existing works are inadequate for addressing\
    \ such vulnerabilities, as they either focus on vulnerabilities that merely degrade\
    \ task performance (rather than causing safety violations) or rely on strong assumptions\
    \ about an adversary\u2019s capability (e.g., requiring explicit knowledge of\
    \ the safety constraints).\nThis paper aims to bridge this gap by studying safety-violated\
    \ vulnerabilities of safe RL in CPS without requiring prior knowledge of the underlying\
    \ safety constraints.\nTo this end, we propose a novel adversarial framework based\
    \ on Signal Temporal Logic (STL) mining.\nThe framework first mines STL formulas\
    \ to uncover the implicit safety constraints of a safe RL policy, and then synthesizes\
    \ perturbation attacks that violate these constraints. The generated attacks can\
    \ effectively and efficiently induce safety violations by adapting perturbations\
    \ and identifying critical time intervals for applying them. We conduct extensive\
    \ experiments across multiple CPS environments, and the results demonstrate the\
    \ effectiveness and efficiency of our method."
  authors: Jialiang Fan, Shixiong Jiang, Mengyu Liu, Fanxin Kong
  board_number: N23
  institution: University of Notre Dame
  number: 129
  room: Northwestern
  session: 2
  title: Vulnerability Exploration of Safe Reinforcement Learning in Cyber-Physical
    Systems via STL Mining
- abstract: "Modern AI workloads are increasingly trained on clusters with hundreds\
    \ to thousands of accelerators, such as GPUs. These accelerators are interconnected\
    \ by high-speed fabrics, and a significant portion of training time is spent on\
    \ communication rather than computation, synchronizing gradients across devices\
    \ through collective operations such as All-Reduce, All-Gather, and Reduce-Scatter.\n\
    Current collective communication libraries for distributed machine learning remain\
    \ bound by a fixed set of predefined collective algorithms. Such constraints severely\
    \ limit the potential for communication optimization, particularly in modern clusters\
    \ with increasingly heterogeneous and asymmetric network topologies. We use a\
    \ data structure called the Time Expanded Network (TEN), which represents communication\
    \ by unfolding the physical topology into discrete time steps and connecting nodes\
    \ across successive time steps with edges that represent bandwidth and latency.\
    \ In this framework, TEN serves as the basis for the synthesis of topology-aware\
    \ collective schedules: it supports the decision-making about when a chunk can\
    \ move, which path it can take, and which transfers can proceed concurrently.\
    \ \nBeyond the existing single-application research, our framework is being extended\
    \ to support multi-tenant workloads in which multiple jobs concurrently share\
    \ the network. This makes it a practical platform for studying collective communication\
    \ not only in isolation, but also under the concurrent conditions common in real\
    \ shared AI clusters.\n"
  authors: Animesh Saxena, Ratul Sikder, Balajee Vamanan
  board_number: N24
  institution: University of Illinois Chicago
  number: 137
  room: Northwestern
  session: 2
  title: Multi-Tenant Framework for Collective Communication Scheduling in Shared
    Clusters
- abstract: 'Underground mining operations are increasingly dependent on

    autonomous vehicles, robotic drilling systems, and intelligent in-

    spection platforms operating in confined, GPS-denied tunnel en-

    vironments. These systems rely on distributed perception models

    to interpret navigation cues, hazard warnings, and environmen-

    tal signals in real time. While centralized deep learning can en-

    hance model performance, transferring raw operational data across

    mining sites introduces serious confidentiality and security risks.

    Federated Learning (FL) offers a privacy-preserving alternative by

    enabling collaborative model training without sharing local datasets.

    However, deploying FL in underground mining introduces several

    critical challenges: (i) Training labels may be modified either mali-

    ciously by compromised clients or inadvertently due to harsh un-

    derground conditions like such as low illumination or physical dis-

    tortion of safety signs. Such alterations can result in label-flipping

    (LF) attacks, wherein corrupted semantic information propagates to

    the global model through poisoned local updates. (ii) Mining data

    is inherently heterogeneous and non-IID due to variations in tun-

    nel shapes or uneven terrains, making malicious updates difficult

    to distinguish from natural distribution shifts. (iii) Underground

    communication networks are bandwidth-constrained, limiting the

    feasibility of computationally intensive cryptographic defenses or

    repeated validation procedures. To address these challenges, we pro-

    pose TrustFed, a lightweight and unsupervised defense framework

    tailored for underground mining environments. TrustFed first fil-

    ters client updates by detecting abnormal last-layer gradient norms

    and then performs clustering in gradient space to identify adver-

    sarial behavior. Clients are assigned adaptive trust scores based

    on their proximity to cluster centroids, and global aggregation is

    conducted using a soft trust-weighted mechanism that suppresses

    malicious contributions while preserving informative updates. To

    facilitate realistic evaluation, we further introduce MineSigns, a

    vision-based dataset capturing 13 safety-critical signage classes

    under authentic tunnel conditions, including low illumination and structural irregularities.
    Extensive experiments on MineSigns and

    standard benchmarks demonstrate that TrustFed effectively miti-

    gates LF attacks and significantly improves global model robustness

    under both IID and non-IID mining scenarios. '
  authors: Md. Sazedur Rahman and Sanjay Madria
  board_number: N25
  institution: Missouri University of Science and Technology, Rolla, MO.
  number: 139
  room: Northwestern
  session: 2
  title: Label-Flip Attack Detection via Trust-Weighted Aggregation in Federated Learning
    for Underground Mine Security
- abstract: 'We present NOMAD, a framework for scalable time-series retrieval under
    arbitrary, potentially non-metric distance functions. Rather than assuming a fixed
    embedding space or metric index, NOMAD treats the user-provided distance function
    F as the source of task-specific similarity. Given F''s implementation and documentation,
    an LLM helps infer symbolic structure, invariances, sensitivities, and candidate
    conversion logic for mapping raw time series into a controlled language representation.
    These candidates are evaluated against F through an iterative calibration loop,
    where retrieval failures guide refinement until the representation sufficiently
    preserves F-neighborhoods. Search then proceeds in two stages: efficient candidate
    recall over the calibrated representation, followed by exact reranking with F.
    This design offers a general path toward indexing domain-specific distance functions
    while keeping F as the final oracle for correctness.'
  authors: Zheng Zhang, Andrew Crotty
  board_number: N26
  institution: Northwestern University
  number: 140
  room: Northwestern
  session: 2
  title: 'NOMAD: LLM-Guided Indexing for Non-Metric Time-Series Search'
- abstract: 'This project presents the development of an AI-based everyday health
    companion designed

    to help individuals monitor and better understand their daily well-being. The
    system allows

    users to log health-related data such as mood, stress levels, sleep patterns,
    symptoms, and

    lifestyle habits through an interactive interface.

    The primary objective is to convert user-generated data into meaningful, personalized

    insights. To achieve this, the system utilizes lightweight artificial intelligence
    techniques,

    including Natural Language Processing (NLP) to extract relevant health indicators
    from

    unstructured text inputs, and rule-based models combined with time-series analysis
    to

    identify behavioral and emotional trends over time. These approaches enable the
    detection

    of patterns such as increasing stress, declining mood, and irregular sleep cycles.

    Based on these patterns, the system generates personalized insights along with
    a risk

    assessment score, helping users recognize potential areas of concern. While the
    system is

    not intended for medical diagnosis, it focuses on predictive and preventive support
    by

    identifying correlations between habits and well-being outcomes.

    The application is built using a full-stack architecture, consisting of a FastAPI
    backend, a

    Streamlit-based frontend, and a PostgreSQL database hosted on Supabase, enabling
    realtime interaction and scalable data management.

    Future work includes enhancing predictive capabilities using machine learning
    models,

    improving personalization through adaptive user baselines, and expanding the system
    to

    incorporate more advanced health metrics for deeper insight generation.'
  authors: Naila Faiz, Dr Yi Yang
  board_number: N27
  institution: Northeastern Illinois University
  number: 141
  room: Northwestern
  session: 2
  title: AI-based Health Companion
- abstract: 'The proliferation of paper mills, organizations that produce fraudulent
    scientific manuscripts for profit, poses a growing threat to the integrity and
    reliability of academic publishing. Detecting such publications remains challenging
    because paper-mill articles often imitate legitimate research structures, language,
    and citation patterns. This work explores an artificial intelligence approach
    to support scientific integrity by identifying potential paper-mill publications
    using natural language processing (NLP) and scholarly metadata.

    Our research is currently in progress and focuses on building a large-scale dataset
    combining suspicious and legitimate scientific publications. Retracted papers
    associated with potential paper-mill activity are collected from publicly available
    retraction databases, while a large set of non-retracted academic papers is being
    gathered through the OpenAlex snapshot API server to represent legitimate scientific
    output. These datasets are used to construct a binary classification task distinguishing
    fraudulent or suspicious publications (positive class) from legitimate research
    papers (negative class).

    To model textual patterns in scientific writing, we are fine-tuning a BERT-based
    transformer model to analyze article titles, abstracts, and related textual content.
    In addition to linguistic signals captured through NLP, selected scholarly metadata
    features are incorporated to capture structural patterns that may be indicative
    of paper-mill production.

    By combining transformer-based language representations with metadata analysis,
    this project aims to identify subtle signals of fraudulent publication practices.
    The long-term goal is to develop AI-assisted tools that can help editors, publishers,
    and research integrity investigators prioritize suspicious manuscripts for further
    review and strengthen safeguards for scientific publishing.'
  authors: Alessandra Valentina Vellucci Solari / Emil Shahbazov
  board_number: N28
  institution: Loyola University Chicago
  number: 142
  room: Northwestern
  session: 2
  title: 'AI for Scientific Integrity: Detecting Paper-Mill Publications Through NLP
    and Scholarly Metadata'
- abstract: "Parkinson\u2019s disease (PD) severity assessment tra-\nditionally relies\
    \ on clinical visits, while continuous, privacy-\npreserving monitoring remains\
    \ an open challenge. Federated\nLearning (FL) addresses this by training a shared\
    \ global model\nacross distributed devices, where each device trains on its own\
    \ data\nand shares only model updates, never raw recordings. This work\ninvestigates\
    \ FL for PD severity estimation using wearable force-\nplate gait signals from\
    \ the PhysioNet Gait in Parkinson\u2019s Disease\ndataset, which contains recordings\
    \ from 93 PD patients and 73\nhealthy controls walking at self-selected pace on\
    \ level ground.\nSixteen force sensors beneath each foot captured vertical ground\n\
    reaction forces at 100 Hz, producing variable-length multivariate\ntime series\
    \ per subject. We treat each subject as an isolated client,\na naturally non-IID\
    \ setting reflecting real-world deployment where\npatient recordings never leave\
    \ the individual device, and train an\nLSTM regression model using the Flower\
    \ framework with FedAvg\naggregation. We present results demonstrating that meaningful\n\
    severity estimation is achievable under these privacy-preserving\nconstraints.\
    \ As a secondary effort, we explored voice-based severity\nestimation using four\
    \ aggregated public datasets, which surfaced\nfundamental challenges in federation\
    \ design stemming from the\nabsence of natural client boundaries and label scarcity."
  authors: Rijul Sareen, Nathaniel Hudson
  board_number: N29
  institution: Illinois Institute of Technology, Argonne National Laboratory
  number: 145
  room: Northwestern
  session: 2
  title: "Personalized Detection of Motor Symptoms in Parkinson\u2019s Disease with\
    \ Federated Learning"
- abstract: "Federated Learning (FL) deployments using IoT devices is an area that\
    \ is poised to significantly benefit from advances in NextG wireless. We deployed\
    \ a FL application using a 5G-NR Standalone (SA) testbed with open-source and\
    \ Commercial Off-the-Shelf (COTS) components. The 5G testbed architecture consists\
    \ of a network of resource-constrained edge devices, namely Raspberry Pis, and\
    \ a central server equipped with a Software Defined Radio (SDR) and running O-RAN\
    \ software. Our testbed allows edge devices to communicate with the server using\
    \ WiFi and Ethernet instead of 5G. FL is deployed using the Flower FL framework,\
    \ for which we developed a comprehensive instrumentation tool to collect and analyze\
    \ diverse communications and machine learning performance metrics including model\
    \ aggregation time, downlink transmission time, training time, and uplink transmission\
    \ time. Leveraging these measurements, we performed a comparative analysis of\
    \ the FL application across three network interfaces\u20135G, WiFi, and Ethernet\u2013\
    as well as across 5G bandwidths and uplink-downlink scheduling ratios. Our experimental\
    \ results challenge some common assumptions about communication time in FL over\
    \ wireless and address the potential pitfalls of these assumptions. We find that\
    \ there is a consistent straggler in about 70% of trials, while in the other 30%,\
    \ high communication time causes competing stragglers. We also compare FL performance\
    \ over 5G with and without external congestion and compare our testbed to commercial\
    \ 5G to validate our findings in a broader context. For reproducibility, we have\
    \ open-sourced our FL application, instrumentation tools, and testbed configuration."
  authors: Robert J. Hayek, Kayla Comer, Joaquin Chung, Chandra R. Murthy, Rajkumar
    Kettimuthu, Igor Kadota
  board_number: N30
  institution: Argonne National Laboratory, Northwestern University, Indian Institute
    of Science
  number: 146
  room: Northwestern
  session: 2
  title: 'Beyond Assumptions: Measuring Federated Learning over Real 5G Networks'
- abstract: We introduce a Multi-Agent System (MAS) framework grounded in a Cloud
    Native World Model. The system leverages specialized agents (Config, YAML, Module,
    Docs) coordinated by a Master Agent to systematically decompose, validate, and
    synthesize complex cloud configurations. Compared with traditional ground-truth
    comparison, we implement Dynamic Evaluation via a local Kubernetes environment,
    where automated deployment feedback and schema validation act as the evaluation
    oracle. The Environment-Reflection mechanism enables agents to learn from system
    feedback via a verifier-in-the-loop architecture (VERA), propagating system-level
    configuration error messages to the agent for iterative diagnosis and resolution.
    Our enhanced MAS pipeline improves configuration constraint retention by 18.6%
    over baselines, reduces knowledge staleness errors, and achieves a 73.3% win rate
    in A/B testing for end-to-end deployment success.
  authors: Haozheng Luo, Yimin Wang, Xiangmin Shen, Yan Chen
  board_number: N31
  institution: Northwestern University
  number: 147
  room: Northwestern
  session: 2
  title: Foundational Agent Pipeline for Cloud Infrastructure Configuration
- abstract: "Recent work has shown that implicit neural representations (INRs) can\
    \ be trained to effectively compress structured and unstructured volume data,\
    \ allowing for direct data querying with a reduced memory footprint. However,\
    \ as existing INRs for unstructured volumes do not encode geometry, they require\
    \ partial mesh storage for later sampling, limiting achievable compression. At\
    \ the same time, novel view synthesis methods have shown that explicit collections\
    \ of 3D Gaussians can be used to accurately visualize volume data. In this work,\
    \ we introduce an explicit model for volume data compression based on 3D Gaussian\
    \ primitives. We reinterpret collections of 3D Gaussians as an explicit representation\
    \ of a volume\u2019s scalar field and use a sampling strategy that reconstructs\
    \ scalar values at spatial locations through weighted aggregation of intersecting\
    \ Gaussians. We develop optimized CUDA-accelerated pipelines for structured and\
    \ unstructured model sampling, loss functions that encourage accurate domain encoding\
    \ by our models, and a novel sampling-error based densification strategy. Our\
    \ explicit formulation naturally encodes domain geometry, eliminating the need\
    \ for mesh storage in unstructured volumes and introducing significantly higher\
    \ compression opportunities. Compared to existing INRs, we demonstrate that our\
    \ explicit model achieves competitive reconstruction quality with significant\
    \ training speedups on structured volumes, while markedly outperforming in all\
    \ metrics on unstructured volumes."
  authors: Landon Dyken, Sidharth Kumar
  board_number: N32
  institution: University of Illinois Chicago
  number: 151
  room: Northwestern
  session: 2
  title: Efficient Compression of Structured and Unstructured Volumes via Learned
    3D Gaussian Representation
- abstract: 'Indoor positioning remains challenging due to the absence of GPS and
    the variability of Bluetooth Low Energy (BLE) signals. RSSI measurements are inherently
    noisy and unstable, making distance-based localization methods unreliable in indoor
    environments.

    This work presents an indoor positioning system that models BLE signals as fixed-length
    vectors and estimates user location using similarity-based matching. Instead of
    converting RSSI values into distance, the system captures signal patterns across
    multiple beacons and compares them with precomputed fingerprint vectors corresponding
    to spatial grid cells. Cosine similarity is used to identify the most likely location,
    making the approach robust to signal variability.

    The system is implemented as a microservice-based architecture. Edge devices collect
    BLE, QR, and NFC data and send them to a central service, where positioning is
    computed and location-based content is delivered in real time. QR and NFC interactions
    provide high-confidence signals, while BLE provides continuous observations.

    Fingerprint vectors are generated using a signal propagation model, eliminating
    the need for manual data collection. The system is deployment-agnostic and can
    be applied to new environments by updating configuration files such as beacon
    positions and layout, without modifying core logic.

    A simulation environment is used to generate realistic user interactions and evaluate
    system behavior. The system provides a foundation for future work in adaptive
    fingerprint refinement, multi-modal data integration, and uncertainty-aware localization.

    '
  authors: Ariunaa Tsegmed, Ahmed Khalid
  board_number: N33
  institution: Northeastern Illinois University
  number: 152
  room: Northwestern
  session: 2
  title: Deployment-Agnostic Indoor Positioning Using BLE-Based Localization in Smart
    Spaces
- abstract: Edge computing platforms are being employed for a wide range of use cases,
    but strict resource constraints can hamper the capabilities of such platforms.
    Particularly, as the machine learning model sizes and dataset footprints continue
    to grow, the inefficiencies of conventional computing hardware become intolerable
    for a range of edge applications (e.g., UAVs, XR, smart sensing). In recent years,
    there has been significant research on using in-memory computing (IMC; a.k.a.
    processing-using-memory) to deliver multi-order-of-magnitude improvements in ML
    inference. However, existing IMC approaches introduce a significant number of
    computation errors that, while tolerable for several uses of inference, are barriers
    to safety-critical applications and to in-the-field training. We present a summary
    of work going on in the ARCANA Research Group at Illinois over the last year,
    where three separate research thrusts are working to overcome the reliability
    issues of IMC to make it practical for a much broader spectrum of edge applications.
    First, we are developing a new hybrid IMC architecture that combines analog IMC
    for inference with more error-resilient Boolean IMC operations. Second, we are
    developing a chip-scale architecture that uses new emerging memories (ECRAM) to
    enable in-the-field continual learning, with a focus on SLAM. Third, we are working
    with device-level experts to co-design error correction techniques that can bring
    IMC error rates closer to those of conventional CPUs.
  authors: Ryan Wong, Nabila Tasnim, Arjun Tyagi, Qingyuan Liu, Karan Annam, Saugata
    Ghose
  board_number: N34
  institution: University of Illinois Urbana-Champaign
  number: 153
  room: Northwestern
  session: 2
  title: Improving Edge AI Efficiency With High-Accuracy In-Memory Computing
- abstract: Edge computing has emerged as a transformative paradigm for processing
    data at its source the Electronic Visualization Laboratory at the University of
    Illinois Chicago has been exploring edge computing applications through the SAGE
    ecosystem, with particular focus on AI-driven spatial analytics. Traditional pedestrian
    tracking systems typically stream video to centralized servers for processing,
    raising privacy concerns and requiring substantial network bandwidth. We introduce
    Edge Computing in a system that tracks walking directions in real time using NVIDIA
    Jetson Developer Kits. By processing AI locally instead of in the cloud, the system
    then identifies movement but deletes all video to keep data private.
  authors: 'Michael Cortez, Elizabeth Cardoso, Fatima Mora Garcia, Om Patel, , JD
    Pritle, Project Supervisor: Dr. M Papka'
  board_number: N35
  institution: University of Illinois at Chicago, EVL, Argonne, SAGE
  number: 155
  room: Northwestern
  session: 2
  title: 'Directional Pedestrian Flow Analysis Using Edge Computing: An Educational
    Framework for AI-Driven Spatial Analytics'
- abstract: 'Deploying vision-language models (VLMs) on edge systems requires balancing
    performance with constrained memory, power, and compute resources, particularly
    in heterogeneous research environments such as the NSF SAGE testbed. SAGE supports
    large-scale environmental and urban sensing for the scientific community, where
    image-to-text capabilities enable on-device summarization without transmitting
    raw visual data. In this setting, selecting an appropriate model requires understanding
    not only system-level performance, but also how accurately models describe visual
    content under deployment constraints.

    In this work, we present a unified evaluation of compact VLMs that jointly considers
    deployment efficiency and semantic correctness. We evaluate six officially distributed
    Ollama models (moondream:1.8b-v2, qwen3-vl:2b, qwen2.5vl:3b, llava-phi3:3.8b,
    gemma3:4b, and minicpm-v:8b) at uniform Q4_K_M quantization across two heterogeneous
    edge platforms: a Dell Pro Max GB10 and an NVIDIA Jetson Thor. Models are tested
    using a standardized five-task vision workload over a 100-image COCO val2017 sample,
    measuring latency, throughput, GPU power, energy, and output reliability.

    To complement these deployment metrics, we introduce a lightweight, object-grounded
    semantic analysis that compares generated outputs against COCO entity annotations
    to assess alignment with ground-truth content. This provides a practical proxy
    for output quality by estimating how consistently models identify relevant objects
    across deterministic (temperature=0) generations. We additionally evaluate cross-device
    reproducibility by computing semantic similarity between paired outputs from the
    same model on different hardware, providing a measure of how reliably outputs
    transfer across the heterogeneous SAGE node fleet.

    By integrating system performance with semantic correctness and cross-device reproducibility,
    we enable a joint analysis of accuracy and efficiency trade-offs across models
    and devices. Our results highlight meaningful variation in both deployment cost
    and semantic fidelity across compact VLMs, underscoring the importance of evaluating
    both dimensions when selecting models for scientific edge deployments.'
  authors: Micheal E Papka, Fatima Mora Garcia, Alejandra Rios
  board_number: N36
  institution: University of Illinois Chicago
  number: 158
  room: Northwestern
  session: 2
  title: A Joint Evaluation of Deployment Efficiency and Semantic Accuracy in Compact
    Vision-Language Models on Edge Systems
- abstract: This poster will explore a new novel method to detect whether a video
    is real or fake based on facial recognition. The dataset consists of videos of
    celebrities so a baseline of their face is easy to obtain for the ground truth.
    We utilize state of the art facial recognition algorithm to detect whether a face
    in a celebrity can be recognized in a video. The intuition is that the face would
    be detected in a real video but would not be detected in a deepfake video.
  authors: Khalidou Bass, Daniel Moreira, Florence Chee, Eric Chan-Tin
  board_number: N37
  institution: Loyola University Chicago
  number: 159
  room: Northwestern
  session: 2
  title: Deepfake Video Detection
- abstract: "Quantum layout synthesis (QLS) maps logical quantum circuits onto hardware\
    \ with limited qubit connectivity by inserting SWAP gates to satisfy nearest-neighbor\
    \ constraints. Although exact QLS methods can produce optimal solutions, they\
    \ scale poorly, while heuristic methods are more scalable but often incur large\
    \ routing overheads. We propose Analytical Quantum Layout Synthesis (Analytical\
    \ QLS), a differentiable optimization framework that models layer-wise qubit mappings\
    \ as the central optimization variables. Our method formulates each layer\u2019\
    s routing cost using qubit interaction and hardware distance matrices, and introduces\
    \ inter-layer consistency penalties to reduce additional routing between adjacent\
    \ layers. Discrete placement matrices are relaxed into doubly stochastic matrices\
    \ through a Sinkhorn layer, enabling gradient-based optimization with Nesterov\u2019\
    s accelerated gradient descent. A post-processing step then projects the relaxed\
    \ solutions back to valid mappings and inserts SWAPs between layers. Across benchmark\
    \ circuits, Analytical QLS outperforms prior methods on 86% of cases, reducing\
    \ SWAP count by 45% on average and by up to 90% in the best case, while showing\
    \ stronger scalability on large circuits than widely used heuristic approaches.\
    \ Our results demonstrate that analytical optimization is a compelling alternative\
    \ to traditional exact and heuristic QLS techniques for near-term superconducting\
    \ quantum devices."
  authors: Yuchen Zhu, Nikos Hardavellas
  board_number: R1
  institution: Northwestern University
  number: 82
  room: Rock
  session: 2
  title: Analytical Quantum Layout Synthesis
- abstract: High-performance collective communication among GPUs in modern supercomputers
    is crucial for enabling many applications. Complex hierarchical interconnects
    between GPU devices necessitate collective algorithms that can effectively leverage
    the underlying network topology. We present parameterized algorithms for two GPU-to-GPU
    collectives, Allgather and Allreduce, as well as an optimized permutation kernel
    used to further enhance GPU collective communication. By employing a LogGP-based
    model calibrated with real machine measurements, we can efficiently simulate various
    parameter choices to identify optimal settings for specific device allocations
    and message sizes. We perform a comprehensive evaluation on NCSA Delta and further
    assessment on Argonne Polaris supercomputers. We demonstrate, through Delta, that
    our parameterized algorithms can achieve, on average, a 20% speedup over their
    non-parameterized counterparts, with our parameter selection process capturing
    98% of the potential speedup.
  authors: Peizhi Liu, Sean Rhee, Michael Wilkins, Peter Dinda
  board_number: R2
  institution: Northwestern University, New York University, Cornelis Networks
  number: 97
  room: Rock
  session: 2
  title: Parameterized Algorithms and Parameter Selection for Fast GPU-GPU Collective
    Communication
- abstract: 'Modern blockchains struggle to scale - Bitcoin processes roughly 6 transactions
    per second while Visa handles thousands. Sharding, which splits transaction processing
    across parallel groups of validators, is the most promising path forward. NEAR
    Protocol''s Nightshade sharding design claims to achieve up to one million transactions
    per second, but how well do the simulations that inform such designs actually
    reflect reality?

    This poster presents an ongoing effort to find out. We take a validated discrete-event
    sharding simulator modeled after NEAR''s Nightshade architecture and put its predictions
    to the test by running real sharding experiments on Chameleon Cloud, a bare-metal
    testbed, adapting NEAR''s one-million-TPS benchmark harness from its original
    GCP infrastructure to a scaled-down but representative Chameleon configuration.

    By instrumenting both systems for the same core metrics including throughput,
    confirmation latency, and coordination overhead, we can directly measure the gap
    between what the simulation predicts and what real hardware delivers, and interrogate
    what that gap says about the assumptions sharding models rely on.

    The broader implication is what makes this work matter: if simulations systematically
    misrepresent sharding performance, the field needs to know. If they hold up, they
    become a powerful and accessible tool for guiding protocol design decisions without
    depending on commercial cloud deployments.'
  authors: Om Amith Gandhi, Sohini Sahukar, Dr. Ioan Raicu
  board_number: R3
  institution: Illinois Institute of Technology
  number: 101
  room: Rock
  session: 2
  title: 'Shards on a Shoestring: Putting Blockchain Sharding Simulations to the Test'
- abstract: "Diversification of digital applications and workloads has driven the\
    \ development of diverse datacenter architectures on ever-larger scales. These\
    \ datacenters consist of complex IT, power, and cooling systems with interdependencies\
    \ that influence configuration and performance. As datacenters scale and power\
    \ density increase, designing realistic models becomes more difficult, particularly\
    \ for research, because it requires understanding all layers of the datacenter\
    \ and how they interact. Consequently, many studies rely on outdated or unrealistic\
    \ designs. \nTo support research in datacenter hardware design principles, operational\
    \ dynamics, cooling mechanisms, and interactions of these facilities with the\
    \ electrical grid, we have designed DCGen, a tool which can generate a variety\
    \ of datacenter configurations (including IT hardware, cooling and power distribution\
    \ infrastructures) at various electrical power, compute capability, and area targets.\
    \ The tool captures power and space characteristics of IT, cooling, and power\
    \ infrastructures at both the rack and datacenter levels, enabling modeling of\
    \ power, energy, and space.\nDCGen leverages specific use cases such as AI training,\
    \ AI inference, and cloud services, to\nselect reference and canonical IT hardware\
    \ configurations, producing realistic mixes of server types. It can target datacenter\
    \ scale in terms of both power (e.g., 10 MW, 100 MW, 1 GW) and compute capability.\
    \ For cooling and power distribution infrastructures, DCGen chooses components\
    \ from a production equipment catalog that optimizes for space or power efficiency\
    \ while meeting the datacenter capacity requirements. This tool supports research\
    \ using realistic datacenter designs through \u201Cwhat-if\u201D scenario exploration,\
    \ including studies of power density evolution over time, grid interconnection\
    \ capacity planning, datacenter-grid interactions, and space management."
  authors: Wedan Emmanuel Gnibga and Andrew A. Chien
  board_number: R4
  institution: University of Chicago
  number: 102
  room: Rock
  session: 2
  title: "\u201CDCGen 1.1: Generating Datacenter Configs (IT, Power, Cooling)"
- abstract: "Applications are chained to their storage\u2014moving from POSIX files\
    \ to HDF5, ADIOS2, or cloud formats requires rewriting code. I/O Router breaks\
    \ that chain.\nOur framework intercepts file operations at three levels (LD_PRELOAD,\
    \ FUSE, eBPF) and routes them to diverse backends without application modification.\
    \ Our insight: separate data from metadata. System calls like fstat() and access()\
    \ pass through to the real filesystem (keeping HPC benchmarks happy), while read()\
    \ and write() redirect to structured storage via configurable path rules (/data/**/*.h5).\n\
    A hybrid architecture makes this practical: eBPF tracks process lifecycles via\
    \ ring buffers, a userspace controller maintains interception sets, and LD_PRELOAD\
    \ performs O(1) file-descriptor routing at open() time. This avoids race conditions\
    \ and preserves compatibility with IOR, HDF5, and MPI-IO.\nBuilt in Rust with\
    \ lock-free concurrency, I/O Router achieves <50% overhead for data-path operations\
    \ while enabling zero-code-modification adoption of next-generation storage."
  authors: Neeraj Rajesh, Xian-He Sun, Anthony Kougkas
  board_number: R5
  institution: Illinois Tech
  number: 109
  room: Rock
  session: 2
  title: Applications do I/O. What if files actually went... somewhere else?
- abstract: Short video platforms like TikTok, Instagram Reels, etc., have gained
    popularity in multimedia by reshaping video consumption. The small video duration
    and unique swipe feature in the short video platforms made recommendation and
    preloading mechanisms crucial. Existing studies focused on optimizing the recommendation
    and preloading mechanisms to enhance the user experience using conventional and
    learning based approaches. However, existing studies use different experimental
    designs to evaluate their mechanisms, which could potentially lead to less reliable
    results in various environments. Hence, in this work we explore various experimental
    designs and evaluate the efficiency of existing mechanisms under various experimental
    designs. We provide guidelines to make better experimental design choices.
  authors: Annapurna B. Puttaswamy and Aaron D. Striegel
  board_number: R6
  institution: University of Notre Dame
  number: 121
  room: Rock
  session: 2
  title: Evaluating Experimental Designs for Short Video Studies
- abstract: AI agent frameworks for software engineering lack runtime constraints.
    We build a runtime layer for OpenSWE that enforces budgets, routes models, and
    applies recovery policies. We evaluate this system on SWE-bench to show cost and
    reliability gains.
  authors: Aditya Gandhi, Jay Yu, Lavangi Yadava, Omar Attia, Rohan Potta, James Davis
  board_number: R7
  institution: Purdue University, West Lafayette
  number: 123
  room: Rock
  session: 2
  title: 'APEX: Agent Policy-Driven Execution Runtime'
- abstract: 'In shared GPU clusters, jobs must be assigned a time allocation before
    their true runtime is known. Jobs exceeding their allocation are killed, wasting
    all prior compute, while over-allocating wastes scarce GPU hours. Studies of production
    clusters report that GPU utilization often sits at 30 to 40%, driven by conservative
    over-allocation. Current practice relies on fixed multiplicative buffers such
    as 2x predicted runtime, applying uniform safety margins regardless of per-job
    uncertainty.


    We propose an uncertainty-aware allocation framework that combines Conformal Quantile
    Regression with Conformal Risk Control to produce per-job time allocations with
    formal, finite-sample guarantees on expected overrun. Unlike fixed buffers, our
    approach generates heteroscedastic prediction intervals that adapt to each job''s
    uncertainty: routine jobs receive tight allocations while hard-to-predict jobs
    receive wider margins. A tail-adaptive variant partitions jobs by runtime bucket
    and applies risk control independently to each, protecting expensive long-running
    jobs that dominate cluster costs. For recurring job groups, an online adaptation
    mechanism updates intervals in real time.


    We evaluate on the Alibaba PAI-2020 trace (732K jobs) using the ATLAS leakage-free
    benchmark, with cross-cluster validation on the Microsoft Philly trace. Our approach
    achieves up to 50% lower scheduling cost than the best fixed buffer at matched
    coverage levels, Pareto-dominates fixed buffers across all cost ratios, and reaches
    high-coverage operating points that fixed buffers cannot without catastrophic
    cost inflation. A case study simulating an Earliest Deadline First scheduler confirms
    the lowest worst-case job stretch. The allocation path requires 26.3 microseconds
    per job. Integration with the Tiresias scheduler is ongoing.'
  authors: "Iqtedar Uddin, Andr\xE9 Bauer"
  board_number: R8
  institution: Illinois Institute of Technology
  number: 126
  room: Rock
  session: 2
  title: Uncertainty-Aware GPU Hour Allocation via Conformal Risk Control
- abstract: 'Finding scientific data is an iterative reasoning task. A scientist issues
    a query, skims results, reformulates when units mismatch, inspects candidates,
    and repeats until something fits. Agentic systems promise to automate this loop,
    but the cost is alarming: a single discovery query can consume a million tokens
    and tens of minutes, mostly re-reading metadata already seen. The bottleneck is
    not model capability; current agents treat retrieval as an opaque tool and reason
    about every intermediate result in context.


    We present CLIO Search, which separates reasoning from execution. Domain knowledge
    lives in the retrieval layer, not the LLM. Deterministic science-aware operators
    (unit conversion, formula matching) run as first-class branches alongside BM25
    and vector search, correct by construction rather than similarity. CLIO profiles
    each corpus before querying, selects branches, routes across HPC backends, and
    iteratively refines. The LLM is advisory; scoring, filtering, and ranking stay
    deterministic, making the correctness model-independent.


    We compare two baseline paths against CLIO Search across 10 queries on the National
    Data Platform (NDP; 341 datasets) using claude-sonnet-4-20250514. Claude Native
    runs a Claude agent with web search and sub-agents, but no domain tools. NDP-MCP
    exposes NDP''s catalog via a Model Context Protocol server. CLIO cuts tokens by
    ~52% and time by ~91% vs Claude Native, ~52% and ~75% vs NDP-MCP. Per-query context
    drops two orders of magnitude; 9 of 10 queries resolve in a single CLIO pass compared
    to 26 and 8 agent iterations on the baseline paths. Agentic search scales through
    improved harnessing, not prompting.'
  authors: Shazzadul Islam, Jaime Cernuda, Xian-He Sun, Anthony Kougkas
  board_number: R9
  institution: Illinois institute of technology
  number: 143
  room: Rock
  session: 2
  title: Agentic Search Efficiency for Scientific Data Discovery
- abstract: 'Accurate interference characterization is essential for channel as-

    signment and resource allocation in wireless networks. Pairwise

    interference among access points (APs) can be quantified using re-

    ceived signal strength (RSS) measurements. However, constructing

    a complete RSS map via direct measurement is often impractical

    due to the high measurement cost. Existing approaches to construct

    RSS maps face important trade-offs in terms of estimation accu-

    racy, measurement overhead, side-information requirements, and

    adequacy to unseen/dynamic scenarios. We propose a graph-based

    framework for inferring RSS maps from sparse measurements. By

    modeling the wireless network as a directed graph and formulating

    RSS prediction as an edge inference problem, we employ a Message-

    Passing Graph Neural Network (MPGNN) to capture both local and

    global interference dependencies without requiring explicit scene-

    level environmental models and maps, which is a required side-

    information in existing solutions including ray-tracing. Evaluations

    on measurement and ray-tracing datasets suggest that the proposed

    approach generalizes across network topologies and remains robust

    to deployment changes and measurement sparsity. Compared to

    representative baseline methods, it reduces normalized root mean

    square error (NRMSE) by up to 0.15 in low-observation regimes

    while substantially lowering measurement overhead.'
  authors: Yanzhi Li
  board_number: R10
  institution: Northwestern University
  number: 148
  room: Rock
  session: 2
  title: Graph Neural Networks for Wireless Interference Estimation
- abstract: 'Autonomous vehicles rely on accurate perception systems, particularly
    LiDAR-based point clouds, to understand and navigate complex environments. However,
    real-world driving conditions introduce perception constraints such as occlusions,
    limited sensor range, and reduced data density, which can significantly impact
    safety and decision-making. This project aims to investigate how autonomous driving
    performance is affected under constrained perception scenarios and to explore
    potential solutions to mitigate these limitations.


    The study is conducted using the CARLA Simulator integrated with Autoware AI.
    Simulated environments are used to systematically reduce LiDAR point cloud density
    and introduce occlusions to replicate real-world perception challenges. The project
    will analyze how these constraints influence object detection, localization, and
    planning behaviors.


    In addition, this work proposes a cooperative perception framework in which autonomous
    vehicles share point cloud data with nearby vehicles. This approach aims to reduce
    blind spots and improve situational awareness by enabling vehicles to perceive
    objects beyond their direct line of sight.


    The expected outcome of this research is to provide insights into the limitations
    of perception-constrained systems and evaluate the potential of collaborative
    sensing for improving safety in autonomous driving.'
  authors: Rushikesh R Shirsat, Neil Klingensmith
  board_number: R11
  institution: loyola university chicago
  number: 160
  room: Rock
  session: 2
  title: Perception Constrained Autonomous Driving
