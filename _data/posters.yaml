  number: 67
  room: Northwestern
  session: 1
  title: "Exploring the Cost\u2013Performance Tradeoff in Federated RAG Systems"
- abstract: For the past decade, due to the advancement of computer technology, the
    rapid increase in large quantities of data and the reemergence of Artificial Intelligence,
    there has been a lot of effort dedicated towards improving the efficiency and
    effectiveness of Data Science and Machine Learning models, both in terms of the
    quality of the model but also in terms of the performance of the implementation.
    Typically, machine learning or deep learning models can be tuned and improved
    to obtain very high accuracy and precision over specific training and test dataset.
    However, when the same model is confronted with data outside of the training and
    test dataset, commonly named Out-of-Distribution data, the performance of the
    model can decrease dramatically. This can have sever repercussions in the context
    of critical domains. For example, in medicine the model could misdiagnose a patient,
    that would lead to incorrect treatments. Or in the context of home robotics, it
    could misidentify an object or a command, leading to unintended actions. Detecting
    and highlighting Out-of-Distribution data points becomes cumbersome when using
    popular standard tools such as Python Matplotlib and Jupyter Notebooks. Thus,
    this project will focus on the design and implementation of a scalable and interactive
    Out-of-Distribution data visualization software platform that will automate and
    simplify the process of analyzing and identifying Out-of-Distribution data. The
    proposed software platform will be used to enhance the Machine Learning models
    developed in previous work, that focus on predicting lung nodule tumor malignancy
    from medical images.
  authors: Marija Stojanoska, Nandhini Gulasingam, Alexandru Orhean, Jacob Furst ,
    Daniela Raicu
  board_number: N28
  institution: DePaul University
  number: 68
  room: Northwestern
  session: 1
  title: Scalable and Interactive Visualization for Out-of-Distribution Data
- abstract: Improving the reliability of artificial intelligence systems is essential
    for their adoption in scientific discovery and large-scale domain workflows. In
    collaboration with domain scientists working on AI and machine learning pipelines
    at scale, our work investigates how Scalable Explainable AI (XAI) techniques can
    be embedded directly into the model training process to enhance reliability. Rather
    than treating explainability as a post hoc step applied only after prediction,
    we explore the use of explanations during training to guide models toward learning
    patterns that are more transparent, robust, and scientifically meaningful. This
    training-integrated approach has the potential to improve model trustworthiness,
    facilitate validation by domain experts, and better align learned representations
    with real-world scientific expectations. By incorporating explainability into
    the learning process itself, the proposed framework aims to bridge the gap between
    high-performing AI models and the interpretability requirements of scientific
    practice, supporting the development of AI systems that are both effective and
    dependable in real-world applications.
  authors: Shilpika, Carlo Graziani, Bethany Lusch, Michael E. Papka
