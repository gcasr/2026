    \ computing systems, focusing on compiler design for higher-dimensional qudit\
    \ architectures. Her research centers on gate decomposition using SNAP and displacement\
    \ operations on cavity-based (transmon + 3D resonator) platforms, with an emphasis\
    \ on translating abstract unitary targets into hardware-executable pulse sequences.<br/>Her\
    \ work involves developing and evaluating decomposition methods under realistic\
    \ hardware constraints, including studies of fidelity, circuit depth, and optimization\
    \ variability across synthesis approaches. She collaborates with researchers at\
    \ the Superconducting Quantum Materials and Systems Center at Fermilab, contributing\
    \ to end-to-end demonstrations of qudit-based quantum control.<br/><br/><br/>Leonardo\
    \ Bove is a researcher at the Superconducting Quantum Materials and Systems (SQMS)\
    \ Center at Fermi National Accelerator Laboratory, where he works on superconducting\
    \ qubit systems, with a focus on transmon and 3D cavity-based architectures. His\
    \ work involves hardware bring-up, automated calibration pipelines for fixed-frequency\
    \ transmons, and bosonic qubit encodings, including SNAP+displacement gate decompositions.\
    \ He has contributed to calibration framework development using the QUAlibrate/QUAM\
    \ stack with Quantum Machines OPX+ hardware.<br/>In September 2026, Leonardo will\
    \ begin a PhD in Computer Science at Northwestern University, co-advised by Professors\
