    \ of Chicago and New York University, reflecting her commitment to rigorous technical\
    \ and analytical training throughout her career.<br/>---------------------------------------------------------------------------------------------------------------------------------------------<br/>Dr.\
    \ Kyle Chard is a Research Associate Professor in the Department of Computer Science\
