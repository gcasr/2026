  title: Hybrid Edge-HPC Systems for Low-Latency Data-Driven Inference
- abstract: Sorting encrypted data under fully homomorphic encryption (FHE) is a critical
    primitive for privacy-preserving computation, enabling applications from secure
    database operations to confidential machine learning pipelines. However, the prohibitive
    computational cost of homomorphic operations makes efficient sorting on encrypted
    data exceptionally challenging. While recent work has demonstrated single-node
    parallel sorting algorithms for FHE data using shared-memory architectures, these
    approaches remain fundamentally limited by the computational capacity and memory
    constraints of individual machines. This paper presents the first distributed-memory
    parallel sorting algorithm for homomorphically encrypted data, extending beyond
    single-node limitations to multi-node supercomputing environments. We develop
    a hybrid MPI+OpenMP implementation that exploits the constant-depth, embarrassingly
    parallel structure of the Mazonne sorting algorithm (USENIX Security 2025), enabling
    effective utilization of distributed computing resources. Our approach incorporates
    efficient load balancing schemes to ensure optimal workload distribution across
    processors and nodes. The compute-dominated nature of FHE operations, combined
    with low-latency interconnects on modern supercomputers, makes the marginal communication
    overhead negligible compared to computational gains from massive parallelism.
    Experimental evaluation on the Polaris supercomputer at Argonne Leadership Computing
    Facility shows that distributed execution significantly mitigates the quadratic
    runtime growth observed in the single-node setting and achieves up to a 2^7x speedup.
    We successfully scale to 1,024 MPI processes and 16,384 threads to sort 65,536
    CKKS-encrypted elements in 3,069 seconds, the largest reported FHE sorting experiment
    to date.
