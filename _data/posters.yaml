  long_bio: Sadegh Majidi is a second-year PhD student in the Department of Computer
    Science at Purdue University, advised by Prof. Kazem Taram. His research lies
    at the intersection of modern computer architectures, computer security, and machine
    learning systems, with a focus on analyzing and exploiting side-channel leakages
    in machine learning systems. In particular, he studies timing, physical, and microarchitectural
    side channels in large language model (LLM) inference to understand what information
    about the model, its deployment environment, and its interactions with users can
    be inferred, and how such leakages can be mitigated. His recent work explores
