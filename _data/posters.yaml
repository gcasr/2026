    (2019) and ICDE (2006), an IEEE Micro Top Picks Award (2010), an IEEE Micro Top
    Picks Honorable Mention (2023), and a Technical Award for Contributions to the
    Alpha Microprocessor (2000). Prior to joining Northwestern University, he contributed
    to the design of several generations of Alpha microprocessors and high-end multiprocessor
    servers at Digital Equipment Corp. (DEC), Compaq, and Hewlett-Packard. Nikos received
    a Ph.D. in Computer Science from Carnegie Mellon University.<br/><br/><br/>Kaitlin
    N. Smith is an Assistant Professor of Computer Science at Northwestern University.
    Her research is focused on quantum computing systems, software, and architecture.
    She joined Northwestern from Infleqtion, where she acted as a quantum software
