  title: Minimal Hardware Extensions for Object-Level Memory Management
- abstract: "Floating point virtualization allows existing, unmodified application\n\
    binaries to be run using an alternative arithmetic system. Such\nvirtualization\
    \ is geared to alternative numbers that are \u201Clarger\u201D\n(require more\
    \ bits) than the IEEE 754 numbers (e.g., 64 bit doubles)\nthey replace. In this\
    \ work, we approach the challenge of virtualizing\nwith \u201Csmaller\u201D numbers\
    \ (requiring fewer bits), which is of increasing\ninterest given the explosion\
    \ of low-precision hardware targeting AI.\nWe focus specifically on the ubiquitous\
    \ x64 architecture through a\nhardware/software co-design that leverages x64 functionality\
    \ that\ncurrently lays fallow. The design combines (a) instruction traps\nvia\
    \ lazy FPU abduction, and (b) simplified memory management\nby tiny value boxing.\
    \ We also develop an example tiny alternative\narithmetic system that allows smaller\
    \ IEEE 754 numbers, down to 3\nbits, with the exact precision able to be specified\
    \ on a per-value or\nper-instruction basis at runtime. Our prototype system is\
    \ evaluated\nusing validation and performance tests based on running NAS and\n\
    other benchmarks with a range of lower precision numbers."
