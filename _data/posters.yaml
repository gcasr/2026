  title: Security Challenges in AI-based Quantum Control and Error Correction
- abstract: "Privacy-preserving machine learning as a service allows data owners to\
    \ encrypt their data and delegate model training to an untrusted server using\
    \ fully homomorphic encryption (FHE). While most prior work has focused on private\
    \ inference, private training remains challenging due to the high computational\
    \ cost of non-linear operations such as exponentiation and division. A key design\
    \ choice is the loss function, which directly impacts both model accuracy and\
    \ FHE efficiency. However, the trade-offs between square loss and cross-entropy\
    \ loss in encrypted training have not been systematically studied.\n\nWe present\
    \ an empirical comparison of multiclass square loss and cross-entropy loss under\
    \ the CKKS scheme. For square loss, we implement full-batch gradient descent with\
    \ ciphertext refresh via bootstrapping. For cross-entropy, we use a normalize-and-square\
    \ softmax approximation that replaces costly exponentiation and division with\
    \ low-degree polynomial approximations and SIMD rotations. We evaluate accuracy,\
    \ multiplicative depth, and runtime across multiple benchmark datasets. \n\nWe\
    \ show that square loss requires significantly less multiplicative depth but converges\
    \ more slowly, whereas cross-entropy achieves higher accuracy at the cost of deeper\
    \ circuits and increased computational complexity. This work provides practical\
    \ guidelines for selecting loss functions for privacy-preserving training, highlighting\
    \ the trade-off between accuracy, efficiency, and circuit depth."
