  title: 'HAMMER: Homomorphic Analytics with Multiparty Method for Encrypted Relational
    Queries'
- abstract: "Privacy-preserving machine learning (PPML) protocols partition computation\
    \ across two paradigms: function secret sharing (FSS) handles non-linear operations\
    \ such as ReLU and comparison, while additive secret sharing handles linear operations.\
    \ Both adopt offline/online decompositions to minimize online latency, but this\
    \ shifts the burden to the offline phase, where generating and storing correlated\
    \ randomness becomes the dominant bottleneck. Our profiling of Orca, a GPU-accelerated\
    \ FSS-based PPML system, reveals that precomputed FSS keys grow from gigabytes\
    \ to tens of gigabytes as model complexity increases, with key storage, I/O, and\
    \ memory movement consuming as much time as GPU computation even for moderate-sized\
    \ models. These costs worsen as FSS-based frameworks target heavier workloads.\n\
    We propose a unified acceleration framework addressing this offline bottleneck\
    \ across both paradigms. For FSS-based non-linear evaluation, we replace large\
    \ precomputed keys with compact seeds expanded on-the-fly on GPU. Chunked online\
    \ key generation reduces peak staged key footprint by up to 128\xD7 compared to\
    \ one-shot generation with under 2\xD7 time overhead, providing a tunable memory-efficiency\
    \ knob. For secret-sharing-based linear evaluation, we GPU-accelerate Ring-LPN\
    \ pseudorandom correlation generators (PCGs). Our GPU NTT engine, adapted from\
    \ Cheddar's two-phase kernel structure, achieves roughly 89\xD7 polynomial multiplication\
    \ speedup over the NFLLib CPU baseline, providing the fast polynomial core that\
    \ online PCG expansion requires. Built on this, our GPU Ring-LPN VOLE expansion\
    \ prototype demonstrates that PCG-based correlation generation runs efficiently\
    \ on GPU, with validated correctness across polynomial degrees from 8,192 to over\
    \ one million for both 32-bit and 64-bit modulus widths. We are currently integrating\
    \ these components into Orca"
