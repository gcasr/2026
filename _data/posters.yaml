  title: "Personalized Detection of Motor Symptoms in Parkinson\u2019s Disease with\
    \ Federated Learning"
- abstract: "Federated Learning (FL) deployments using IoT devices is an area that\
    \ is poised to significantly benefit from advances in NextG wireless. We deployed\
    \ a FL application using a 5G-NR Standalone (SA) testbed with open-source and\
    \ Commercial Off-the-Shelf (COTS) components. The 5G testbed architecture consists\
    \ of a network of resource-constrained edge devices, namely Raspberry Pis, and\
    \ a central server equipped with a Software Defined Radio (SDR) and running O-RAN\
    \ software. Our testbed allows edge devices to communicate with the server using\
    \ WiFi and Ethernet instead of 5G. FL is deployed using the Flower FL framework,\
    \ for which we developed a comprehensive instrumentation tool to collect and analyze\
    \ diverse communications and machine learning performance metrics including model\
    \ aggregation time, downlink transmission time, training time, and uplink transmission\
    \ time. Leveraging these measurements, we performed a comparative analysis of\
    \ the FL application across three network interfaces\u20135G, WiFi, and Ethernet\u2013\
    as well as across 5G bandwidths and uplink-downlink scheduling ratios. Our experimental\
    \ results challenge some common assumptions about communication time in FL over\
    \ wireless and address the potential pitfalls of these assumptions. We find that\
    \ there is a consistent straggler in about 70% of trials, while in the other 30%,\
    \ high communication time causes competing stragglers. We also compare FL performance\
    \ over 5G with and without external congestion and compare our testbed to commercial\
    \ 5G to validate our findings in a broader context. For reproducibility, we have\
    \ open-sourced our FL application, instrumentation tools, and testbed configuration."
