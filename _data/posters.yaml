- abstract: Complex scientific tasks have increasingly become automated through the
    utilization of agents. This leads to complex multi-agent systems where agent reasoning,
    tool calls, computation, and more are interleaved to solve a problem. In spite
    of this trend, a recent taxonomy of 1,642 multi-agent traces reports failure rates
    of 41 to 87 percent, with 37 percent of failures caused by inter-agent misalignment.
    Some provenance systems have been created to record the lineage of agentic workflows,
    but they are intended as observers and cannot intervene; recovery tools exist
    to rewind state but lack the knowledge provided by formal provenance models. There
    is no system that unifies both capabilities for multi-agent settings. We present
    AgentRecall, a provenance and rewind system that captures agent interactions,
    maintains multi-agent context histories, and enables cost-aware, consistent rewind
    across multiple collaborating agents. AgentRecall contributes (1) a multi-interface
    provenance collection framework spanning heterogeneous stores and multi-level
    agent pipelines, (2) a cost-aware recovery mechanism enabling consistent multi-agent
    context rewind and targeted error correction while reducing unnecessary re-execution,
    and (3) an annotated context history store supporting automated lineage reasoning
    and manual inspection of agent behavior. Preliminary evaluations of AgentRecall
    on benchmarks such as Kramabench and ParEval demonstrate that rollback can improve
    correctness by 50% over non-rewind baselines.
