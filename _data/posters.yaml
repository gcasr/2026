  title: Optimizing LLM Batch Inference with Workload-Aware DVFS
- abstract: "Research labs that rely on environmental monitoring often face a common\
    \ problem: getting sensor data off edge devices and into a place where researchers\
    \ can actually use it, without spinning up heavyweight infrastructure. We present\
    \ Jetson Sensor Hub, a lightweight virtual sensor telemetry platform built to\
    \ collect, store, and visualize environmental data from multiple NVIDIA Jetson\
    \ devices and expose it publicly without cloud dependency.\nEach Jetson runs a\
    \ Python agent that reads onboard BME680 hardware sensors temperature, humidity,\
    \ barometric pressure, and gas resistance \u2014parses raw Linux IIO sysfs output\
    \ into structured JSON, and pushes readings to a central server at five-second\
    \ configurable intervals via HTTP. The server, built on FastAPI with SQLite-backed\
    \ storage, handles per-device token authentication, stores time-series readings,\
    \ and exposes a versioned REST API publicly at sage.evl.uic.edu. For low-latency\
    \ use cases, the server supports WebSocket streaming, delivering live readings\
    \ to subscribers in under one second without polling overhead. A lightweight HTML/JavaScript\
    \ dashboard built with Chart.js provides real-time metrics, historical time-series\
    \ plots, and per-device CSV export \u2014 accessible from any browser with no\
    \ installation required.\nThe system is designed around simplicity and deployability.\
    \ All components run as systemd services, agents operate statelessly, and the\
    \ stack avoids external brokers or cloud services entirely. The platform is currently\
    \ deployed at the Electronic Visualization Laboratory at UIC, where it supports\
    \ ongoing NSF-funded research on the SAGE testbed \u2014 a national-scale distributed\
    \ sensing infrastructure spanning edge, fog, and cloud computing tiers."
  authors: Om Patel, Dr Michael E. Papka
