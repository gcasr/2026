  title: Evaluating Gate Decomposition Strategies for High-Dimensional Quantum Systems
- abstract: "During the transition from NISQ devices to fault-tolerant systems, quantum\
    \ error detection (QED) codes offer a practical means for improving the utility\
    \ of quantum computers. However, applying QED is challenging: developers must\
    \ manually select codes, insert checks, manage ancillas, and remap circuits\u2014\
    a complex, error-prone process where trade-offs are difficult to assess under\
    \ real hardware constraints. Here, we introduce the Quantum Error Management Compiler\
    \ (QuantEM), a modular framework that automates the integration of QED into arbitrary\
    \ quantum circuits. QuantEM performs program analysis to identify regions amenable\
    \ to protection, selects appropriate detection codes given algorithmic and hardware\
    \ constraints, and inserts ancilla-based subcircuits without disturbing the original\
    \ computation. QuantEM currently supports Pauli Check Sandwiching and Iceberg\
    \ codes, and its extensible design enables the integration of additional detection\
    \ schemes and hardware platforms. \n\nFurthermore, QuantEM incorporates novel\
    \ QED applications. One application is the error mitigation technique Pauli Check\
    \ Extrapolation (PCE). Benchmarks for PCE show significant performance improvement\
    \ over ZNE, especially as circuit sizes increase. On real IBM hardware, PCE achieves\
    \ an accuracy of up to 99.2% (56.2% improvement over baseline), compared to ZNE's\
    \ 82% accuracy, on 4-qubit circuits. Another application is Dynamic Resource Allocation\
    \ (DRA) with Pauli Checks, which is a method for characterizing and mapping quantum\
    \ circuits at runtime, utilizing the Upper-Confidence Bound algorithm to identify\
    \ optimal resource allocation regions. When applied to QAOA, DRA with Pauli Checks\
    \ increases circuit fidelity by 15% on average (up to ~30%) while providing shot\
    \ budget savings up to 58%.\n"
  authors: Ji Liu, Quinn Langfitt, Mingyoung Jessica Jeng, Alvin Gonzales, Noble Agyeman-Bobie,
    Kaiya Jones, Siddharth Vijaymurugan, Daniel Dilley, Zain H. Saleem, Nikos Hardavellas,
    Kaitlin N. Smith
