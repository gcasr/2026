- abstract: "Structured LLM workflows, in which specialized LLM sub-agents are executed\
    \ according to a predefined execution graph, have emerged as a powerful abstraction\
    \ for complex tasks. Optimizing such workflows, i.e., selecting configurations\
    \ for each sub-agent to achieve favorable accuracy\u2013latency trade-offs under\
    \ resource constraints, is challenging due to the combinatorial design space over\
    \ model choices, reasoning budgets, and even the execution graph itself. Existing\
    \ cost-aware approaches typically formulate this problem as routing: they learn\
    \ a policy to select a single configuration per query that optimizes a predefined\
    \ cost objective. In this work, we instead cast workflow optimization as a compilation\
    \ problem. Analogous to machine learning compilers for neural network kernels,\
    \ we aim to develop a systematic approach to analyze and optimize structured LLM\
    \ workflows. We introduce FlowCompile, an optimizing compiler designed for structured\
    \ LLM workflows that performs compile-time optimization over a unified workflow\
    \ design space and produces a diverse set of optimized workflow configurations\
    \ in a single compile-time pass, covering a wide range of accuracy\u2013latency\
    \ trade-offs. FlowCompile decomposes a workflow into sub-agents, profiles each\
    \ component under different configurations, composes these local estimates into\
    \ workflow-level accuracy and latency predictions, and efficiently identifies\
    \ globally optimized configurations. Experiments across diverse workflows and\
    \ challenging benchmarks demonstrate that FlowCompile consistently outperforms\
    \ heuristically optimized workflow configurations and routing-based baselines\
    \ by a large margin. Moreover, our results highlight key advantages of the compilation\
    \ paradigm, including the possibility to combine with routing methods to further\
    \ boost performance, as well as task transferability."
