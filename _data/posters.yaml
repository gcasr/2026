    inspired applications.<br/><br/>Jos\xE9 E. Cruz Serrall\xE9s pursued an S.B. degree\
    \ in Electrical Science and Engineering, an M.Eng. degree in Electrical Engineering\
    \ and Computer Science, and a Ph.D. degree in Electrical Engineering and Computer\
