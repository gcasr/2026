  title: A Compiler Framework for Packing Optimization and TPU Acceleration in Fully
    Homomorphic Encryption
- abstract: Workflow management systems allow users to create large-scale distributed
    scientific applications. Varying systems provide different paradigms for translating
    user-provided code or specifications into a workflow, where some systems provide
    libraries in languages such as Python, such as those used in the domain of high
    energy physics (HEP). In the HEP domain, users provide functions that represent
    tasks in a broader DAG. However, the initial topology of the DAG may inhibit the
    performance of the workflow during runtime and is often not visible to the user.
    Such inefficiencies incurred include increased task overhead, lack of concurrency,
    and susceptibility to faults due to the high granularity, which causes distribution.
    Notably, a graph can be restructured, producing an identical result with a more
    ideal topology that can eliminate these issues. This work provides the methodology
    for restructuring workflows via task merging, which combines tasks into single
    executable entity, and task reshaping via labeling, which provides insight to
    the underlying workflow stack of the algebraic properties of a function such as
    variable arity, commutativity, and associativity. enabling restructuring for better
    topology under a restricted high energy physics workflow stack. This is incorporated
    into the composition of the frameworks Dask and TaskVine. We then show improvement
    with real-world HEP applications in regard to runtime, task overhead, and fault-tolerance.
