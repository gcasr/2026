  room: Lake
  session: 1
  title: 'Contour: Elevating Scientific Applications to Scalable Workflows'
- abstract: 'Large Language Models (LLMs) have become a critical part of broad workflows.
    Increasingly, users use many LLMs in their work, ranging from small to large models,
    fine-tuned on different corpora, and optimized for different use cases. As such,
    institutions face the challenge of serving many LLMs concurrently to their users.
    Existing solutions, like vLLM, focus on high-performance multi-GPU model serving
    for a single model. Deploying many such instances can be inefficient at scale.
    We explore serving multiple machine learning models with varied GPU requirements
    in a resource-constrained environment with a limited number of GPUs. We introduce
    MPI-LLM, a serving system designed to support efficient, scalable, multi-node
    inference of LLMs. Our work extends vLLM, the leading model serving system, with
    a novel Message Passing Interface backend, providing faster startup and resource
    allocation optimized for HPC systems. MPI-LLM offers three primary contributions:
    (i) an MPI-based backend that accelerates initialization and ensures compatibility
    with HPC infrastructure, (ii) support for hosting multiple models simultaneously,
    and (iii) rapid model switching capabilities.'
  authors: Shu Shi, Wenyi Wang, Yadu Nand Babuji, Kyle Chard, Ian Foster
  board_number: L8
  institution: University of Chicago
  number: 24
  room: Lake
  session: 1
  title: 'MPI-LLM: Extreme-scale Multi-LLM Serving for HPC'
- abstract: 'With the emerging uses of AI to automate various software engineering
    tasks, one such use case is integration of models into compilation pipelines.
    Due to intrinsic stochastic properties of LLMs, the correctness of program transformations
    no longer relies on time-tested compilers, turning them very untrustworthy. Validating
    those transformations increases reliability, but not without a cost; such a computation
    takes considerable amount of time.


    There is however redundancy as the program goes through a chain of transformations.
    As an example, in the vast majority of programs, a pass through a language model
    would preserve the program''s memory backbone; it is also the hardest constituent
    to verify. Identifying such redundancies would greatly reduce the problem size,
    and we therefore propose to break down programs into persistent and non-persistent
    components, with only the need validate the latter with each new transformation.
    Therefore, this work enables AI transformation passes to be integrated into compilation
    pipelines without an overwhelming overhead.'
  authors: Tommy McMichen, Leyla Latifova
  board_number: L9
  institution: Northwestern University
  number: 27
  room: Lake
  session: 1
  title: Persistent Translation Validation
- abstract: "Scientific computing workflows are increasingly being restructured around\
    \ autonomous AI agents. These agents coordinate complex tasks across heterogeneous\
    \ tools and infrastructure, ranging from molecular simulations spanning quantum\
    \ chemistry solvers and machine learning potentials to cross-facility manufacturing\
    \ experiments orchestrated by multi-agent teams. However, existing orchestration\
    \ approaches either follow static execution graphs defined at design time or delegate\
    \ routing to an LLM that greedily selects the next agent at each step, without\
    \ considering resource availability, heterogeneous model and provider selection,\
    \ and infrastructure constraints. Achieving resource-aware, dynamic, and deterministic\
    \ orchestration that reasons about task decomposition, agent capabilities, and\
    \ infrastructure state demands complex planning and dispatching decisions at runtime.\
    \ This may introduce significant latency before any agent can begin execution.\
    \ We propose a speculative dispatch mechanism to accelerate multi-agent orchestration.\
    \ We are the first to apply speculative execution to the dispatch decision. Specifically,\
    \ our approach speculatively dispatches agents ahead of time while the full orchestration\
    \ decision is being computed. Since speculative dispatch can mispredict, a reconciliation\
    \ engine reconciles the speculative and optimal dispatch plans. Unlike single-agent\
    \ speculation approaches that accept or discard results entirely, our framework\
    \ commits correct work, salvages partial matches, and flushes mispredictions,\
    \ reducing the cost of misprediction. As workload patterns evolve over time, a\
    \ learner progressively refines speculation accuracy from reconciliation outcomes,\
    \ enabling the system to improve dispatch predictions. Preliminary results show\
    \ speculative planner produces partially correct dispatch plans (0.50\u20130.78\
    \ similarity) at 4\u201310\xD7 lower latency than optimal planner, confirming\
    \ the latency-quality gap speculative dispatch exploits."
  authors: Jie Ye, Shazzadul Islam, Jaime Cernuda, Xian-He Sun, Anthony Kougkas
  board_number: L10
  institution: Illinois Institute of Technology
  number: 30
  room: Lake
  session: 1
  title: Accelerating Multi-Agent Orchestration with Speculative Dispatching
- abstract: 'TLA+ is a formal specification language used to model and verify concurrent
    and distributed systems. Despite its practical value, no structured dataset exists
    to support future training and benchmarking of language models on TLA+ reasoning
    tasks. We present a benchmarking dataset built from real-world TLA+ specifications
    sourced from the TLA+ Examples repository. The dataset supports two tasks: structured
    feature extraction and natural language-to-specification generation. For feature
    extraction, we design a 60+ field JSON schema capturing syntactic and semantic
    properties of TLA+ specifications, verified against primary sources including
    Lamport''s TLA+ Summary, the TLA+2 Preliminary Guide, the formal TLA+ grammar,
    and the TLAPS proof system documentation. For the generation task, natural language
    descriptions are derived exclusively from external documentation so that TLA+
    specification files serve as ground truth outputs. All annotations are verified
    using SANY and TLC. This dataset is intended as a foundation for future training
    and benchmarking of language models on formal specification reasoning.'
  authors: "Arslan Bisharat, Eric Spencer, Khushboo Bhadauria, Anisa Ramos, Brian\
    \ Ortiz, Mohammed Abuhamad, Konstantin La\xFCfer, TaiNing Wang, George K. Thiruvathukal"
