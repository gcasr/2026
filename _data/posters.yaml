  title: Multi-Node Inertial Motion Capture Device
- abstract: "Field-deployable edge computing nodes form a network and are used to\
    \ complete scientific tasks for remote sensing and monitoring. The networked nodes\
    \ collectively decide which scientific applications to run while they are constrained\
    \ by various factors, such as differing hardware constraints from heterogeneous\
    \ nodes and time-varying quality of service (QoS) requirements. We model the problem\
    \ of task allocation as an optimization problem that maximizes the QoS, subject\
    \ to the constraints. We solve the optimization problem using a\ndual-descent\
    \ method, which can be easily implemented in a distributed way subject to the\
    \ communication constraints of the network. Using a simulation that uses real-world\
    \ data collected from Sage, a distributed sensor network, we analyze our policy\u2019\
    s performance in dynamic situations where the required QoS and the nodes\u2019\
    \ capabilities change, and verify that it can adapt and return a feasible solution\
    \ while accounting for those changes."
  authors: Henry W. Abrahamson, Yongho Kim, Seongha Park, Ermin Wei
  board_number: L21
  institution: Northwestern University, Argonne National Lab
  number: 154
  room: Lake
  session: 2
  title: Distributed Edge Computing Task Allocation with Network Effects
- abstract: Most prior work on large language model (LLM) inference has focused on
    online serving, where systems must react to dynamically arriving requests under
    strict latency and fairness constraints. However, batch inference is becoming
    increasingly important in many emerging workloads, including literature mining,
    synthetic data generation, scientific data annotation, and document summarization.
    Despite its growing practical importance, batch inference remains underexplored
    as a systems problem. A defining property of batch inference is that the workload
    is available before execution. This creates opportunities for optimizations that
    are difficult or impossible in online serving. In this work, we argue that advance
    knowledge of batch composition can be leveraged to analyze workload characteristics
    and proactively optimize execution for energy efficiency. We propose a workload-aware
    system design that analyzes a batch before or during execution and uses dynamic
    voltage and frequency scaling (DVFS) to better match hardware behavior to workload
    demand. By exploiting the predictability of batch jobs, such a system can improve
    the energy efficiency of LLM inference while maintaining competitive performance.
    This poster highlights workload-aware DVFS as a promising direction for energy-efficient
    LLM batch inference.
  authors: Yiheng Tao, Yuping Fan, Michael E. Papka, Zhiling Lan
  board_number: L22
  institution: University of Illinois Chicago, Argonne National Laboratory
  number: 156
  room: Lake
  session: 2
  title: Optimizing LLM Batch Inference with Workload-Aware DVFS
- abstract: "Research labs that rely on environmental monitoring often face a common\
    \ problem: getting sensor data off edge devices and into a place where researchers\
    \ can actually use it, without spinning up heavyweight infrastructure. We present\
    \ Jetson Sensor Hub, a lightweight virtual sensor telemetry platform built to\
    \ collect, store, and visualize environmental data from multiple NVIDIA Jetson\
    \ devices and expose it publicly without cloud dependency.\nEach Jetson runs a\
    \ Python agent that reads onboard BME680 hardware sensors temperature, humidity,\
    \ barometric pressure, and gas resistance \u2014parses raw Linux IIO sysfs output\
    \ into structured JSON, and pushes readings to a central server at five-second\
    \ configurable intervals via HTTP. The server, built on FastAPI with SQLite-backed\
    \ storage, handles per-device token authentication, stores time-series readings,\
    \ and exposes a versioned REST API publicly at sage.evl.uic.edu. For low-latency\
    \ use cases, the server supports WebSocket streaming, delivering live readings\
    \ to subscribers in under one second without polling overhead. A lightweight HTML/JavaScript\
    \ dashboard built with Chart.js provides real-time metrics, historical time-series\
    \ plots, and per-device CSV export \u2014 accessible from any browser with no\
    \ installation required.\nThe system is designed around simplicity and deployability.\
    \ All components run as systemd services, agents operate statelessly, and the\
    \ stack avoids external brokers or cloud services entirely. The platform is currently\
    \ deployed at the Electronic Visualization Laboratory at UIC, where it supports\
    \ ongoing NSF-funded research on the SAGE testbed \u2014 a national-scale distributed\
    \ sensing infrastructure spanning edge, fog, and cloud computing tiers."
  authors: Om Patel, Dr Michael E. Papka
  board_number: L23
  institution: University Of Illinois Chicago
  number: 157
  room: Lake
  session: 2
  title: 'Jetson Sensor Hub: A Virtual Sensor Telemetry Platform for Real-Time Environmental
    Monitoring'
- abstract: Scaling superconducting quantum processors to the millions of qubits required
    for useful quantum applications is hindered by the prohibitive number of control
    lines needed for qubit control and readout. Time Domain Multiplexing (TDM) mitigates
    this wiring overhead by allowing multiple qubits to share control lines, albeit
    at the cost of reduced parallelism and increased idle time. In this work, we investigate
    the impact of TDM on all the levels in the surface code fault tolerance stack.
    We analyze the effect of multiplexing on syndrome extraction, lattice surgery,
    and magic state distillation. We further evaluate whether multiplexed control
    hardware can also be used for multiplexing syndrome extraction and calibration,
    allowing fault-tolerant execution to continue uninterrupted across the periodic
    recalibration that would otherwise pause execution. Finally, during evaluation,
    we account for realistic demultiplexer switches with limited port-to-port isolation,
    which induce crosstalk on idling qubits sharing the same switch. Together, these
    results enable a systematic analysis of the trade-offs between wiring overhead
    and fault-tolerant performance, providing guidance for the design of scalable
    superconducting fault-tolerant quantum architectures.
  authors: Konstantinos-Nikolaos Papadopoulos, Kaitlin N. Smith, Jakub Szefer
  board_number: N1
  institution: Northwestern University
  number: 81
  room: Northwestern
  session: 2
  title: On the Feasibility of Time-Multiplexed Control for Surface Code Fault Tolerant
    Computation
- abstract: " AI-based quantum control and error correction is increasingly used in\n\
    quantum computing systems to improve multi-qubit readout discrimination and to\n\
    mitigate correlated readout errors. As such, AI is becoming an integral component\n\
    of today\u2019s quantum computers\u2019 control and readout stacks. Despite this\
    \ growing\nrole, the security implications of AI in these systems remain largely\
    \ unexamined,\nand the variety of security attacks are currently overlooked by\
    \ the vast majority of\nquantum computing research.\nThis work brings to light\
    \ the susceptibility of AI-based control and error\ncorrection to a variety of\
    \ security attacks. In particular, AI-based classifiers can be\nvulnerable to\
    \ physical fault-injection attacks, which can result in the generation of\nincorrect\
    \ readout results from quantum computers. More broadly, fault-injection\nor side-channel\
    \ attacks on AI algorithms, whether realized in software or hardware\nof the control\
    \ stack, can cause a range of problems, from integrity violations to loss\nof\
    \ intellectual property or exposure of sensitive data."
  authors: Anthony Etim and Jakub Szefer
  board_number: N2
  institution: Yale University
  number: 83
  room: Northwestern
  session: 2
  title: Security Challenges in AI-based Quantum Control and Error Correction
- abstract: "Privacy-preserving machine learning as a service allows data owners to\
    \ encrypt their data and delegate model training to an untrusted server using\
    \ fully homomorphic encryption (FHE). While most prior work has focused on private\
    \ inference, private training remains challenging due to the high computational\
    \ cost of non-linear operations such as exponentiation and division. A key design\
    \ choice is the loss function, which directly impacts both model accuracy and\
    \ FHE efficiency. However, the trade-offs between square loss and cross-entropy\
    \ loss in encrypted training have not been systematically studied.\n\nWe present\
    \ an empirical comparison of multiclass square loss and cross-entropy loss under\
    \ the CKKS scheme. For square loss, we implement full-batch gradient descent with\
    \ ciphertext refresh via bootstrapping. For cross-entropy, we use a normalize-and-square\
    \ softmax approximation that replaces costly exponentiation and division with\
    \ low-degree polynomial approximations and SIMD rotations. We evaluate accuracy,\
    \ multiplicative depth, and runtime across multiple benchmark datasets. \n\nWe\
    \ show that square loss requires significantly less multiplicative depth but converges\
    \ more slowly, whereas cross-entropy achieves higher accuracy at the cost of deeper\
    \ circuits and increased computational complexity. This work provides practical\
    \ guidelines for selecting loss functions for privacy-preserving training, highlighting\
    \ the trade-off between accuracy, efficiency, and circuit depth."
  authors: Sami Ouabrk, Cesar Agullo Quiros, Minxuan Zhou, Yutong Wang
  board_number: N3
  institution: Illinois Institute of Technology
  number: 84
  room: Northwestern
  session: 2
  title: Evaluation of Loss Functions under Fully Homomorphic Encryption for Multiclass
    Classification
- abstract: "Fully homomorphic encryption (FHE) is a key enabler for privacy-preserving\
    \ machine learning (PPML), allowing inference on encrypted data without exposing\
    \ sensitive inputs. However, compiling PPML workloads under FHE remains challenging:\
    \ packing - encoding ML tensors into ciphertexts, each storing a 1D vector - and\
    \ mapping - transforming ML operators into homomorphic operations such as addition,\
    \ multiplication, and rotation - are tightly coupled, with the chosen packing\
    \ scheme constraining which mappings are valid. Meanwhile, orchestration of rescaling,\
    \ relinearization, and data movement must respect the ciphertext's evolving modulus\
    \ level. Current industry-oriented FHE compilers such as HEIR lack comprehensive\
    \ packing and mapping optimization support and do not target emerging hardware\
    \ accelerators like TPUs.\nWe present a compilation framework, integrated into\
    \ HEIR, that addresses both gaps. First, we introduce intermediate representations\
    \ that describe general packing and mapping choices, enabling effective optimization\
    \ of data layouts while integrating naturally with the existing HEIR infrastructure.\
    \ Second, we develop a new backend targeting CROSS, a TPU acceleration library\
    \ for CKKS. The backend analyzes the generated layouts and mappings and produces\
    \ efficient TPU code through a level-aware context API that encapsulates key generation,\
    \ modulus-aware kernel selection, and accelerator-specific wiring behind a stable\
    \ compiler surface. \nPreliminary experiments on encrypted neural-network inference\
    \ validate our implementation, demonstrating improvements over existing manual\
    \ approaches. The proposed framework can boost various research directions including\
    \ scheduling policies for heterogeneous CPU\u2013TPU pipelines, cross-layer operator\
    \ fusion to reduce memory traffic and launch overhead, and exploration of MPC\u2013\
    FHE hybrid compilation under a unified toolchain"
  authors: Zohaib Azam, Akash Madhu, Jianming Tong, Minxuan Zhou
  board_number: N4
  institution: Illinois Institute of Technology, Georgia Institute of Technology
  number: 85
  room: Northwestern
  session: 2
  title: A Compiler Framework for Packing Optimization and TPU Acceleration in Fully
    Homomorphic Encryption
- abstract: Workflow management systems allow users to create large-scale distributed
    scientific applications. Varying systems provide different paradigms for translating
    user-provided code or specifications into a workflow, where some systems provide
    libraries in languages such as Python, such as those used in the domain of high
    energy physics (HEP). In the HEP domain, users provide functions that represent
    tasks in a broader DAG. However, the initial topology of the DAG may inhibit the
    performance of the workflow during runtime and is often not visible to the user.
    Such inefficiencies incurred include increased task overhead, lack of concurrency,
    and susceptibility to faults due to the high granularity, which causes distribution.
    Notably, a graph can be restructured, producing an identical result with a more
    ideal topology that can eliminate these issues. This work provides the methodology
    for restructuring workflows via task merging, which combines tasks into single
    executable entity, and task reshaping via labeling, which provides insight to
    the underlying workflow stack of the algebraic properties of a function such as
    variable arity, commutativity, and associativity. enabling restructuring for better
    topology under a restricted high energy physics workflow stack. This is incorporated
    into the composition of the frameworks Dask and TaskVine. We then show improvement
    with real-world HEP applications in regard to runtime, task overhead, and fault-tolerance.
  authors: Barry Sly-Delgado
  board_number: N5
  institution: University of Notre Dame
  number: 88
  room: Northwestern
  session: 2
  title: Restructuring Workflows for Large-Scale High Energy Physics Data Analysis
- abstract: 'Businesses and the public sector are increasingly engaging in collaborative
    data analytics on the union of their private data. One approach is a private data
    federation (PDF) with secure multiparty computation (MPC). This enables them to
    jointly evaluate queries without divulging anything except the query answers.
    Whereas prior works employed maliciously secure protocols for query evaluation,
    they do not provide end-to-end guarantees because they allow local computation
    for some partitions in plaintext, without verifying that their intermediate results
    are correct and complete with respect to their private databases. Moreover, these
    systems did not scale to large volumes or numerous parties in MPC.


    To this end, we propose CASTLE, a collaborative analytic system with secure, trustworthy,
    and scalable query evaluation. First, we use zero-knowledge proofs (ZKPs) to verify
    the integrity of local evaluation. Then we evaluate the remaining operators under
    MPC. To securely bridge them, we design an authenticated protocol that verifies
    ZKPs'' outputs, ensuring end-to-end trustworthiness from the inputs to the outputs
    of all data providers. In addition, we employ a dealer-aided MPC backend. The
    dealer generates and distributes pseudo-randomness, thereby avoiding overwhelming
    communication overhead and enabling scalability to more computing parties in practice.
    Moreover, we incorporate state-of-the-art ZK protocols to achieve linear-time
    verification complexity. Taken together, this system enhances scalability with
    respect to both data sizes and the number of nodes. Finally, we demonstrate up
    to 18.7X speedup over the full MPC baseline on TPC-H benchmark.'
  authors: Xiling Li, Jennie Rogers
  board_number: N6
  institution: Northwestern University
  number: 90
  room: Northwestern
  session: 2
  title: 'CASTLE: Collaborative Analytics via Secure, Trustworthy and Scalable Query
    Evaluation'
- abstract: 'Delivering instruction exceptions to user-space code enables a range
    of services, including floating point tracing and virtualization.

    Unfortunately, the usual forms of such delivery, signals or even specialized kernel
    modules, have high latency and overhead.

    We propose kernel-bypass exceptions (KBEs), hardware support to deliver certain
    exceptions safely and directly to user-space handlers.

    We then describe RAFT-V, a proof-of-concept, open-source prototype that extends
    the SonicBOOM RISC-V core and Linux to implement KBEs.

    RAFT-V also implements floating point trap support, which was not previously available
    on RISC-V in any form.

    RAFT-V lowers the latency and overhead of delivering these and other instruction
    exceptions to a user-space handler by 30x compared to signals.

    We use this functionality in RISC-V ports of the open-source FPSpy and FPVM floating
    point tracing and virtualization tools, reducing their costs by a factor of 3x.

    Our changes to add KBE and floating point trap features to RISC-V only marginally
    increase the overall hardware footprint and do not affect its critical path.

    We also discuss additional existing and novel events, such as page faults and
    value exceptions, that could benefit from KBEs.'
  authors: Karl Hallsby, Liam Strand, Peter Dinda
  board_number: N7
  institution: Northwestern University
  number: 91
  room: Northwestern
  session: 2
  title: Hardware-based Kernel-Bypass Exceptions to Accelerate User-Level Services
- abstract: "Recent research has demonstrated that hyperbolic machine learn\ning,\
    \ whichutilizes hyperbolic geometry to represent data and define\narithmetic operations,\
    \ can substantially enhance the efficiency and\naccuracy of machine learning tasks\
    \ on hierarchical data. Unfortu\nnately, the existing machine learning accelerators\
    \ cannot efficiently\nsupport hyperbolic operations, which require memory-intensive\n\
    data shuffling and reduction operations, significantly degrading\nthe utilization\
    \ of arithmetic-intensive hardware. In this work, we\npropose HyPIM, a novel hardware-software\
    \ co-design that exploits\nprocessing-in-memory (PIM) for accelerating memory-intensive\
    \ op\nerations in a heterogeneous system. Our experiments on real-world\nhyperbolic\
    \ machine learning models show that HyPIM significantly\nimproves the performance\
    \ of state-of-the-art GPUs by 3\xD7."
  authors: Jinlin Wu, Ferit Ozdaban, Selvanathan Sadhasivam, Xiaoyang Lu, YunhuiGuo,
    Minxuan Zhou
  board_number: N8
  institution: Illinois Institute of Technology, University of Texas at Dallas
  number: 94
  room: Northwestern
  session: 2
  title: 'HyPIM: Accelerating Hyperbolic Machine Learning via Processing-In-Memory'
- abstract: Modern HPC systems increasingly rely on heterogeneous GPU platforms from
    NVIDIA, Intel, and AMD, yet most resilience studies remain confined to a single
    vendor stack. It therefore remains unclear how the same logical fault is handled
    by different GPU backends. We perform a cross-architecture fault injection study
    that applies semantically aligned single-bit faults at the LLVM IR level before
    backend-specific lowering, enabling direct comparison across CUDA, SYCL, and HIP
    compilation flows. We evaluate representative heterogeneous benchmarks on three
    production supercomputers, Polaris, Aurora, and Frontier. Our analysis extracts
    several key insights into GPU resilience and suggests practical guidelines for
    applying fault mitigation strategies more effectively on heterogeneous GPU platforms.
  authors: Maisy Dunlavy, Zhiling Lan, Michael Papka
  board_number: N9
  institution: University of Illinois Chicago, Argonne National Laboratory
  number: 99
  room: Northwestern
  session: 2
  title: Cross-Architecture GPU Fault Injection at the LLVM IR Level
- abstract: "Multi-GPU systems are the building blocks of modern AI and HPC clusters.\
    \ The variery of vendors and hardware complexity creates a challenge in conceiving\
    \ composable, performant and portable applications [1]. Macro-dataflow systems\
    \ are a solution to meet this challenge, delegating the responsibility from programs\
    \ to architecture-aware compilers and runtime systems. Workloads are split into\
    \ tasks and distributed on available processors, implicitly overlapping computation\
    \ and data transfers following a data-flow [2].\n\nThis poster presents XK.BLAS:\
    \ the BLAS module of the Julia package XK.jl [3]. It provides BLAS APIs for multi-device\
    \ architectures natively in Julia, portably across all three major GPU vendors\
    \ (AMD, Intel, NVIDIA). XK.BLAS is built on top of the XKRT tasking runtime systems\
    \ and the XKBlas library \u2014 that implements a macro-dataflow programming model\
    \ [4]. We evaluate XK.BLAS primitives and its use as a multi-GPU backend for the\
    \ package Krylov.jl [5] showing up to 2.8\xD7 speedup when scaling from 1 to 4\
    \ H100 GPUs. More importantly, XK.BLAS solves Krylov.jl problems that would not\
    \ otherwise fit on a single GPU with no code changes at all."
  authors: Romain PEREIRA, Alexis MONTOISON, Michel SCHANEN, Swann PERARNAU
  board_number: N10
  institution: Mathematics and Computer Science Division (MCS, CELS)  Argonne National
    Laboratory
  number: 104
  room: Northwestern
  session: 2
  title: 'An Overview of XK.BLAS.jl: Composable and Portable Multi-GPU BLAS in Julia'
- abstract: 'Memory accesses have long been the primary bottleneck in compu-

    tation, and their performance relative to pure-compute operation

    grows worse year over year. This is a well-known and widely-

    explored problem with a rich history of mitigation strategies, the

    most instrumental of which is the memory hierarchy, and, as an

    extension, the inclusion of on-die SRAM caches. These techniques

    facilitate higher utilization of compute hardware in Graphics Pro-

    cessing Units (GPU), increasing performance. GPUs leverage their

    SIMT topology to coalesce loads at the warp-granularity; separate

    threads within the same warp performing accesses to the same

    cache line avoid generating duplicate requests to that line. This

    reduces contention in the memory system, improving compute

    throughput.

    Scheduling policies and optimizations are applied to order the

    execution of warps in pursuit of the same goal: maintaining high

    shader utilization. Through leveraging information from issued

    memory access instructions to inform a combined scheduling and

    cache replacement policy, slipstreaming encourages lock-stepped

    warp execution and mitigates thrashing by preventing the eviction

    of L1 cache lines common to contiguous warps in an SM. This

    optimization requires just 160KB of state (less than 1% the area

    of L2) and offers a 2% geomean speedup in GPU-wide IPC. The

    co-designed Slipstream-Clustering Loose Round Robin Scheduling

    and Slipstream-Clustering Least Recently Used Caching Policies

    emulate inter-warp coalescing, reducing expensive accesses to L2

    and Global Memory structures. In this paper, we demonstrate the

    latent potential for coalescing in GPU workloads. We investigate

    the properties of opportunities for coalescing, prevent and evaluate

    slipstreaming, and demonstrate its low cost.'
  authors: Connor Selna, Atmn Patel,  Vijay Kandiah, Nikos Hardavellas
  board_number: N11
  institution: Unaffiliated, Nvidia, Nvidia, Northwestern University
  number: 106
  room: Northwestern
  session: 2
  title: Reducing the "Drag" of GPU Memory Accesses with Slipstreaming
- abstract: This work presents LeakyLMs, a set of attacks that leak proprietary model,
    architecture, and deployment information from production language models. LeakyLMs
    is the first to demonstrate that key model and deployment details can be inferred
    using only token generation timing, even when interacting through remote APIs.
    LeakyLMs introduces two core attacks. The first attack targets inference optimizations
    and deployment strategies. For example, our attack detects whether a provider
    uses speculative decoding, a widely deployed inference-time optimization, and
    further identifies the context length of the draft model used in the pipeline.
    Our measurements show that Google Gemini Flash 2.5 uses speculative decoding with
    a draft context window of approximately 128K tokens. The second attack recovers
    key architectural properties, including the number of transformer layers, hidden
    dimension size, and number of attention heads. To achieve this, LeakyLMs builds
    a detailed and accurate model of token-generation timing on modern NVIDIA GPUs,
    characterizing how latency scales with model configuration and hardware parameters.
    The attack then performs a search over the architecture space using this timing
    model. In experiments with Llama models, the near-correct architectural configuration
    appears in the top-10 guesses more than 90% of the time.
  authors: Sadegh Majidi, Kazem Taram
  board_number: N12
  institution: Purdue University
  number: 107
  room: Northwestern
  session: 2
  title: 'Leaky Language Models: Leaking Architectural and Deployment Information
    from Production Language Models through Timing Side Channels'
- abstract: "WebGPU is a cross-platform GPU programming\nstandard that maps a single\
    \ shader codebase to Vulkan, Di-\nrect3D 12, and Metal, reaching every major GPU\
    \ vendor on\nboth web browsers and native runtimes. However, unlike vendor-\n\
    specific ecosystems that ship mature compute libraries (e.g.,\nThrust for CUDA),\
    \ WebGPU currently lacks a standard library\nof reusable GPU compute primitives.\
    \ As a step toward filling this\ngap, we implement a representative family of\
    \ GPU set operations,\nnamely intersection, union, difference, and symmetric difference,\n\
    in WebGPU. Our implementation provides eight set operations\n(four keys-only and\
    \ four key-value variants) through a single\npipeline abstraction and introduces\
    \ a batched execution model\nthat processes thousands of input-array pairs in\
    \ a single GPU\nsubmission. We demonstrate the efficacy of our implementation\n\
    across five GPU platforms, NVIDIA RTX 3060, NVIDIA A100\n(Polaris supercomputer),\
    \ AMD, Intel integrated, and Apple\nSilicon, and three application domains: frequent\
    \ itemset mining\n(ECLAT), SQL query execution (TPC-H Q12), and genomic\nJaccard\
    \ similarity. On the A100, WebGPU runs within 14% of\nnative CUDA across all workloads;\
    \ on the RTX 3060, the gap\nwidens to 1.16\xD7\u20131.60\xD7 (WebGPU slower).\
    \ Our batched pipeline\noutperforms Thrust by up to 9.9\xD7 end-to-end on high-pair-count\n\
    workloads. The same WGSL code produces correct results on all\nfive platforms\
    \ without modification, confirming that WebGPU is\na viable platform for scalable\
    \ and portable GPU computing."
  authors: Jiaxin Lu, Landon Dyken, Sidharth Kumar
  board_number: N13
  institution: University of Illinois Chicago
