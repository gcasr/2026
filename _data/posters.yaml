  number: 58
  room: Lake
  session: 1
  title: Empowering scientific workflows with federated agents
- abstract: The Sage Grande Testbed is an open artificial intelligence testbed that
    supports edge computing and intelligent sensing. The platform allows researchers
    to develop new AI algorithms and measurement strategies. After a decade of experience,
    our current project is set to deploy 300 new state-of-the-art AI-enabled platforms
    across the USA, and in every state. Scientists and students can explore next-generation
    AI-enabled infrastructure for real-time monitoring of sensor data for many applications
    including wildfire, flooding, and agriculture. As edge computing platforms become
    more powerful, they can support bigger AI models, including large language models
    (LLMs). In the future, scientists will be able to use natural language prompts
    and AI agents to program their sensing strategies and collect relevant data. With
    new AI-enabled infrastructure, Sage can provide users with new ways to write programs
    and control Sage nodes.
  authors: Neal Conrad, Peter Lebiedzinski, Francisco Lozano, Yongho Kim, Sean Shahkarami,
    Nicola Ferrier, Rajesh Sankaran, Pete Beckman
  board_number: L22
  institution: Argonne National Laboratory, Northwestern University
  number: 63
  room: Lake
  session: 1
  title: The Sage Grande Testbed
- abstract: "Evaluating AI systems at scale,\_particularly\_domain-specific tasks,\_\
    remains\_difficult due to the lack of\_extensible\_and\_reproducible benchmarking\
    \ frameworks. We present a benchmarking toolkit for large-scale image search,\
    \ designed to enable systematic evaluation, comparison, and improvement of retrieval\
    \ systems across models, datasets, and deployment environments.\_Our toolkit supports\
    \ the full benchmarking lifecycle: dataset ingestion, query generation, relevance\
    \ annotation, and metric-driven evaluation. It enables the construction of domain-specific\
    \ benchmarks with rich metadata and controllable difficulty, supporting use cases\
    \ such as environmental monitoring and wildfire detection. The framework integrates\
    \ standard retrieval metrics (e.g., NDCG, precision, recall) alongside diversity-aware\
    \ measures such as intra-list similarity,\_providing\_a more complete view of\
    \ system performance.\_A key feature is its tight coupling with real-world retrieval\
    \ pipelines. The toolkit evaluates search systems that combine semantic embeddings,\
    \ keyword retrieval (BM25), and reranking models, while remaining model-agnostic\
    \ and infrastructure-independent. This allows researchers to benchmark different\
    \ architectures, indexing strategies, and ranking approaches under consistent\
    \ conditions. The system is designed with reproducibility and scalability as first-class\
    \ concerns: experiments are fully scriptable, benchmarks are portable, and evaluation\
    \ workflows can be applied to both historical datasets and live data streams.\
    \ When deployed on large-scale datasets such as those from the Sage Continuum\
    \ (tens of millions of images), the toolkit enables rigorous, system-level analysis\
    \ of trade-offs between\_retrieval\_quality\_and latency.\_This work\_establishes\_\
    a general-purpose, extensible foundation for benchmarking multimodal retrieval\
    \ systems in domain-specific settings."
  authors: Francisco Lozano
  board_number: L23
  institution: Northwestern University, Argonne National laboratory
  number: 65
  room: Lake
  session: 1
  title: A Scalable Benchmarking Toolkit for AI-Driven Image Search
- abstract: 'Edge computing enables real-time data processing with low latency and
    improved privacy, making it well-suited for continuous audio sensing applications.
    In this work, we present a real-time speech transcription system deployed on NVIDIA
    Jetson edge devices using optimized implementations of OpenAI Whisper. The system
    captures live audio from a microphone and performs on-device inference to generate
    continuous text output without relying on cloud resources.


    We focus on building a streaming pipeline that supports continuous transcription
    by segmenting incoming audio into overlapping time windows and incrementally processing
    them. To operate under the resource constraints of edge hardware, we evaluate
    multiple Whisper model variants and analyze trade-offs between accuracy, latency,
    and memory usage. System-level optimizations, including GPU acceleration and efficient
    audio buffering, are applied to improve throughput and responsiveness.


    We evaluate the system using real-world audio streams and benchmark its performance
    against reference transcriptions. Results show that real-time transcription is
    feasible on edge platforms with acceptable accuracy and latency, demonstrating
    the practicality of deploying modern speech models outside of cloud environments.


    This work highlights the potential of edge-based speech intelligence systems and
    contributes a scalable approach for continuous, on-device audio transcription
    in real-world settings.'
  authors: Samin Sohrabi
  board_number: L24
  institution: University of Illinois at Chicago
  number: 70
  room: Lake
  session: 1
  title: Edge-Based Audio Sensing for Real-Time Event Detection and Speech Processing
- abstract: "Scientific discovery increasingly relies on the collaboration between\
    \ diverse institutions, such as telescope observatories, satellites, and laboratories,\
    \ which each observe only a fragment of the underlying phenomenon.\n\nWe study\
    \ private, distributed inference in this setting, where such parties hold partial,\
    \ multi-modal observations over local timestamps and cannot directly share raw\
    \ data. We model the system as a multilayer tree comprising participant nodes,\
    \ intermediate forwarders, and a trusted root orchestrator that coordinates request\
    \ fulfilment and computation. Each node submits requests when the required modalities\
    \ for a fixed calculation are missing locally. \n\nWe evaluate our privacy-aware\
    \ network routing protocol under varying environmental conditions: data availability,\
    \ network topology, and request constraints such as accuracy and speed. To validate\
    \ this protocol, we compare it against an integer linear program baseline for\
    \ the model system with the objective set to minimise communication overhead across\
    \ the network. We also take into account the variable sizes of these modalities\
    \ (e.g. numerical data, images, videos). \n\nIn preliminary per-timestamp settings,\
    \ our protocol matched the ILP baseline on feasibility and communication cost\
    \ across 25,536 request-level evaluations while reducing mean runtime from 8.15s\
    \ to 0.08s, a roughly 99x improvement. It maintained 100\\% successful calculation\
    \ completion with zero failures, while a random baseline incurred 14.8\\% higher\
    \ communication cost. These results suggest that structured routing can preserve\
    \ optimization-quality performance while making distributed scientific inference\
    \ far more practical."
  authors: Vivek Rai, Nathaniel Hudson
  board_number: N2
  institution: Illinois Institute of Technology
  number: 6
  room: Northwestern
  session: 1
  title: Private Inference for Decentralized Multimodal Data Silos
- abstract: "Modern IoT and embedded platforms must start execution from a known trusted\
    \ state to thwart persistent malware and protect critical infrastructure. Current\
    \ approaches to establish a root of trust depend on manufacturer-provisioned secret\
    \ keys and specialized secure hardware. If secrets are leaked or a hardware vulnerability\
    \ is discovered, the security of the entire device is permanently subverted. Furthermore,\
    \ these methods drive up costs, may involve third-parties, and rely on assumptions\
    \ about an attacker\u2019s computational power that may not hold over the device\u2019\
    s lifespan. \n\nThis paper presents TRUSTCHECKPOINTS, the first implementation\
    \ of an unconditional software root of trust on commodity hardware. We define\
    \ malware operationally as any deviation from the device\u2019s expected memory\
    \ contents, and detect it by physical footprint. Our novel algorithm, MULTIPASS,\
    \ uses k-independent randomized polynomial evaluation (via Horner\u2019s rule)\
    \ to force persistent malware into slower off-chip storage, causing detectable\
    \ timing delays. An external verifier, physically connected to the device by the\
    \ owner, measures these delays to detect even single-instruction payloads, enabling\
    \ integrity checking without cryptographic keys or specialized trusted hardware.\n\
    \nOur ARM Cortex-A53 prototype validates 192 KB of SRAM in \u223C10 s using 500\
    \ passes. Two modes, SRAM-bootstrap and full-memory scan, balance speed and coverage\
    \ on unmodified hardware. Our evaluation introduces new assumptions that bound\
    \ unconditional software root-of-trust establishment.\n"
  authors: Friedrich Doku, Peter Dinda
  board_number: N3
  institution: Northwestern University
  number: 7
  room: Northwestern
  session: 1
  title: 'TRUSTCHECKPOINTS: Time Defeats Malware for Unconditional Software Root of
    Trust'
- abstract: Processing-in-Memory (PIM) reduces the data-to-compute critical path,
    but its low-level interfaces makes PIM difficult to program. To bridge this gap,
    we have designed and implemented PolymerPIM for the UPMEM PIM system. PolymerPIM
    enables the programmer to write composable vector operations with broadcast semantics
    in either C++ or Julia. At runtime, these operations queue tasks that represent
    deferred execution. The executor fuses and compiles tasks upon first use. By applying
    both vertical and horizontal fusion, PolymerPIM automatically generates highly
    optimized kernels that minimize data movement and maximize the amount of computation
    per byte transferred. PolymerPIM improves ease of use without sacrificing speed,
    matching the performance of hand-tuned code.
  authors: David Krasowska, Andrew Crotty, Peter Dinda
  board_number: N4
  institution: Northwestern University
  number: 11
  room: Northwestern
  session: 1
  title: Deferred Execution for High-Performance Code Generation on Processing-in-Memory
    Systems
- abstract: How vulnerable are scientific applications to conventional attacks mounted
    through their inputs? Prior work largely leaves this question unanswered. We begin
    to answer through a challenging adaptation of security-focused fuzzing and bug
    triage to identify and characterize vulnerabilities in a set of scientific codebases.
    Our process discovers almost 1000 unique crash clusters (distinct bugs), across
    Enzo, GROMACS, Laghos, and LAMMPS (about 3 million lines of code). Per target,
    an average of 7.3% of crash clusters represent easily exploitable vulnerabilities
    according to heuristic security analysis. Additionally, 25% of all clusters (52%
    for GROMACS) are exploitable heap memory safety issues. Our overall analysis points
    to over 110 distinct vulnerabilities that may permit arbitrary code execution.
    Manual inspection confirms the existence of exploitable bugs. Our results suggest
    untrusted data could have catastrophic effects on artifact integrity, creating
    a real risk for institutions and society as computational scientific results drive
    increasingly consequential decisions.
  authors: Michael Polinski, Peter Dinda
  board_number: N5
  institution: Northwestern University
