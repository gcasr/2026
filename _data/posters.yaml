- abstract: "Recent research has demonstrated that hyperbolic machine learn\ning,\
    \ whichutilizes hyperbolic geometry to represent data and define\narithmetic operations,\
    \ can substantially enhance the efficiency and\naccuracy of machine learning tasks\
    \ on hierarchical data. Unfortu\nnately, the existing machine learning accelerators\
    \ cannot efficiently\nsupport hyperbolic operations, which require memory-intensive\n\
    data shuffling and reduction operations, significantly degrading\nthe utilization\
    \ of arithmetic-intensive hardware. In this work, we\npropose HyPIM, a novel hardware-software\
    \ co-design that exploits\nprocessing-in-memory (PIM) for accelerating memory-intensive\
    \ op\nerations in a heterogeneous system. Our experiments on real-world\nhyperbolic\
    \ machine learning models show that HyPIM significantly\nimproves the performance\
    \ of state-of-the-art GPUs by 3\xD7."
