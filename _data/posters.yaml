  title: Turbocharging Parallel Backtesting with High-Performance Storage Systems
- abstract: 'Reinforcement learning (RL) performs well for tasks in complex environments
    when clearly specified desired outcomes are available, but it comes at the cost
    of a lack of formal safety guarantees. This drawback is in part due to the "black-box"
    nature of RL and the finiteness of training runs, and in part due to semantic
    differences between formal safety models (nondeterministic physics models and
    nondeterministic action safety envelopes) and the RL training environment (simulated
    environment with stochastic actions). This makes translating the safety logic
    to the RL environment a safety-critical, laborious, and error-prone process.

    We propose a formal specification language that ties formal models to RL environments
    through automated synthesis. Our method is based on differential dynamic logic
    to specify safety models, extended with annotations to aid translation to the
    Gymnasium environment. Structured syntactic annotations in the form of comments
    in the formal model allow the user to link the formal specification to the reward/penalty
    signals and the gradients more precisely.

    // Rewarding speed (reward=isEfficient <=> reward=v-0)

    // @progress: reward=isEfficient, on_success=continue, on_failure=continue

    Bool isEfficient(Real v) <-> ( v > 0 );


    // Limit speed and enforce safety distance (shape=isSafe <=> shape=(abs(x-xo)
    - stopDist(v))

    // @safety: penalty=-1000, shape=isSafe, on_failure=truncate:status=failure, on_success=continue

    Bool isSafe(Real x, Real xo, Real v) <-> (abs(x-xo) > stopDist(v));

    The framework then automatically generates an RL environment and reward signals.
    This allows the RL agent to be trained on the same safety specifications that
    were formally proven correct in differential dynamic logic and greatly reduces
    the effort of reward engineering.'
  authors: Thuan T. Cao; Stefan Mitsch
  board_number: L13
  institution: Depaul University
  number: 38
  room: Lake
  session: 1
  title: Formal-assisted Reinforcement Learning
- abstract: 'Operating system performance depends critically on kernel policy

    choices, yet these policies are typically selected statically despite

    dynamic and heterogeneous workloads. While an agent managing

    an operating system can observe the outcome of the policy it applies,

    it fundamentally lacks access to counterfactual feedback - how

    alternative kernel policies would have behaved under the same

    workload without risking system stability.

    We present pMVX, a framework for adaptive kernel policy selection based on policy-level
    multi-version execution. pMVX evaluates multiple kernel policy variants concurrently
    across isolated

    OS instances executing identical workloads, enabling empirical

    comparison without impacting production systems. The resulting

    observations are distilled into a lightweight mapping from eBPF derived workload
    characteristics to effective policies, which guides

    safe runtime policy selection. We instantiate pMVX with a self-tuning Linux scheduler
    built on top of sched_ext, and show that

    it improves performance over static schedulers across a range of

    scheduling-sensitive workloads.'
  authors: Sujot Singh, Kenan Alghythee, Chalmers Phua , Xiaoguang Wang
  board_number: L14
  institution: University of Illinois Chicago
  number: 39
  room: Lake
  session: 1
  title: 'pMVX: Policy-Level Multi-Version Execution for Agentic OS Kernel Self-Tuning'
- abstract: 'A long line of work in data provenance has investigated how to support
    provenance capture for relational databases. However, achieving high performance
    for complex queries has been challenging: systems with low overhead had to heavily
    modify the execution engine (and other components) of the database system, while
    less-invasive systems incur high overhead. In this work, we propose TraceProv,
    a data provenance capture system that achieves low overhead without being invasive.
    Our approach is based on a lightweight, parallelism-friendly logging framework
    that uses memory-mapped files and a two-phase capture strategy that opportunistically
    combines logging with propagation. TraceProv utilizes extensibility mechanisms
    supported by most databases, and supports complex analytical queries using features
    such as nested subqueries, aggregation, order-by with limit, window functions,
    and many others. We implement TraceProv on PostgreSQL and DuckDB, and experimentally
    compare against SOTA relational provenance systems. TraceProv outperforms non-invasive
    techniques and is competitive to or faster than invasive systems. Compared to
    invasive systems, our approach requires significantly less implementation effort
    and is easier to port to new database systems or new versions of an already supported
    system.'
  authors: Vinayak Jha, Dr. Boris Glavic
  board_number: L15
  institution: University of Illinois at Chicago
  number: 43
  room: Lake
  session: 1
  title: 'TraceProv: All You Need is Log - Efficient Bolt-on Provenance Capture for
    Complex Relational Queries'
- abstract: 'Notebook workflows are widely used for exploratory and iterative scientific
    computing, but they remain difficult to scale and reproduce across heterogeneous
    HPC systems. While distributed execution frameworks enable notebooks to run at
    scale, portability is often hindered by incomplete execution context and site-specific
    assumptions. For data-intensive workflows, the primary barrier is data: datasets
    originate from heterogeneous storage systems, and notebooks frequently embed hard-coded
    paths and ad hoc staging logic that limit reuse and reproducibility.


    We present a data-centric approach for portable execution of notebook workflows
    using the Backpack abstraction, which captures software environments, data dependencies,
    and resource requirements in a portable specification. To address data portability,
    we introduce a declarative data specification that separates data handling from
    notebook code and enables consistent materialization of datasets at stable runtime
    paths across systems. Our design supports multiple data sources and integrates
    a metadata-driven fingerprinting mechanism that combines source metadata with
    specification attributes to generate deterministic identifiers for datasets. This
    enables efficient cache reuse across executions while ensuring that changes in
    data or configuration trigger re-staging.


    We evaluate our approach using three real-world data-intensive applications across
    three HPC systems with different schedulers and storage architectures. Results
    show that workflows execute unchanged across sites, with improved reproducibility
    and reduced data staging overhead through cache reuse.'
  authors: Md Saiful Islam, Douglas Thain
  board_number: L16
  institution: University of Notre Dame
  number: 44
  room: Lake
  session: 1
  title: Portable Execution of Data-Intensive Notebook Workflows Across Heterogeneous
    HPC Systems
- abstract: In high-performance computing (HPC), users must submit resource requirements
    for their jobs, with user-supplied walltime being a critical parameter. However,
    these estimates are notoriously inaccurate, as users tend to overestimate walltime
    to prevent the scheduler from terminating their jobs prematurely. While existing
    work on learning-based walltime prediction primarily focuses on maximizing prediction
    accuracy, such predictions are inherently risky for walltime recommendations.
    Specifically, underestimation leads to job termination before completion, resulting
    in lost progress and wasted resources. In this study, we present SafeWall, a novel
    recommendation method that adjusts walltime predictions by incorporating an explicit,
    nonnegative safety buffer to mitigate underestimation risk. The core of our approach
    is a risk-aware buffer that dynamically calibrates safety margins based on individual
    user's historical behavior. When user data is limited, the system employs statistical
    shrinkage to align these margins with a global baseline, ensuring robustness.
    This yields a lightweight mechanism that optimizes the trade-off between prediction
    accuracy and termination risk. SafeWall is modular and applicable to various learning-based
    prediction models. We evaluate SafeWall using five public workload traces, including
    the full-lifetime job log from the 4,392-node Theta machine at the Argonne Leadership
    Computing Facility. Across all traces, SafeWall substantially reduces underestimation
    risk compared to the unbuffered base predictors, while preserving competitive
    accuracy.
  authors: Kanglin Xu, Michael Papka, Zhiling Lan
  board_number: L17
  institution: University of Illinois Chicago
  number: 48
  room: Lake
  session: 1
  title: 'SafeWall: Risk-Aware Job Walltime Recommendation for HPC Scheduling'
- abstract: 'Volumetric image processing pipelines, particularly in connectomics,
    process petascale datasets through block-wise decomposition, resulting in irregular,
    multi-stage workloads. Existing task scheduling frameworks address computational
    imbalance but overlook key domain-specific characteristics, including spatial
    locality, overlapping (halo) regions, object-level irregularity, and data movement
    across HPC systems. As a result, these approaches often incur redundant computation,
    excessive data movement and sub-optimal resource usage, which are significant
    bottlenecks at scale.

    In this work, we identify the limitations of state-of-the-art scheduling approaches
    for connectomics workloads and demonstrate that load balancing alone is insufficient
    for optimal performance. We show that effective scheduling must also consider
    task granularity, spatial adjacency and pipeline-stage-specific behavior to minimize
    end-to-end runtime.

    To address these irregularities, we propose a domain-aware task scheduling framework
    which incorporates (1) spatial locality-aware task placement to reduce communication
    and I/O overhead, (2) cost-aware scheduling using predictors derived from input
    characteristics and (3) adaptive task scheduling policies that tailor scheduling
    strategies to different phases of the connectomics pipeline. We will also evaluate
    this framework on different stages of a connectomics workflow and compare it with
    existing task-scheduling strategies.'
  authors: Jyotsna Rajaraman, Michael E. Papka
  board_number: L18
  institution: University of Illinois Chicago
  number: 49
  room: Lake
  session: 1
  title: Optimized Task Scheduling for Connectomics and Large-Scale Image Processing
    Workloads
- abstract: "Industrial Control Systems (ICSs) rely on Programmable Logic Controllers\
    \ (PLCs) to operate within a set of states. The states are composed of variables\
    \ that determine how sensor data is interpreted, configuration parameters are\
    \ applied, and actuator commands are issued. Recent works have shown that attackers\
    \ can manipulate these variables to compromise ICS safety and security. To detect\
    \ such attacks, previous approaches have leveraged invariants\u2014a set of rules\
    \ defining the correct behavior of an ICS. However, these invariants suffer from\
    \ a critical limitation: they are state-agnostic. This means they define variable\
    \ ranges across all possible ICS states, leading to loosely bounded detection\
    \ thresholds. Unfortunately, attackers can exploit these loose bounds and launch\
    \ stealthy attacks that evade detection without violating such invariants. \n\n\
    In this paper, we introduce SAIN, an automated method to derive state-aware ICS\
    \ invariants with tighter bounds and enforce them through a PLC-based monitor.\
    \ SAIN first generates invariant templates by identifying the PLC program states,\
    \ state transitions, and the inter-dependencies among sensing, actuation, and\
    \ configuration variables within each state through program analysis. It then\
    \ partitions the ICS data traces into state-specific sub-traces and quantifies\
    \ the invariant templates with concrete, tighter bounds, as system-specific knowledge\
    \ about the subject ICS. Lastly, it enforces the state-aware invariants through\
    \ a run-time monitor. We evaluate SAIN on a Fischertechnik manufacturing plant\
    \ and a chemical plant simulator against 17 attacks. SAIN protects the plants,\
    \ on average, with a false positive rate of 2% and a run-time overhead of 3%."
  authors: Syed Ghazanfar Abbas, Muslum Ozgur Ozmen, Abdulellah Alsaheel, Arslan Khan,
    Z. Berkay Celik, Dongyan Xu
  board_number: L20
  institution: Purdue University
  number: 51
  room: Lake
  session: 1
  title: 'SAIN: Improving ICS Attack Detection Sensitivity via State-Aware Invariants'
- abstract: 'Agentic systems, in which diverse agents cooperate to tackle challenging
    problems, are exploding in popularity in the AI community. However, existing agentic
    frameworks take a relatively narrow view of agents, apply a centralized model,
    and target conversational, cloud-native applications (e.g., LLM-based AI chatbots).
    In contrast, scientific applications require myriad agents be deployed and managed
    across diverse cyberinfrastructure. Here we introduce ACADEMY, a modular and extensible
    middleware designed to deploy autonomous agents across the federated research
    ecosystem, including HPC systems, experimental facilities, and data repositories.
    To meet the demands of scientific computing, ACADEMY supports asynchronous execution,
    heterogeneous resources, high-throughput data flows, and dynamic resource availability.
    It provides abstractions for expressing stateful agents, managing inter-agent
    coordination, and integrating computation with experimental control.

    We present microbenchmark results that demonstrate high performance and scalability
    in HPC environments. To explore the breadth of applications that can be supported
    by agentic workflow designs, we also present case studies in materials discovery,
    astronomy, decentralized learning, and information extraction in which agents
    are deployed across diverse HPC systems.'
  authors: Alok Kamatar, J Gregory Pauloski, Yadu Babuji, Ryan Chard, Mansi Sakarvadia,
    Daniel Babnigg, Kyle Chard, Ian Foster, Suman Raj, Augustus Ellerm
  board_number: L21
