  title: How To Evaluate Compiler Diagnostics for AI Coding Agents
- abstract: "Large language models (LLMs) have recently emerged as promising tools\
    \ for time series forecasting by repurposing sequence modeling capabilities originally\
    \ developed for natural language. In this work, we study CryptexLLM, an LLM-based\
    \ framework for Bitcoin forecasting that adapts structured OHLCV time series into\
    \ forms compatible with frozen language model backbones. Our goal is not only\
    \ to evaluate predictive performance, but also to examine model stability and\
    \ uncertainty in a highly volatile, non-stationary financial setting. First, we\
    \ investigate temporal robustness by training CryptexLLM on different historical\
    \ Bitcoin windows while keeping the same future evaluation period fixed. Using\
    \ a reproducible pipeline with strict time-ordered splits, automated inference\
    \ on a fixed 2022\u20132025 holdout window, and unified experiment tracking, we\
    \ compare multiple fixed and expanding training windows. Results suggest that\
    \ while some windows yield slightly better metrics, overall behavior remains broadly\
    \ consistent across market eras. Second, we explore whether internal LLM signals\
    \ such as hidden-state features and attention-derived representations can provide\
    \ useful indicators of predictive uncertainty. We analyze correlations between\
    \ these internal representations and downstream error metrics to assess whether\
    \ they help identify unreliable forecasts before deployment. We further position\
    \ these signals alongside traditional uncertainty estimation approaches in time\
    \ series analysis to evaluate their complementary value. Taken together, our findings\
    \ suggest that CryptexLLM is relatively stable across shifting historical regimes\
    \ and that internal LLM dynamics may offer a promising path toward risk-aware\
    \ forecasting. This work supports future development of filtering and risk-adjustment\
    \ pipelines for decision-oriented financial prediction."
  authors: Het Patel, Anver Kurmushiev, John Chumara, Loan Raicu
