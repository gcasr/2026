  long_bio: "Hai Duc Nguyen is a Postdoctoral Appointee in the Data Science and Learning\
    \ Division at Argonne National Laboratory and a CASE Postdoctoral Scholar at the\
    \ University of Chicago. Recently, his work has centered on developing resilient,\
    \ large-scale high-performance software systems and techniques. He has received\
    \ several awards, including Best Paper Awards at IEEE CLOUD 2023 and WoSC5. He\
    \ earned both his Ph.D. and M.Sc. degrees in Computer Science from the University\
    \ of Chicago, and his B.E. in Computer Engineering from Ho Chi Minh City University\
    \ of Technology, Vietnam National University Ho Chi Minh City.<br/><br/>Bogdan\
    \ Nicolae is a Computer Scientist at Argonne National Laboratory and a Research\
    \ Professor at the Illinois Institute of Technology. He specializes in scalable\
    \ storage, data management, and fault tolerance for large-scale distributed systems,\
    \ particularly at the intersection of high-performance computing, big data analytics,\
    \ and artificial intelligence. He is interested in and has authored numerous papers\
    \ in areas such as checkpoint-restart, state capture and migration, data and metadata\
    \ decentralization, high availability, concurrency control in data management,\
    \ multi-versioning and historic access, declarative data models, and HPC techniques\
    \ for training, fine-tuning, and inference of AI models at scale. He is a senior\
    \ member of ACM and IEEE. He is a regular program committee member and participates\
    \ in the organization of major international conferences on parallel and distributed\
    \ systems. He serves as an associate editor of IEEE Transactions on Parallel and\
    \ Distributed Systems.<br/><br/>Tekin Bicer is a Computer Scientist in the Data\
    \ Science and Learning Division at Argonne National Laboratory. He also holds\
    \ joint appointments in the Consortium for Advanced Science and Engineering at\
    \ the University of Chicago and the X-ray Science Division at the Advanced Photon\
    \ Source. His research focuses on parallel and distributed systems, high-performance\
    \ computing, cloud computing, and data science. His recent work involves AI/ML-accelerated\
    \ large-scale high-performance software systems and techniques. He has received\
    \ several awards, including the Best Paper Award at SC 2020, Top Recognition at\
    \ the SCinet Technology Challenge at SC 2019, and a Best Paper nomination at CCGrid\
    \ 2014. He earned both his Ph.D. and M.Sc. degrees from the Computer Science and\
    \ Engineering Department at Ohio State University. He is a senior member of IEEE\
    \ and ACM.<br/><br/>Amal Gueroudji is a Postdoctoral Appointee at Argonne National\
    \ Laboratory, specializing in high-performance computing and data management.\
    \ She earned her Ph.D. from Universit\xE9 Grenoble Alpes and conducted research\
    \ at Maison de la Simulation, a collaborative laboratory involving CEA, CNRS,\
    \ Universit\xE9 Paris-Saclay, and Universit\xE9 Versailles Saint-Quentin. Her\
    \ work focused on integrating bulk synchronous parallel simulations with distributed\
    \ task-based in situ data analysis, specifically coupling MPI codes with Dask\
    \ Distributed. At Argonne, she continues to advance research in workflows and\
    \ data services for scientific computing. Her expertise includes high-performance\
    \ computing, distributed computing, in situ analytics, and task-based programming.<br/><br/>Matthieu\
    \ Dorier has been a Software Development Specialist at Argonne National Laboratory\
    \ since 2017, following a two-year postdoctoral appointment at Argonne. His research\
    \ focuses on data storage and data management for HPC, data services, in situ\
    \ analysis and visualization, and software development methodologies for HPC applications.\
    \ He is one of the core developers behind the R&D 100 Award-winning Mochi project,\
    \ which proposes a collection of libraries and methodologies for the rapid development\
    \ of HPC data services. Matthieu earned his Ph.D. from \xC9cole Normale Sup\xE9\
    rieure de Rennes, France, in 2014, for which he won second place in the Gilles\
    \ Kahn Award from the Soci\xE9t\xE9 Informatique de France and the French Academy\
    \ of Sciences.<br/><br/>Kyle Chard is a Research Associate Professor in the Department\
    \ of Computer Science at the University of Chicago. He also holds a joint appointment\
    \ at Argonne National Laboratory. He received his Ph.D. in Computer Science from\
    \ Victoria University of Wellington, New Zealand, in 2011. He is a member of ACM\
    \ and IEEE, received the IEEE TCHPC Award for Excellence for Early Career Researchers\
    \ in HPC, was part of the Globus team that won an R&D 100 Award, and received\
    \ the New Zealand Top Achiever Doctoral Scholarship. He co-leads the Globus Labs\
    \ research group, which focuses on a broad range of research problems in data-intensive\
    \ computing and research data management.<br/><br/>Ian Foster is the Director\
    \ of the Data Science and Learning Division, Senior Scientist, and Distinguished\
    \ Fellow at Argonne National Laboratory, and the Arthur Holly Compton Distinguished\
    \ Service Professor of Computer Science at the University of Chicago. He was the\
    \ Director of Argonne\u2019s Computation Institute from 2006 to 2016. Foster\u2019\
    s research contributions span high-performance computing, distributed systems,\
    \ and data-driven discovery. He has published hundreds of scientific papers and\
    \ eight books on these and other topics. Foster received a B.Sc. (Hons I) degree\
    \ from the University of Canterbury, New Zealand, and a Ph.D. from Imperial College,\
    \ United Kingdom, both in computer science. He is a Fellow of AAAS, ACM, BCS,\
    \ and IEEE."
