- abstract: 'Large language model coding agents are increasingly used to generate
    scientific data-analysis workflows, but evaluations usually stop at output correctness.
    For data-intensive science, this is incomplete: two workflows can produce the
    same valid result while placing very different pressure on storage systems. This
    poster studies I/O behavior in correctness-passing LLM-generated scientific workflows.


    We evaluated Sonnet 4.5, Gemini 2.5 Flash, and Gemma 4 26B on five tasks: climate
    reanalysis, satellite raster processing, meteorological time-series composition,
    neuroscience HDF5/NWB analysis, and genomic variant-format conversion. Each workflow
    was executed in a container and validated against expected scientific outputs.
    For passing runs, we traced POSIX-level reads, writes, metadata operations, and
    per-step behavior, then compared the resulting I/O profiles against expert-written
    implementations.


    Across these five tasks, 46 of 105 agent-generated workflows passed validation.
    We summarized only cases where the same model completed the same task successfully
    at least three times. In all of those comparisons, the expert implementation used
    fewer POSIX operations and read less data. The median validated agent workflow
    used 3.8x more POSIX operations and read 6.5x more data than the expert baseline.
    We decomposed I/O into final-solution execution versus exploratory steps such
    as failed attempts, inspection, and verification. Exploration overhead varied
    by model: some passing runs concentrated nearly all I/O in the final solution,
    while others spent much more I/O during exploration.


    These results suggest that correctness alone is insufficient for evaluating LLM-generated
    scientific code. Storage behavior should be measured directly, especially before
    deploying agent-generated workflows on shared HPC or cloud storage systems.'
