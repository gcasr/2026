  title: 'MEMO: High-Throughput Blockchain using Memoization'
- abstract: "Property-based testing (PBT), introduced by Haskell\u2019s QuickCheck,\
    \ is becoming more popular using tools like junit-quickcheck. Developers define\
    \ a property and a generator that produces well-formed, randomized inputs. The\
    \ property is repeatedly tested against fresh inputs to verify a property of the\
    \ system, such as a serialization round-trip. Failures often expose edge-case\
    \ bugs, while passing tests increase confidence of the system. However, traditional\
    \ test coverage tools perform poorly when evaluating PBT coverage.\nIn this poster,\
    \ we present PropCov, a tool for understanding coverage in PBT that also provides\
    \ suggestions for coverage improvement. PropCov employs a novel combination of\
    \ static analysis with PBT to approximate the maximum possible coverage, providing\
    \ an effective measure of the PBT coverage and making suggestions on paths to\
    \ improve existing tests. PropCov features an easily extensible architecture that\
    \ can support new languages, build systems, and PBT frameworks.\nWe evaluated\
    \ PropCov using 25 Java projects using junit-quickcheck or jqwik, totaling 293\
    \ properties, and found that existing tools report missed coverage that is impossible\
    \ to reach (86% of lines that JaCoCo reports as not covered), which leads developers\
    \ to consider hundreds of extra lines of code (2910). Unlike existing coverage\
    \ tools, PropCov results are accurate \u2014 only 7.5% of all properties contain\
    \ unfeasible code, and PropCov only misses 4% of reachable code. Using PropCov\u2019\
    s suggestions, we increased the coverage of 42 tests over 7 projects and found\
    \ 5 new bugs in 4 projects."
  authors: "Jesse Coultas;  Joseph Wiseman; Lu\xEDs Pina"
  board_number: N7
  institution: University of Illinois Chicago
  long_bio: "Jesse Coultas:<br/>Jesse Coultas is a Ph.D. student in Computer Science\
