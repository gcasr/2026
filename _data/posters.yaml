    \ Performance Computing, an NSF Trusted Cyberinfrastructure Fellow (2020), and\
    \ received two PNNL Outstanding Performance Awards in 2024.<br/><br/>Nathan R.\
    \ Tallent<br/>Nathan R. Tallent is a Chief Computer Scientist in the Future Computing\
    \ Technologies group at Pacific Northwest National Laboratory, within the Advanced\
    \ Computing, Mathematics, and Data Division. He directs PNNL's continuum computing\
