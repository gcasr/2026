  title: Applications do I/O. What if files actually went... somewhere else?
- abstract: Short video platforms like TikTok, Instagram Reels, etc., have gained
    popularity in multimedia by reshaping video consumption. The small video duration
    and unique swipe feature in the short video platforms made recommendation and
    preloading mechanisms crucial. Existing studies focused on optimizing the recommendation
    and preloading mechanisms to enhance the user experience using conventional and
    learning based approaches. However, existing studies use different experimental
    designs to evaluate their mechanisms, which could potentially lead to less reliable
    results in various environments. Hence, in this work we explore various experimental
    designs and evaluate the efficiency of existing mechanisms under various experimental
    designs. We provide guidelines to make better experimental design choices.
  authors: Annapurna B. Puttaswamy and Aaron D. Striegel
  board_number: R6
  institution: University of Notre Dame
  long_bio: "ANNAPURNA B. PUTTASWAMY's research highly focuses on multimedia systems,\
    \ computer networking, and Quality of Experience (QoE) optimization for short-form\
    \ video streaming. Our work involves understanding network conditions, user behaviors\
    \ and designing adaptive streaming algorithms for improved user experience in\
    \ short-form videos. In addition to multimedia networking, we also conduct research\
    \ related to privacy and security in mobile health applications, especially menstrual\
    \ health, women\u2019s health, sleep, wearable, and digital health apps. This\
    \ work examines app features, sensitive data collection, privacy-policy transparency,\
    \ user risks, and how personal health data may reveal sensitive conditions or\
    \ behavioral patterns.<br/><br/>AARON D. STRIEGEL's research interests focus on\
    \ instrumenting the wireless networked ecosystem to gain insight with respect\
    \ to user behavior and optimizing network performance. Flagship projects include\
    \ the NetSense, NetHealth, and IARPA MOSAIC projects involving the instrumentation\
    \ and analysis of data from hundreds of smartphones and wearables over a nearly\
    \ six year period of continuous data streaming. Further research interests include\
    \ heterogeneous network optimization (cellular, WiFi), content distribution via\
    \ edge device pre-staging, and network security dynamics. Published over one hundred\
    \ peer-reviewed papers in the literature with multiple best paper awards including\
    \ USENIX LISA, IEEE Healthcom, and HotPlanet. Served in various roles in the community\
    \ including recently serving as one of the TPC Co-Chairs for INFOCOM 2025, previously\
    \ as the general chair of ICCCN 2016, TPC chair of ICCN 2015, chair of HotPlanet\
    \ 2016, and the publication co-chair of INFOCOM 2016.  Also a member of the inaugural\
    \ Editorial Board for IEEE Networking Letters and is a former Associate Editor\
    \ for IEEE Transactions on Mobile Computing."
