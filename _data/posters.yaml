  title: 'Rising Above the Relational vs Document Database Debate: A Unified Perspective
    on Data Modeling'
- abstract: 'Signed graphs encode positive and negative relationships between entities
    and arise naturally in social network systems, trust systems, and opinion platforms.
    Existing work on clique mining in signed graphs relies on structural balance theory
    as the coherence criterion, but balance theory is known to be a poor fit for directed
    networks. Status theory, which interprets a positive edge from A to B as A asserting
    higher standing for B, better explains empirically observed link patterns in directed
    signed graphs.


    We study the problem of mining maximal cliques that are coherent under status
    theory rather than structural balance. This shift introduces concrete systems
    challenges: status coherence requires verifying consistent directed status orderings
    within candidate cliques, which demands efficient triangle counting, directed
    triad enumeration, and constraint propagation across partial solutions. Standard
    pruning and bounding techniques developed for unsigned or balance-based clique
    search do not transfer cleanly, as the status coherence constraint lacks the monotone
    decomposability that makes those approaches effective.


    We present an algorithmic framework that addresses these challenges through status-aware
    graph reduction, adapted branch-and-bound search, and early pruning via local
    status inconsistency detection. Experiments on real-world signed networks demonstrate
    significant search space reduction compared to naive baselines. This work opens
    new directions for coherence-aware subgraph mining on signed graphs.'
