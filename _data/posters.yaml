  long_bio: "Alexander Pirker is the CEO of Quantum Network Design (QND). The vision\
    \ of QND is to provide simulation software to design, analyze and optimize quantum\
    \ networks before building them. His main research fields and interests are quantum\
    \ network architectures and protocols, their control frameworks, simulations and\
    \ protocol stacks. But he is also interested in other topics, such as entanglement\
    \ purification protocols and measurement-based quantum computing. Previously,\
    \ he was a Senior-PostDoc at the University of Innsbruck in the group of Wolfgang\
    \ D\xFCr.<br/><br/>Robert J. Hayek is a predoctoral apointee within the Data Science\
    \ and Learning Division at Argonne National Laboratory. His research experience\
    \ lies in communication systems, specifically, quantum communications, 5G cellular\
    \ networks, federated learning, and synchronization protocol design. He received\
    \ his M.S. in Electrical Engineering from Northwestern University, Evanston, IL,\
    \ USA (2025), and his B.S. in Computer Engineering (2023) from Ohio Northern University,\
    \ Ada, OH, USA. He is an IEEE and ACM member.<br/><br/>Alexander Kolar is a Ph.D.\
    \ candidate in Quantum Science and Engineering at the Pritzker School of Molecular\
    \ Engineering, University of Chicago, as well as a visiting graduate student in\
    \ the Data Science and Learning Division at Argonne National Laboratory. His research\
    \ interests include quantum network hardware, especially focused on lanthanide-based\
    \ optical memories; quantum network infrastructure and control protocols; and\
    \ quantum network simulation, including ongoing contributions to the SeQUeNCe\
    \ simulator. He earned his B.S. in Computer Engineering and Applied Mathematics\
    \ from Northwestern University in 2021.<br/><br/>Igor Kadota is an Assistant Professor\
    \ of Electrical and Computer Engineering at Northwestern University. Previously,\
    \ he was a Postdoctoral Research Scientist at Columbia University. He received\
    \ the Ph.D. degree from MIT LIDS and his B.Sc. degree from the Aeronautics Institute\
    \ of Technology (ITA) in Brazil. His research is on modeling, analysis, optimization,\
    \ and implementation of next-generation communication networks, with the emphasis\
    \ on advanced wireless systems and time-sensitive applications.<br/>He was a recipient\
    \ of several research, teaching, and mentoring awards, including the Best Paper\
    \ Award at IEEE INFOCOM 2018, the Best Paper Award Finalist at ACM MobiHoc 2019,\
    \ the Best Student Paper Award at WiOpt 2024 and at WiOpt 2025, and the MIT School\
    \ of Engineering Graduate Student Extraordinary Teaching and Mentoring Award of\
    \ 2020. For additional information, please see: http://www.igorkadota.com<br/><br/>Joaquin\
    \ Chung is a research scientist at the Data Science and Learning Division at Argonne\
    \ National Laboratory. His main work focuses on studying architectures for scalable\
    \ quantum networks by both developing testbeds and simulations. He also has expertise\
    \ on designing systems for enabling memory-to-memory data streaming between federated\
    \ instruments and software-defined networking. He received both his B.S. in Electronics\
