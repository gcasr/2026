- abstract: The Quantum Science Center is investigating the integration of Quantum
    Computing with traditional HPC systems in preparation for deploying a scientifically
    useful quantum computer by the end of the decade. One of the central challenges
    we are facing is the effective implementation of Quantum Error Correction (QEC)
    in order to achieve the Fault Tolerant Quantum Computing (FTQC) regime. At ORNL,
    we are deploying an ecosystem of QEC testbeds in order to explore the capabilities
    of HPC architectures to support the classical processing needed by the QEC control
    loop. These testbeds will be designed to support the integration of different
    quantum modalities, control systems, HPC accelerators, and QEC codes/algorithms
    in a flexible ecosystem that can be dynamically configured for exploratory experimentation.
    The goal of these testbeds is to provide an experimental environment that supports
    the collaboration between quantum and classical HPC vendors, Department of Energy
    scientists, and the academic research community, with the ability to develop cross-stack
    solutions incorporating advances that span algorithmic approaches to low-level
    hardware architectural modifications.
