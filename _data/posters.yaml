  title: On the Feasibility of Time-Multiplexed Control for Surface Code Fault Tolerant
    Computation
- abstract: " AI-based quantum control and error correction is increasingly used in\n\
    quantum computing systems to improve multi-qubit readout discrimination and to\n\
    mitigate correlated readout errors. As such, AI is becoming an integral component\n\
    of today\u2019s quantum computers\u2019 control and readout stacks. Despite this\
    \ growing\nrole, the security implications of AI in these systems remain largely\
    \ unexamined,\nand the variety of security attacks are currently overlooked by\
    \ the vast majority of\nquantum computing research.\nThis work brings to light\
    \ the susceptibility of AI-based control and error\ncorrection to a variety of\
    \ security attacks. In particular, AI-based classifiers can be\nvulnerable to\
    \ physical fault-injection attacks, which can result in the generation of\nincorrect\
    \ readout results from quantum computers. More broadly, fault-injection\nor side-channel\
    \ attacks on AI algorithms, whether realized in software or hardware\nof the control\
    \ stack, can cause a range of problems, from integrity violations to loss\nof\
    \ intellectual property or exposure of sensitive data."
