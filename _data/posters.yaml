- abstract: "Record/Replay (RR) allows developers to record an execution and deterministically\
    \ replay it's behavior later to diagnose production bugs.\nUnfortunately, RR introduces\
    \ non-negligible performance overhead for multi-threaded and I/O bound workloads.\n\
    Recordings capture either a total or partial order of synchronization events,\
    \ which the replayer later enforces.\nPartial orders produce faster replays, but\
    \ require pre-processing before replay.\nRecording also effectively doubles the\
    \ I/O performed as any data read must be duplicated and written to the log. \n\
    \nWe present two complimentary techniques to reduce the overhead of RR.\nRelaxed\
    \ Total Order (RTO) is a weakening of total order that preserves cross-thread\
    \ constraints needed for replay while avoiding unnecessary serialization.\nRTO\
    \ can operate online (i.e., during runtime), enabling deterministic replay without\
    \ pre-processing the log.\nRTO's strictness is a novel point between total and\
    \ partial order.\nA prototype implementation in an existing RR system, JMVX, halves\
    \ recording overhead from 21.7% to 13.7% and replay overhead from 64.9% to 13.2%.\n\
    \nSecond, we combine RR with Multi-Version eXecution (MVX), a technique similar\
    \ to online RR, to eliminate RR's poor performance on I/O-bound processes.\nA\
    \ follower variant, i.e., an online replayer in a separate process, absorbs the\
    \ I/O needed for logging and backfills I/O which can be safely re-executed on\
    \ the same system, keeping the user-facing leader off the critical path.\nOur\
    \ prototype reduces the overhead on I/O bound programs from 196.1% to just 25.8%.\n\
    Together, RTO and hybrid MVX/RR substantially narrow the gap between today\u2019\
    s RR systems and practical, low-overhead, always-on deployment."
  authors: David Schwartz
