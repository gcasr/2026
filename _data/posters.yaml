- abstract: 'Underground mining operations are increasingly dependent on

    autonomous vehicles, robotic drilling systems, and intelligent in-

    spection platforms operating in confined, GPS-denied tunnel en-

    vironments. These systems rely on distributed perception models

    to interpret navigation cues, hazard warnings, and environmen-

    tal signals in real time. While centralized deep learning can en-

    hance model performance, transferring raw operational data across

    mining sites introduces serious confidentiality and security risks.

    Federated Learning (FL) offers a privacy-preserving alternative by

    enabling collaborative model training without sharing local datasets.

    However, deploying FL in underground mining introduces several

    critical challenges: (i) Training labels may be modified either mali-

    ciously by compromised clients or inadvertently due to harsh un-

    derground conditions like such as low illumination or physical dis-

    tortion of safety signs. Such alterations can result in label-flipping

    (LF) attacks, wherein corrupted semantic information propagates to

    the global model through poisoned local updates. (ii) Mining data

    is inherently heterogeneous and non-IID due to variations in tun-

    nel shapes or uneven terrains, making malicious updates difficult

    to distinguish from natural distribution shifts. (iii) Underground

    communication networks are bandwidth-constrained, limiting the

    feasibility of computationally intensive cryptographic defenses or

    repeated validation procedures. To address these challenges, we pro-

    pose TrustFed, a lightweight and unsupervised defense framework

    tailored for underground mining environments. TrustFed first fil-

    ters client updates by detecting abnormal last-layer gradient norms

    and then performs clustering in gradient space to identify adver-

    sarial behavior. Clients are assigned adaptive trust scores based

    on their proximity to cluster centroids, and global aggregation is

    conducted using a soft trust-weighted mechanism that suppresses

    malicious contributions while preserving informative updates. To

    facilitate realistic evaluation, we further introduce MineSigns, a

    vision-based dataset capturing 13 safety-critical signage classes

    under authentic tunnel conditions, including low illumination and structural irregularities.
    Extensive experiments on MineSigns and

    standard benchmarks demonstrate that TrustFed effectively miti-

    gates LF attacks and significantly improves global model robustness

    under both IID and non-IID mining scenarios. '
