    \ platform, GPU-accelerated computer vision pipelines on NVIDIA Jetson hardware,\
    \ and a production MJPEG streaming platform serving over 103 million images to\
    \ researchers.<br/>Beyond the lab, Om has experience building full-stack applications,\
