  title: 'VaultX: A Lightweight Proof-of-Space Consensus System'
- abstract: "Scientific applications are executed in a broad variety of cluster ecosystems\
    \ which use several layers of supporting technology to connect processes with\
    \ data and manage resources. The applications themselves are composed with invocations\
    \ of various domain specific software packages. \nMany applications benefit in\
    \ performance, scalability, and portability when described and executed as a task-based\
    \ workflow, with order of execution defined by a DAG (Directed-Acyclic-Graph).\
    \ The challenge in writing such a workflow is the description of tasks and their\
    \ dependencies in order to form the DAG. Programs often exhibit implicit behavior\
    \ and depend on unexpected information, making it difficult to define the behavior\
    \ of a task.\n\nThis work presents Contour, an I/O analysis and workflow composition\
    \ toolkit which observes a running application to create an execution contract.\
    \ The contract describes the behavior of the application and facilitates its transposition\
    \ to a high-level distributed workflow. Contour enables task-based workflow description\
    \ and execution for complex scientific applications. "
  authors: "Colin Thomas, Andr\xE9s Iglesias, Douglas Thain"
  board_number: L6
  institution: University of Notre Dame
  long_bio: 'Colin Thomas is a PhD candidate at the University of Notre Dame. His
    research in workflow systems engages the challenges faced with large scale, data-intensive
    scientific applications. Maximizing concurrency, efficient I/O utilization, and
    scheduling decisions are considered from the perspective of expression languages
    and the subsequent graph representation of a workflow. Finding optimal workflow
    representations at the compilation stage or near-runtime enables a reactive and
    efficient workflow system. '
